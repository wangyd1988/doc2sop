# 知识库应用。默认只起应用本身；模型网关、向量服务另行部署（见 docs/architecture.md）。
#
# 一键演示：.env 里 COMPOSE_PROFILES=demo（.env.example 已预置），或者命令行 --profile demo，
# 会多起一个极小的只读工具 sidecar（kb-ops）。它的工具全部来自 packs/ 下 DEMO_PACKS 列出的场景包，
# 不需要 docker socket、k8s 或任何自托管模型。正式部署（host 网络 + deploy/release.sh）不走这个文件，
# 见 docs/正式部署.md；步骤见 docs/五分钟演示.md。
#
# 容器名、镜像名、宿主机端口、资源上限都是带默认值的变量：一台机器要跑第二套（比如正式站旁边再起一个
# 演示站）时，在另一个目录 clone 后只改那份 .env 里的 APP_* / OPS_*，compose 项目名跟目录走，网络和卷互不干扰。
services:
  kb-app:
    build:
      context: .
      args:
        # 国内拉不动 Docker Hub 时，.env 里设 BASE_IMAGE=docker.m.daocloud.io/library/python:3.12-slim
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
    image: ${APP_IMAGE:-kb-app:latest}
    container_name: ${APP_CONTAINER:-kb-app}
    restart: unless-stopped
    env_file: .env
    ports:
      # 左边是宿主机端口（APP_PORT），右边是容器内的 8765；改端口只改 APP_PORT，别动 .env 的 PORT
      - "127.0.0.1:${APP_PORT:-8765}:8765"
    volumes:
      - ./data:/data
      # 场景包只读挂进来：改包里的文档 / SOP 不用重建镜像（镜像里也有一份，挂载会盖住它）
      - ./packs:/srv/packs:ro
    # 容器访问宿主机上的服务（本机网关、宿主机工具服务）用 host.docker.internal；Linux 需要这一行，Docker Desktop 上无害
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Sized for a 2 vCPU / 2 GB host that also runs other services.
    mem_limit: ${APP_MEM_LIMIT:-900m}
    cpus: ${APP_CPUS:-1.5}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8765/',timeout=5)\" || exit 0"]
      interval: 60s
      timeout: 10s
      retries: 3

  kb-ops:
    profiles: [demo]
    build:
      context: deploy
      dockerfile: demo/Dockerfile.ops
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
    image: ${OPS_IMAGE:-kb-ops:latest}
    container_name: ${OPS_CONTAINER:-kb-ops}
    restart: unless-stopped
    environment:
      # 和 kb-app 读同一个 .env 值，用户不用两边对齐；留空时 up 直接报错，而不是起一个连不上的服务
      OPS_TOKEN: ${OPS_TOKEN:?请在 .env 里给 OPS_TOKEN 填一串随机字符}
      # 导入哪些包，sidecar 就只提供哪些包的工具（入口脚本据此生成 include）
      DEMO_PACKS: ${DEMO_PACKS:-}
      # 「模型网关」组工具复用 .env 里的模型地址与 key（入口脚本会去掉结尾的 /v1）。
      # 页面上填的模型不会传到这里——工具凭据永远不经过页面，这是既定边界。
      OPS_SECRET_GATEWAY_URL: ${LLM_BASE_URL:-}
      OPS_SECRET_GATEWAY_KEY: ${LLM_API_KEY:-}
    volumes:
      - ./packs:/packs:ro
      # 生成的工具定义及其旁路文件（页面上的启停、待审申请）放在卷里，重启不丢
      - ops-state:/ops
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 故意不发布端口：只有同一 compose 网络里的 kb-app 能访问它（OPS_URL 里的 kb-ops 是服务名，容器改名不影响），令牌是第二道保险
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8799/health',timeout=5)\""]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  ops-state:
