# Knowledge base web app. The model gateway and embedding server run elsewhere
# (see docs/architecture.md); this compose file only starts the app itself.
services:
  kb-app:
    build: .
    image: kb-app:latest
    container_name: kb-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/data
    # Sized for a 2 vCPU / 2 GB host that also runs other services.
    mem_limit: 900m
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8765/',timeout=5)\" || exit 0"]
      interval: 60s
      timeout: 10s
      retries: 3
