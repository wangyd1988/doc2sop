async function ask() {
  const q = $('question').value.trim();
  if (!q || $('askBtn').disabled) return;
  const playbookId = pendingPlaybook && q.startsWith(pendingPlaybook.prefix) ? pendingPlaybook.id : undefined;
  pendingPlaybook = null;
  $('question').value = ''; autosize();
  if ($('thread').querySelector('.welcome')) $('thread').innerHTML = '';
  addUser(q);
  const bot = addBot('<div class="status"></div><div class="answer"></div>');
  const card = bot.querySelector('.card'), ans = bot.querySelector('.answer');
  // 等待态按服务端的阶段事件换文案，并跟着走秒；status 被 delta 分支移除后（模型先说一句再调工具）要能补回来
  const t0 = performance.now(); let tFirst = 0;
  const tick = () => ((performance.now() - t0) / 1000).toFixed(1) + ' s';
  const setStatus = html => {
    let st = card.querySelector('.status');
    if (!st) { st = document.createElement('div'); st.className = 'status'; card.insertBefore(st, ans); }
    st.innerHTML = `<span class="spin"></span><span class="txt">${html}</span><span class="tick">${tick()}</span>`;
  };
  const clearStatus = () => card.querySelector('.status')?.remove();
  const ticker = setInterval(() => { const el = card.querySelector('.status .tick'); if (el) el.textContent = tick(); }, 200);
  setStatus('正在检索知识库…');
  toBottom();
  $('askBtn').disabled = true;
  let text = '', pending = false, finished = false, candidates = 0, answered = false;
  const wasNew = !convId;
  const webSrc = [];
  // 渲染推迟到下一帧；流结束后才执行的那一帧不能再把光标加回去。
  const paint = () => { pending = false; if (finished) return; const stick = nearBottom(); ans.innerHTML = md(text); ans.classList.add('cursor'); if (stick) toBottom(); };
  try {
    const r = await fetch('/api/ask', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                       body: JSON.stringify({question: q, conversation_id: convId, web: webOn,
                                                             model: modelPick || undefined,
                                                             playbook_id: playbookId})});
    if (r.status === 503) { const d = await r.json().catch(() => ({})); throw new Error((d.detail || '服务未就绪') + '（点右上角「管理」）'); }
    if (!r.ok) { const d = await r.json().catch(() => ({detail: r.status})); throw new Error(d.detail); }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream: true}); let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const msg = JSON.parse(buf.slice(0, nl)); buf = buf.slice(nl + 1);
        if (msg.conversation) {
          convId = msg.conversation.id;
          if (msg.model) bot.dataset.model = msg.model;
          if (msg.execution_id) bot.dataset.exec = msg.execution_id;
        } else if (msg.stage) {
          setStatus(msg.stage === 'rewrite' ? '正在结合上文理解问题…'
                  : msg.stage === 'retrieve' ? '正在检索知识库（向量 + 关键词）…'
                  : msg.stage === 'rerank' ? '找到候选片段，正在重排…'
                  : msg.stage === 'think' ? (candidates ? `检索到 ${candidates} 个候选片段，模型正在判断相关性并组织回答…` : '模型思考中…')
                  : '处理中…');
        } else if (msg.thinking) {
          // 思考型模型出正文前的推理片段数：数字在涨就说明模型在动
          setStatus(`模型思考中（已推理 ${msg.thinking} 步）…`);
        } else if (msg.sources) {
          bot.dataset.retr = ((performance.now() - t0) / 1000).toFixed(1);
          candidates = msg.sources.length;
          bot.querySelector('.sources').innerHTML = sourcesHtml(msg.sources);
          arrangeSources(bot, '', false);
        } else if (msg.tool_call) {
          const cat = stepCategory(msg.tool_call), tool = msg.tool_call.tool;
          setStatus(cat === 'web' ? '知识库里没有足够信息，正在上网搜索…'
                  : cat === 'knowledge' ? (tool === 'kb_read' ? '正在读知识库原文的前后文…'
                                         : tool === 'kb_catalog' ? '正在查看知识库目录…' : '正在检索知识库…')
                  : cat === 'internal' ? '正在更新待办清单…'
                  : `正在查询：${esc(tool)}…`);
          bot.querySelector('.steps').insertAdjacentHTML('beforeend', stepHtml(msg.tool_call, true));
          if (nearBottom()) toBottom();
        } else if (msg.web_sources) {
          webSrc.push(...msg.web_sources);
          bot.querySelector('.sources').insertAdjacentHTML('beforeend', sourcesHtml(msg.web_sources));
          arrangeSources(bot, '', false);
        } else if (msg.kb_sources) {
          // 模型补查 / 读前后文拿到的片段：编号接着往下编，和联网结果一样追加卡片
          bot.querySelector('.sources').insertAdjacentHTML('beforeend', sourcesHtml(msg.kb_sources));
          arrangeSources(bot, '', false);
        } else if (msg.plan) {
          showPlan(bot, msg.plan);
          if (nearBottom()) toBottom();
        } else if (msg.tool_result) {
          const steps = bot.querySelectorAll('.step.running');
          const step = steps[steps.length - 1];
          if (step) {
            step.classList.remove('running');
            step.querySelector('.n').textContent = `${msg.tool_result.lines} 行`;
            step.querySelector('.ret').textContent = msg.tool_result.preview;
            if (msg.tool_result.chars > (msg.tool_result.preview || '').length)
              step.querySelector('.out').insertAdjacentHTML('beforeend',
                `<div class="trunc">仅显示前 ${msg.tool_result.preview.length} 字，共 ${msg.tool_result.chars} 字 / ${msg.tool_result.lines} 行</div>`);
          }
          setStatus('工具已返回，模型正在分析…');
          if (nearBottom()) toBottom();
        } else if (msg.delta) {
          clearStatus();
          text += msg.delta;
          if (msg.delta.trim()) answered = true;
          if (!tFirst) tFirst = performance.now();
          if (!pending) { pending = true; requestAnimationFrame(paint); }
        } else if (msg.error) {
          // 检索一失败流就结束了，转圈要立刻停，错误随正文一起画出来
          clearStatus();
          text += `\n\n⚠️ ${msg.error}`;
        }
      }
    }
    finished = true;
    clearStatus();
    ans.innerHTML = md(text || '（没有返回内容）');
  } catch (e) {
    finished = true;
    clearStatus();
    ans.innerHTML = md(text) + `<p class="error">请求失败：${esc(e.message)}</p>`;
  } finally {
    finished = true;
    clearInterval(ticker);
    ans.classList.remove('cursor');
    // 新对话这一轮没答出任何东西：服务端已把它删掉，这边也忘掉它的 id，下一问重新开
    if (wasNew && !answered) convId = null;
    arrangeSources(bot, text, true);
    bot.dataset.took = ((performance.now() - t0) / 1000).toFixed(1);
    if (tFirst) bot.dataset.first = ((tFirst - t0) / 1000).toFixed(1);
    addTools(bot, text, q, webSrc);
    $('askBtn').disabled = false; $('question').focus();
    loadConvs();
    // 自由排查（没带 SOP）用了 ≥2 次数据类工具：服务端可能在后台长出一个 SOP 提议，退避轮询取回
    if (sopGrowth && !playbookId && bot.dataset.exec && bot.querySelectorAll('.step[data-cat="data"]').length >= 2) pollProposal(bot);
  }
}

/* 模型选择：列表来自网关（这把 key 能用的模型），选择记在浏览器里。

function pollReindex(id) {
  clearInterval(stPoll);
  stPoll = setInterval(async () => {
    const j = await fetch('/api/jobs/' + id).then(r => r.ok ? r.json() : null).catch(() => null);
    if (!j) return clearInterval(stPoll);
    const el = $('stJob'); if (el) el.textContent = j.stage;
    if (j.status === 'done' || j.status === 'error') { clearInterval(stPoll); toast(j.status === 'done' ? `索引重建完成：${j.result.rebuilt}/${j.result.total}` : '重建失败：' + j.detail, j.status === 'done' ? 'ok' : 'err', 8000); renderSettings(); loadDocs(); }
  }, 1500);
}
function stBody(reindex) {
  return {llm_base_url: $('stUrl').value.trim(), llm_api_key: $('stKey').value, chat_model: $('stChat').value.trim(),
          embed_model: $('stEmbed').value.trim(), vision_models: $('stVision').value.split(',').map(s => s.trim()).filter(Boolean),
          embed_base_url: $('stEmbedUrl').value.trim(), embed_api_key: $('stEmbedKey').value,
          rerank_model: $('stRerank').value.trim(), reindex};
}
$('msettings').addEventListener('click', async e => {
  const id = e.target.id;
  const preset = e.target.dataset.preset;
  if (preset === 'siliconflow') {
    $('stUrl').value = 'https://api.siliconflow.cn/v1'; $('stChat').value = 'deepseek-ai/DeepSeek-V4-Flash'; $('stEmbed').value = 'BAAI/bge-m3';
    $('stEmbedUrl').value = ''; $('stEmbedKey').value = ''; $('stVision').value = ''; $('stRerank').value = '';
    toast('示例填好了：对话和向量都走硅基流动，一把 key 填一处即可。模型名以硅基流动「模型广场」为准；想让演示里的「模型网关」工具也能用，请把地址和 key 写进 .env。', '', 10000);
    $('stKey').focus(); return;
  }
  if (preset === 'gateway') {
    $('stUrl').value = 'http://127.0.0.1:4000/v1'; $('stChat').value = 'kb-chat'; $('stEmbed').value = 'kb-embedding';
    $('stEmbedUrl').value = ''; $('stVision').value = 'kb-vision'; $('stRerank').value = 'kb-rerank'; $('stKey').focus(); return;
  }
  if (preset === 'direct') {
    $('stUrl').value = 'https://api.deepseek.com/v1'; $('stChat').value = 'deepseek-chat';
    $('stEmbedUrl').value = 'https://api.siliconflow.cn/v1'; $('stEmbed').value = 'BAAI/bge-m3'; $('stVision').value = ''; $('stRerank').value = '';
    toast('示例填好了：对话用 DeepSeek，向量用硅基流动的 bge-m3。换成您自己的两把 key 即可；图片识别留空表示不识别文档内图片。', '', 9000);
    $('stKey').focus(); return;
  }
  if (id === 'stTest') {
    e.target.disabled = true; e.target.textContent = '测试中…';
    const box = $('stResult'); box.hidden = false; box.className = 'result'; box.textContent = '正在连接网关、调用对话模型和向量模型…';
    try {
      const r = await fetch('/api/settings/test', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(stBody(false))});
      const d = await r.json(); if (!r.ok) throw new Error(Array.isArray(d.detail) ? d.detail.map(x => x.msg).join('；') : d.detail);
      stTest = d;
      $('stModels').innerHTML = (d.models || []).map(m => `<option value="${esc(m)}">`).join('');
      box.className = 'result ' + (d.ok ? 'ok' : 'err');
      box.innerHTML = `${d.models.length ? `对话地址可达，这把 key 能用 ${d.models.length} 个模型。` : esc(d.models_note || '')}<br>对话模型：${d.chat ? '✓ ' + (d.chat === '可调用' ? '可调用' : '回复「' + esc(d.chat) + '」') : '✕'}　向量模型${d.separate_embed ? '（独立地址）' : ''}：${d.embed ? '✓ ' + d.embed_dim + ' 维' : '✕'}${d.rerank !== null && d.rerank !== undefined ? '　重排：' + (d.rerank === 'ok' ? '✓' : '✕') : ''}`
        + (d.dim_mismatch ? `<br>⚠ ${esc(d.dim_mismatch)}` : '') + (d.errors.length ? `<ul>${d.errors.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '');
    } catch (err) { box.className = 'result err'; box.textContent = '测试失败：' + err.message; }
    e.target.disabled = false; e.target.textContent = '测试连接'; return;
  }
  if (id === 'stSave' || id === 'stSaveReindex') {
    const reindex = id === 'stSaveReindex' || !!$('stReindexCk')?.checked;
    e.target.disabled = true;
    try {
      const r = await fetch('/api/settings', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(stBody(reindex))});
      const d = await r.json();
      if (r.status === 409) {
        const w = $('stWarn'); w.hidden = false;
        w.innerHTML = `${esc(d.detail)}<label><input type="checkbox" id="stReindexCk" checked> 同时重建索引（${esc($('stEmbed').value)}）</label>`;
        return;
      }
      if (!r.ok) throw new Error(Array.isArray(d.detail) ? d.detail.map(x => x.msg).join('；') : d.detail);
      toast(d.reindex_job ? '已保存，索引正在后台重建' : '已保存并生效', 'ok');
      await renderSettings(); loadDocs(); loadModels();
      if (d.reindex_job) pollReindex(d.reindex_job);
    } catch (err) { toast('保存失败：' + err.message, 'err'); }
    finally { e.target.disabled = false; }
    return;
  }
  if (id === 'stReset') {
    if (!confirm('删掉页面上改过的全部模型设置，回到 .env 的值？')) return;
    await fetch('/api/settings', {method: 'DELETE'}); toast('已恢复 .env 的设置', 'ok'); renderSettings(); loadModels(); return;
  }
  if (id === 'stReindex') {
    if (!confirm('用当前向量模型重新向量化全部文档？期间检索结果会不完整。')) return;
    const d = await (await fetch('/api/settings/reindex', {method: 'POST'})).json();
    toast('索引重建已开始', 'ok'); pollReindex(d.reindex_job); return;
  }
});

$('mnav').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  mTab = b.dataset.tab; mGroup = null; mItem = null; mSearch = '';
  tlEditing = null; tlProposing = false; pbEditing = null; pbPicking = false;
  localStorage.setItem('kb-mtab', mTab); renderManage();
});
$('mgroups').addEventListener('click', e => {
  const g = e.target.closest('[data-mgroup]'); if (!g) return;
  mGroup = g.dataset.mgroup; mSearch = ''; mItem = null; tlProposing = false; pbEditing = null; pbPicking = false; renderManage();
});
$('mlist').addEventListener('click', e => {
  const row = e.target.closest('[data-mitem]');
  if (row) {
    mItem = row.dataset.mitem; tlEditing = null; tlProposing = false; pbEditing = null; pbPicking = false;
    $('mrows').querySelectorAll('.mrow').forEach(r => r.classList.toggle('on', r === row));
    renderDetail(); return;
  }
  const more = e.target.closest('[data-docmore]');
  if (more) {
    const list = $('mrows')._docList || [], from = +more.dataset.docmore;
    more.insertAdjacentHTML('beforebegin', list.slice(from, from + PAGE).map(docRow).join(''));
    const left = list.length - from - PAGE;
    more.outerHTML = left > 0 ? `<button class="more" data-docmore="${from + PAGE}">加载更多（还有 ${left} 条）</button>` : '';
    return;
  }
  if (e.target.id === 'mUpload') return $('files').click();
  if (e.target.id === 'mNewTool') { tlProposing = true; tlProposeKind = 'command'; tlParamState = {}; mItem = null; return renderDetail(); }
  if (e.target.id === 'mNewSop') { pbEditing = {steps: []}; pbPicking = false; mItem = null; return renderDetail(); }
  if (e.target.id === 'mExtract') { pbPicking = true; pbEditing = null; pbDocFilter = ''; mItem = null; return renderDetail(); }
});
$('mlist').addEventListener('input', e => {
  if (e.target.id !== 'mSearch') return;
  mSearch = e.target.value; mSearchFocus = true;
  clearTimeout(searchTimer); searchTimer = setTimeout(renderManage, 250);
});
$('mdetail').addEventListener('click', async e => {
  const x = e.target.closest('[data-mextract]');
  if (x) {
    x.disabled = true; x.textContent = '抽取中…';
    try {
      const r = await fetch('/api/playbooks/extract', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({source: x.dataset.mextract})});
      const d = await r.json();
      if (!r.ok) throw new Error(Array.isArray(d.detail) ? d.detail.map(v => v.msg).join('；') : d.detail);
      toast(d.extracted.length ? `抽取出 ${d.extracted.length} 个 SOP，已默认停用；去 SOP 页核对后启用。${d.note ? '\n' + d.note : ''}`
                               : `没有抽出 SOP。原因：${d.note || '未知'}`, d.extracted.length ? 'ok' : 'err', 8000);
      if (d.extracted.length) { mTab = 'sop'; mGroup = x.dataset.mextract; mItem = d.extracted[0].id; localStorage.setItem('kb-mtab', 'sop'); renderManage(); }
      else renderDetail();
    } catch (err) { toast('抽取失败：' + err.message, 'err'); renderDetail(); }
    return;
  }
  if (mTab === 'docs') docActions(e);
});
// 文档页上传完成后 loadDocs 会触发 renderManage；上传进度条借用侧栏的队列元素，搬到列表栏顶部
/* 分栏宽度可拖：对话页侧栏、管理页的分组栏 / 详情栏各自记在浏览器里，双击分隔条恢复默认 */
const SPLIT = {aside: [240, 520, 300], mgroups: [160, 420, 230], mdetail: [300, 800, 440]};   // [最小, 最大, 默认]
const paneOf = id => id === 'aside' ? document.querySelector('body > aside') : $(id);
function applySplit() {
  for (const id in SPLIT) {
    const w = +localStorage.getItem('kb-w-' + id);
    paneOf(id).style.width = (w >= SPLIT[id][0] && w <= SPLIT[id][1] ? w : SPLIT[id][2]) + 'px';
  }
}
document.querySelectorAll('.msplit').forEach(bar => {
  const id = bar.dataset.split, pane = paneOf(id), [min, max, def] = SPLIT[id];
  bar.addEventListener('dblclick', () => { localStorage.removeItem('kb-w-' + id); applySplit(); });
  bar.addEventListener('pointerdown', e => {
    e.preventDefault(); bar.setPointerCapture(e.pointerId); bar.classList.add('on'); document.body.classList.add('resizing');
    const x0 = e.clientX, w0 = pane.getBoundingClientRect().width, dir = id === 'mdetail' ? -1 : 1;
    // 管理页的上限还要给列表栏留出最小宽度，不然工具栏按钮会被挤出去
    let cap = max;
    if (id !== 'aside') {
      const other = $(id === 'mdetail' ? 'mgroups' : 'mdetail').getBoundingClientRect().width;
      cap = Math.min(max, $('manage').getBoundingClientRect().width - $('mnav').getBoundingClientRect().width - other - 360 - 10);
    }
    const move = ev => { pane.style.width = Math.min(cap, Math.max(min, w0 + dir * (ev.clientX - x0))) + 'px'; };
    const up = () => { bar.classList.remove('on'); document.body.classList.remove('resizing');
      localStorage.setItem('kb-w-' + id, Math.round(pane.getBoundingClientRect().width));
      bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); bar.removeEventListener('pointercancel', up); };
    bar.addEventListener('pointermove', move); bar.addEventListener('pointerup', up); bar.addEventListener('pointercancel', up);
  });
});
if (MANAGE) {
  mReady = true; applySplit();
  mTab = location.hash === '#settings' ? 'settings' : (localStorage.getItem('kb-mtab') || 'tools');
  loadDocs().then(() => { $('mlist').insertBefore($('queue'), $('mrows')); renderManage(); });
} else {
  applySplit();
  welcome(); loadDocs(); loadConvs(); $('question').focus();
  // 从管理页「▶ 执行」跳过来：带着问题（和 SOP id），必要时直接发送
  const params = new URLSearchParams(location.search);
  if (params.get('q')) {
    $('question').value = params.get('q'); autosize();
    if (params.get('pb')) pendingPlaybook = {id: params.get('pb'), prefix: params.get('q').split('（')[0]};
    history.replaceState(null, '', '/');
    if (params.get('send')) ask();
    else { const v = $('question').value; $('question').setSelectionRange(v.length - 1, v.length - 1); }
  }
}
</script>
</body>
</html>
