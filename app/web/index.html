    <div class="frow"><span>触发哪个 SOP<i>只能是启用的</i></span><select id="afSop" ${r.id ? 'disabled' : ''}>${bookOptions(book)}</select></div>
    <div class="frow"><span>告警名包含<i>告警名或标题，不分大小写</i></span><input id="afName" maxlength="100" value="${esc(r.name_contains)}" placeholder="如 DiskFull、磁盘"></div>
    <div class="frow"><span>标签等于<i>一行一个 名字=值，都要对上</i></span><textarea id="afLabels" placeholder="severity=critical">${esc(Object.entries(r.labels || {}).map(([k, v]) => `${k}=${v}`).join('\n'))}</textarea></div>
    <div class="frow"><span>去重（分钟）<i>同一条告警多久内只触发一次</i></span><input id="afDedup" type="number" min="1" max="1440" value="${r.dedup_minutes || 30}"></div>
    <div id="afParams">${paramRows(book, r.params)}</div>${notifyRows(r.notify)}
    <div class="frow"><span>启用</span><div class="checks"><label><input type="checkbox" id="afEnabled"${r.enabled ? ' checked' : ''}>收到对得上的告警就执行</label></div></div>
    <div class="pb-err" id="afErr" hidden></div>
    <div class="row"><button class="pri" data-afsave>保存</button><button data-afcancel>取消</button></div></div>`;
}
function showKindRows() {
  const kind = $('afKind')?.value; if (!kind) return;
  document.querySelectorAll('.autoform [data-for]').forEach(x => { x.hidden = !x.dataset.for.split(' ').includes(kind); });
}
async function renderAuto() {
  if (!$('msettings').querySelector('.sf.auto')) $('msettings').innerHTML = '<div class="sf"><div class="empty">加载中…</div></div>';
  const qs = autoSop ? '?playbook_id=' + encodeURIComponent(autoSop) : '';
  const [st, sc, rl, ev, books] = await Promise.all([
    fetch('/api/automation').then(r => r.json()).catch(() => ({})),
    fetch('/api/schedules' + qs).then(r => r.json()).catch(() => ({schedules: []})),
    fetch('/api/alert-rules' + qs).then(r => r.json()).catch(() => ({rules: []})),
    fetch('/api/alerts/events?limit=20').then(r => r.json()).catch(() => ({events: []})),
    pbAllList(true)]);
  if (page !== 'sop' || pbTab !== 'auto') return;
  autoState = {groups: st.groups || [], books, schedules: sc.schedules || [], rules: rl.rules || []};
  const lim = st.limits || {}, mail = st.mail || {}, alerts = st.alerts || {};
  const hook = location.origin + (st.hook_path || '/api/alerts/hook');
  const problems = [...(st.problems || []), st.loose].filter(Boolean);
  const table = (head, rows, none) => rows ? `<table class="ax stack"><tr>${head.map(x => `<th>${x}</th>`).join('')}</tr>${rows}</table>` : `<div class="note">${none}</div>`;
  $('msettings').innerHTML = `<div class="sf auto">
    <h2>自动执行</h2>
    <p class="lead">让 SOP 到点自己跑（比如每天 9 点巡检），或者收到告警时自己跑；每次都在「执行记录」里留一份，有异常、没跑成、没法判断时发邮件。
      和对话里的「▶ 执行」同一套规则：只用批准过的只读工具，不联网，结论只依据工具数据和知识库。</p>
    <div class="filter"><span>只看</span><select id="autoSop"><option value="">全部 SOP</option>${books.map(b =>
      `<option value="${esc(b.id)}"${autoSop === b.id ? ' selected' : ''}>${esc(b.name)}${b.enabled ? '' : '（已停用）'}</option>`).join('')}</select>
      <span class="pill ${mail.configured ? 'ok' : 'off'}">${mail.configured ? '✓ 邮件已配置' : '– 邮件没配置'}</span>
      <span class="pill ${alerts.enabled ? 'ok' : 'off'}">${alerts.enabled ? '✓ 告警入口已打开' : '– 告警入口关着'}</span>
      ${st.scheduler === false ? '<span class="pill warn">定时执行在服务器上关了（SCHEDULER=false）</span>' : ''}</div>
    ${problems.length ? `<div class="warn" style="margin:0 0 14px"><b>服务器上的配置文件有问题：</b><ul class="ax">${problems.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>` : ''}
    <div class="card"><h3>定时计划 <small>北京时间；每隔 N 分钟的最少 ${lim.min_every || 15} 分钟；一共最多 ${lim.max_schedules || 50} 条</small></h3>
      ${table(['SOP', '时间', '邮件', '下次', '上次', ''], scheduleRows(autoState.schedules), '还没有计划。')}
      ${autoForm && autoForm.kind === 'schedule' ? scheduleForm(autoForm.item) : `<div class="row"><button class="pri" data-afnew="schedule" ${enabledBooks().length ? '' : 'disabled'}>＋ 添加计划</button></div>`}
      <div class="howto"><b>错过了怎么办：</b>部署、重启时应用没在运行，到点的执行迟到 ${lim.grace_minutes || 10} 分钟以内照常跑；更晚的记一条「错过」，<b>不补跑</b>（过时的巡检结果容易误导人），下一次照常按时执行。
        同时最多 ${lim.max_running || 2} 个自动执行在跑；同一个 SOP 上一次还没跑完，这一次记成「跳过」。</div></div>
    <div class="card"><h3>告警规则 <small>告警名包含什么、标签等于什么 → 触发哪个 SOP</small></h3>
      ${table(['SOP', '条件', '去重', '邮件', '最近触发', ''], ruleRows(autoState.rules), '还没有告警规则。')}
      ${autoForm && autoForm.kind === 'rule' ? ruleForm(autoForm.item) : `<div class="row"><button class="pri" data-afnew="rule" ${enabledBooks().length ? '' : 'disabled'}>＋ 添加告警规则</button></div>`}
      <div class="howto">每个 SOP 每小时最多被告警触发 ${lim.per_hour || 4} 次；同一条告警（Alertmanager 的 fingerprint，或标题加标签）在去重时间内只触发一次；已恢复的告警不触发。
        告警内容只当背景资料放进提问，不当指令。</div></div>
    <div class="card"><h3>最近收到的告警 <small>保留 7 天：对上了哪条规则、有没有触发</small></h3>
      ${table(['时间', '告警', '标签', '结果', '来源'], eventRows(ev.events || []), alerts.enabled ? '还没有收到过告警。' : '告警入口关着，还没有收到过告警。')}</div>
    <div class="card"><h3>邮件 <small>SMTP 和收件人在服务器上配，页面上只能选收件组的名字</small></h3>
      <dl><dt>状态</dt><dd>${mail.configured ? `已配置（${esc(mail.security === 'starttls' ? 'STARTTLS' : mail.security === 'ssl' ? 'SSL' : '不加密')}）` : '没有配置：自动执行照常跑，只是不发邮件'}</dd>
        <dt>收件组</dt><dd>${(st.groups || []).map(g => `<span class="pill">${esc(g.name)} · ${g.count} 人</span>`).join(' ') || '还没有'}</dd>
        <dt>报告链接</dt><dd>${st.site_url ? `<code>${esc(st.site_url)}</code>` : '没配 site_url：邮件里没有报告链接'}</dd></dl>
      <div class="row"><select id="testGroup" ${mail.configured && (st.groups || []).length ? '' : 'disabled'}>${(st.groups || []).map(g =>
        `<option value="${esc(g.name)}">${esc(g.name)}</option>`).join('') || '<option>（没有收件组）</option>'}</select>
        <button data-testmail ${mail.configured && (st.groups || []).length ? '' : 'disabled'}>发一封测试邮件</button>
        <span class="note">同一个组每分钟最多一封，每次都记日志</span></div></div>
    <div class="card"><h3>告警入口 <small>给 Prometheus Alertmanager 或任何能发 webhook 的监控用</small></h3>
      <dl><dt>状态</dt><dd>${alerts.enabled ? '已打开' : '关着：服务器上没有配告警令牌，访问这个地址会得到 404'}</dd>
        <dt>地址</dt><dd><code>POST ${esc(hook)}</code></dd>
        <dt>认证</dt><dd>请求头 <code>Authorization: Bearer &lt;告警令牌&gt;</code>（令牌在服务器上配，不是网页密码；网页密码打不开它）</dd>
        <dt>来源限制</dt><dd>${(alerts.clients || []).length ? (alerts.clients || []).map(c => `<code>${esc(c)}</code>`).join(' ') : '不限（可以在服务器上配 alerts.clients）'}</dd></dl>
      <div class="howto"><b>Alertmanager：</b>在 receivers 里加一个 webhook，令牌写在 Alertmanager 机器上的文件里：
        <pre class="cfg">receivers:
  - name: doc2sop
    webhook_configs:
      - url: ${esc(hook)}
        send_resolved: false
        http_config:
          authorization:
            credentials_file: /etc/alertmanager/doc2sop.token</pre>
        <b>别的监控（通用 JSON）：</b><pre class="cfg">curl -X POST ${esc(hook)} \\
  -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \\
  -d '{"title": "磁盘使用率高", "content": "/ 用了 91%", "labels": {"host": "gw"}}'</pre></div></div>
    <div class="card"><h3>服务器上的配置文件 <small>邮件、收件组、告警令牌都在这里，改了不用重启</small></h3>
      <dl><dt>文件</dt><dd><code>${esc(st.file || '')}</code>${st.exists ? '' : '（还没有）'}</dd></dl>
      <div class="howto">在宿主机上编辑这个文件（容器里的 <code>/data</code> 就是宿主机的数据目录），然后 <code>chmod 600</code>——里面有邮箱授权码和告警令牌。保存后下一次用到时生效，不用重启。
        <pre class="cfg">site_url: http://10.0.0.5:8765        # 邮件里「查看完整报告」指向这里
mail:
  host: smtp.qq.com
  port: 465
  security: ssl                        # 465 用 ssl，587 用 starttls
  user: bot@example.com
  password: 邮箱的授权码
  from: doc2sop 巡检 &lt;bot@example.com&gt;
groups:                                # 页面上只能选这些名字
  运维值班: [a@example.com, b@example.com]
alerts:
  token: 用 openssl rand -hex 32 生成
  clients: [10.0.0.0/8]                # 可选：只接受这些来源</pre></div></div>
  </div>`;
  showKindRows();
}
function autoFormBody() {
  const form = $('msettings').querySelector('.autoform'); if (!form) return null;
  const params = Object.fromEntries([...form.querySelectorAll('[data-afparam]')].map(x => [x.dataset.afparam, x.value.trim()]));
  const notify = {group: $('afGroup').value, when: $('afWhen').value, repeat: $('afRepeat').value};
  const base = {playbook_id: $('afSop').value, params, notify, enabled: $('afEnabled').checked};
  if (form.dataset.form === 'schedule') {
    return {...base, kind: $('afKind').value, at: $('afAt').value, every: +$('afEvery').value,
            weekdays: [...form.querySelectorAll('[data-wd]:checked')].map(x => +x.dataset.wd)};
  }
  const labels = {};
  for (const line of $('afLabels').value.split('\n').map(x => x.trim()).filter(Boolean)) {
    const at = line.indexOf('=');
    if (at < 1) throw new Error(`标签条件要写成 名字=值：${line}`);
    labels[line.slice(0, at).trim()] = line.slice(at + 1).trim();
  }
  return {...base, name_contains: $('afName').value.trim(), labels, dedup_minutes: +$('afDedup').value};
}
async function sendJson(method, path, body) {
  const r = await fetch(path, {method, headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : `请求失败（${r.status}）`);
  return d;
}

/* ---------- 知识库缺口：文档页的「知识库缺口」页签、工作台的卡片 ---------- */
function gapRow(g) {
  const kinds = Object.entries(g.kinds || {}).map(([k, n]) => `<span class="pill">${esc(GAP_KIND[k] || k)}${n > 1 ? ' ' + n : ''}</span>`).join('');
  const others = (g.questions || []).filter(q => q !== g.example);
  return `<div class="gap-row"><div class="cnt">${g.count}<small>次</small></div>
    <div style="min-width:0"><div class="ex">${esc(g.example)}</div><div class="meta">最近一次 ${esc(ago(g.last_at))}${g.detail ? ' · ' + esc(g.detail) : ''}</div>
      <div class="chipset">${kinds}</div>
      ${others.length ? `<details><summary>同一类的其他问法（${others.length}）</summary><ul>${others.map(q => `<li>${esc(q)}</li>`).join('')}</ul></details>` : ''}</div>
    <div class="acts"><button class="btn sm" data-gapopen="${esc(g.id)}">看当时的回答</button>
      <button class="btn sm pri" data-gapupload>去上传文档</button><button class="btn sm" data-gapignore="${esc(g.id)}">忽略</button></div></div>`;
}
async function renderGaps() {
  if (!$('msettings').querySelector('.sf.gaps')) $('msettings').innerHTML = '<div class="sf"><div class="empty">加载中…</div></div>';
  const d = await fetch('/api/gaps').then(r => r.json()).catch(() => ({groups: [], total: 0, questions: 0}));
  if (page !== 'docs' || docTab !== 'gaps') return;
  gapGroups = d.groups || [];
  $('msettings').innerHTML = `<div class="sf gaps">
    <h2>知识库缺口</h2>
    <p class="lead">大家常问、文档里没写的问题，相似的归成一组、按次数排。线索来自：知识库模式下没引用任何文档、或者明说知识库里没有的回答；
      智能模式里查过知识库、最后靠 💡 通用知识回答的；有人点了 👎、或者在执行记录上标了误报、阈值不对、漏了一步的。打招呼、闲聊、查实际数据的不算。</p>
    <div class="filter"><span class="pill">${d.total || 0} 组 · ${d.questions || 0} 个问题</span>${d.ignored ? `<span class="pill off">已忽略 ${d.ignored} 个</span>` : ''}
      <span class="pill" title="字面：按字的二元组粗分，不调模型；向量：向量模型可用时后台限量补算">归类：${esc(GROUPING[d.grouping] || '按字面')}</span></div>
    <div class="card">${gapGroups.map(gapRow).join('') || '<div class="all-done">✓ 暂时没有发现缺口</div>'}</div>
    <p class="note">「忽略」：这类问题不需要文档，这一组和以后相似的问题都不再出现。「去上传文档」：把写好的文档拖进页面任何地方也能上传。</p>
  </div>`;
}
async function openAnswer(link) {
  if (link.run_id) { runFilter = {sop: '', trigger: ''}; return go('sop', {tab: 'runs', item: link.run_id}); }
  go('chat', {push: false});
  await openConv(link.conversation_id);
  syncUrl(true);
  const bot = document.querySelector(`.bot[data-mid="${CSS.escape(String(link.message_id))}"]`);
  if (bot) { bot.scrollIntoView({block: 'center'}); flash(bot); }
}
// 自动执行页、知识库缺口页的操作（都画在 #msettings 里）
$('msettings').addEventListener('click', async e => {
  const autoPage = mTab === 'sop' && pbTab === 'auto', gapPage = mTab === 'docs' && docTab === 'gaps';
  if (!autoPage && !gapPage) return;
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.openrun) { runFilter = {sop: '', trigger: ''}; return go('sop', {tab: 'runs', item: d.openrun}); }
  if (d.afnew) { autoForm = {kind: d.afnew, item: null}; return renderAuto(); }
  if (d.afcancel !== undefined) { autoForm = null; return renderAuto(); }
  if (d.schedit) { autoForm = {kind: 'schedule', item: autoState.schedules.find(s => s.id === d.schedit)}; return renderAuto(); }
  if (d.ruleedit) { autoForm = {kind: 'rule', item: autoState.rules.find(r => r.id === d.ruleedit)}; return renderAuto(); }
  if (d.afsave !== undefined) {
    const form = t.closest('.autoform'), err = $('afErr');
    err.hidden = true;
    try {
      const body = autoFormBody(), base = form.dataset.form === 'schedule' ? '/api/schedules' : '/api/alert-rules';
      t.disabled = true;
      await sendJson(form.dataset.id ? 'PUT' : 'POST', form.dataset.id ? `${base}/${encodeURIComponent(form.dataset.id)}` : base, body);
    } catch (ex) { err.textContent = ex.message; err.hidden = false; t.disabled = false; return; }
    toast(form.dataset.form === 'schedule' ? '计划已保存' : '告警规则已保存', 'ok');
    autoForm = null;
    return renderAuto();
  }
  const act = async (method, path, done) => {
    t.disabled = true;
    try { const r = await sendJson(method, path); if (done) done(r); } catch (ex) { toast(ex.message, 'err', 6000); }
    return renderAuto();
  };
  if (d.schrun) return act('POST', `/api/schedules/${encodeURIComponent(d.schrun)}/run`,
    r => toast('已开始在后台执行，结果在「执行记录」里', 'ok') || (mCache['run:' + r.run.id] = r.run));
  if (d.schtoggle) return act('POST', `/api/schedules/${encodeURIComponent(d.schtoggle)}/${d.on === '1' ? 'pause' : 'resume'}`);
  if (d.schdel) { if (!confirm('删除这条计划？已经留下的执行记录不删。')) return; return act('DELETE', `/api/schedules/${encodeURIComponent(d.schdel)}`); }
  if (d.ruletoggle) return act('POST', `/api/alert-rules/${encodeURIComponent(d.ruletoggle)}/${d.on === '1' ? 'pause' : 'resume'}`);
  if (d.ruledel) { if (!confirm('删除这条告警规则？')) return; return act('DELETE', `/api/alert-rules/${encodeURIComponent(d.ruledel)}`); }
  if (d.testmail !== undefined) {
    const group = $('testGroup').value;
    t.disabled = true; t.textContent = '发送中…';
    try { const r = await postJson('/api/automation/test-mail', {group}); toast(`测试邮件已发给收件组「${group}」（${r.recipients} 人），去邮箱看看`, 'ok', 6000); }
    catch (ex) { toast('测试邮件没发出去：' + ex.message, 'err', 8000); }
    t.disabled = false; t.textContent = '发一封测试邮件';
    return;
  }
  if (d.gapupload !== undefined) return $('files').click();
  const group = gapGroups.find(g => g.id === (d.gapopen || d.gapignore));
  if (d.gapopen && group) return openAnswer(group.link);
  if (d.gapignore && group) {
    if (!confirm(`忽略「${group.example}」这一类问题？这一组（${group.count} 次）和以后相似的问题都不再出现在看板上。`)) return;
    try { await postJson('/api/gaps/ignore', {keys: group.keys}); } catch (ex) { return toast('没忽略成：' + ex.message, 'err'); }
    toast('已忽略这一类问题', 'ok');
    refreshBadges();
    return renderGaps();
  }
});
$('msettings').addEventListener('change', e => {
  if (!(mTab === 'sop' && pbTab === 'auto')) return;
  if (e.target.id === 'autoSop') { autoSop = e.target.value; autoForm = null; syncUrl(false); return renderAuto(); }
  if (e.target.id === 'afKind') return showKindRows();
  if (e.target.id === 'afSop') $('afParams').innerHTML = paramRows(e.target.value, {});
});

/* 分栏宽度可拖：分组栏、详情栏各自记在浏览器里，双击分隔条恢复默认 */
const SPLIT = {mgroups: [160, 420, 230], mdetail: [300, 800, 440]};   // [最小, 最大, 默认]
function applySplit() {
  for (const id in SPLIT) {
    const w = +localStorage.getItem('kb-w-' + id);
    $(id).style.width = (w >= SPLIT[id][0] && w <= SPLIT[id][1] ? w : SPLIT[id][2]) + 'px';
  }
}
document.querySelectorAll('.msplit').forEach(bar => {
  const id = bar.dataset.split, pane = $(id), [min, max] = SPLIT[id];
  bar.addEventListener('dblclick', () => { localStorage.removeItem('kb-w-' + id); applySplit(); });
  bar.addEventListener('pointerdown', e => {
    e.preventDefault(); bar.setPointerCapture(e.pointerId); bar.classList.add('on'); document.body.classList.add('resizing');
    const x0 = e.clientX, w0 = pane.getBoundingClientRect().width, dir = id === 'mdetail' ? -1 : 1;
    // 上限还要给列表栏留出最小宽度，不然工具栏按钮会被挤出去
    const other = $(id === 'mdetail' ? 'mgroups' : 'mdetail').getBoundingClientRect().width;
    const cap = Math.min(max, $('manage').getBoundingClientRect().width - other - 360 - 10);
    const move = ev => { pane.style.width = Math.min(cap, Math.max(min, w0 + dir * (ev.clientX - x0))) + 'px'; };
    const up = () => { bar.classList.remove('on'); document.body.classList.remove('resizing');
      localStorage.setItem('kb-w-' + id, Math.round(pane.getBoundingClientRect().width));
      bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); bar.removeEventListener('pointercancel', up); };
    bar.addEventListener('pointermove', move); bar.addEventListener('pointerup', up); bar.addEventListener('pointercancel', up);
  });
});
applySplit();
// 先取工作台汇总（导航徽标、工具中文名都靠它），再按地址打开对应的页
refreshBadges().finally(() => { route(); loadDocs(); loadConvs(); });
// 窄屏上输入框放不下长提示
if (matchMedia('(max-width: 820px)').matches) $('question').placeholder = '问点什么…';
</script>
