/* 申请表单 → 发给 /api/tools/propose 的内容。按实现类型分栏填写，发出去的是老写法（新老工具服务都认）；
   SQL 只有新写法 impl = {type: sql, conn, query, max_rows}。填得不对就抛错，错误文字直接给人看。 */
function tlProposalPayload() {
  const base = {name: $('tlNewName').value.trim(), label: $('tlNewLabel').value.trim(),
                desc: $('tlNewDesc').value.trim(), params: {}};
  if (tlProposeKind === 'script') {
    const script = $('tlNewScript') ? $('tlNewScript').value : '';
    if (!script) throw new Error('请先选择一个脚本');
    return {...base, script};
  }
  if (tlProposeKind === 'http') {
    const conn = $('tlNewConn') ? $('tlNewConn').value : '';
    const raw = $('tlNewUrl').value.trim();
    if (conn && !raw.startsWith('/')) throw new Error('选了连接时，地址只填路径，以 / 开头（主机名和凭据都在连接里）');
    if (!conn && !/^https?:\/\//.test(raw)) throw new Error('接口地址要以 http:// 或 https:// 开头');
    const {url, query} = tlSplitUrl(raw);
    return {...base, http: {url, ...(Object.keys(query).length ? {query} : {}), ...(conn ? {conn} : {})},
            params: tlParamsPayload(raw)};
  }
  if (tlProposeKind === 'sql') {
    const conn = $('tlNewConn') ? $('tlNewConn').value : '';
    const query = $('tlNewSql').value.trim();
    if (!conn) throw new Error('请先选一个数据库连接');
    if (!/^(select|with)\b/i.test(query)) throw new Error('查询只能是一条 SELECT 或 WITH');
    const rows = Math.min(1000, Math.max(1, parseInt($('tlNewRows').value, 10) || 100));
    return {...base, impl: {type: 'sql', conn, query, max_rows: rows}, params: tlParamsPayload(query, true)};
  }
  const cmd = $('tlNewCmd').value.trim();
  const parts = cmd.split(/\s+/).filter(Boolean);
  if (!parts.length) throw new Error('请填写完整命令');
  const os = [...$('tlPanel').querySelectorAll('[data-tlos]:checked')].map(box => box.dataset.tlos);
  const groups = ($('tlNewGroups') ? $('tlNewGroups').value : '').split(/[\s,，、]+/).filter(Boolean);
  return {...base, binary: parts[0], argv: parts, ...(os.length ? {os} : {}), ...(groups.length ? {groups} : {}),
          params: tlParamsPayload(cmd)};
}
$('tlPanel').addEventListener('change', e => {
  if (e.target.id === 'tlNewScript') { tlScriptSel = e.target.value; loadTools(); }
  if (e.target.id === 'tlNewConn') { const box = $('tlNewUrl'); if (box) box.placeholder = e.target.value ? TL_URL_HINT.path : TL_URL_HINT.full; }
  const pf = e.target.dataset.pf, row = e.target.closest('[data-tlparam]');
  if (!pf || !row) return;
  const st = (tlParamState[row.dataset.tlparam] ||= {type: 'name', required: true, def: '', desc: ''});
  if (pf === 'required') { st.required = e.target.checked; const d = row.querySelector('[data-pf="def"]'); if (d) d.disabled = st.required; }
  else st[pf] = e.target.value;
});

async function ask() {
  const q = $('question').value.trim();
  if (!q || $('askBtn').disabled) return;
  const book = pendingPlaybook && q.startsWith(pendingPlaybook.prefix) ? pendingPlaybook : null;
  const playbookId = book ? book.id : undefined;
  pendingPlaybook = null;
  $('question').value = ''; autosize();
  if ($('thread').querySelector('.welcome')) $('thread').innerHTML = '';
  addUser(q);
  const bot = addBot('<div class="status"></div><div class="answer"></div>');
  if (book) { bot.dataset.playbook = book.name || ''; bot.dataset.playbookId = book.id; paintRun(bot); }
  const card = bot.querySelector('.card'), ans = bot.querySelector('.answer');
  // 等待态按服务端的阶段事件换文案，并跟着走秒；status 被 delta 分支移除后（模型先说一句再调工具）要能补回来
  const t0 = performance.now(); let tFirst = 0;
  const tick = () => ((performance.now() - t0) / 1000).toFixed(1) + ' s';
  const setStatus = html => {
    let st = card.querySelector('.status');
    if (!st) { st = document.createElement('div'); st.className = 'status'; card.insertBefore(st, ans); }
    st.innerHTML = `<span class="spin"></span><span class="txt">${html}</span><span class="tick">${tick()}</span>`;
  };
  const clearStatus = () => card.querySelector('.status')?.remove();
  const ticker = setInterval(() => { const el = card.querySelector('.status .tick'); if (el) el.textContent = tick(); }, 200);
  setStatus('正在检索知识库…');
  toBottom();
  $('askBtn').disabled = true;
  let text = '', pending = false, finished = false, candidates = 0, answered = false;
  const wasNew = !convId;
  const webSrc = [];
  // 渲染推迟到下一帧；流结束后才执行的那一帧不能再把光标加回去。
  const paint = () => { pending = false; if (finished) return; const stick = nearBottom(); ans.innerHTML = md(text); ans.classList.add('cursor'); if (stick) toBottom(); };
  try {
    const r = await fetch('/api/ask', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                       body: JSON.stringify({question: q, conversation_id: convId, web: webOn,
                                                             model: modelPick || undefined,
                                                             playbook_id: playbookId})});
    if (r.status === 503) { const d = await r.json().catch(() => ({})); throw new Error((d.detail || '服务未就绪') + '（去「设置」配置模型）'); }
    if (!r.ok) { const d = await r.json().catch(() => ({detail: r.status})); throw new Error(d.detail); }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream: true}); let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const msg = JSON.parse(buf.slice(0, nl)); buf = buf.slice(nl + 1);
        if (msg.conversation) {
          convId = msg.conversation.id;
          if (msg.model) bot.dataset.model = msg.model;
          if (msg.execution_id) bot.dataset.exec = msg.execution_id;
        } else if (msg.stage) {
          setStatus(msg.stage === 'rewrite' ? '正在结合上文理解问题…'
                  : msg.stage === 'retrieve' ? '正在检索知识库（向量 + 关键词）…'
                  : msg.stage === 'rerank' ? '找到候选片段，正在重排…'
                  : msg.stage === 'think' ? (candidates ? `检索到 ${candidates} 个候选片段，模型正在判断相关性并组织回答…` : '模型思考中…')
                  : '处理中…');
        } else if (msg.thinking) {
          // 思考型模型出正文前的推理片段数：数字在涨就说明模型在动
          setStatus(`模型思考中（已推理 ${msg.thinking} 步）…`);
        } else if (msg.sources) {
          bot.dataset.retr = ((performance.now() - t0) / 1000).toFixed(1);
          candidates = msg.sources.length;
          bot.querySelector('.sources').innerHTML = sourcesHtml(msg.sources);
          arrangeSources(bot, '', false);
        } else if (msg.tool_call) {
          const cat = stepCategory(msg.tool_call), tool = msg.tool_call.tool;
          setStatus(cat === 'web' ? (tool === 'web_fetch' ? '正在读取网页正文…' : '知识库里没有足够信息，正在上网搜索…')
                  : cat === 'knowledge' ? (tool === 'kb_read' ? '正在读知识库原文的前后文…'
                                         : tool === 'kb_catalog' ? '正在查看知识库目录…' : '正在检索知识库…')
                  : cat === 'internal' ? '正在更新待办清单…'
                  : cat === 'compute' ? '正在沙箱里运行计算…'
                  : `正在查询：${esc(tool)}…`);
          bot.querySelector('.steps').insertAdjacentHTML('beforeend', stepHtml(msg.tool_call, true));
          paintRun(bot);
          if (nearBottom()) toBottom();
        } else if (msg.web_sources) {
          webSrc.push(...msg.web_sources);
          bot.querySelector('.sources').insertAdjacentHTML('beforeend', sourcesHtml(msg.web_sources));
          arrangeSources(bot, '', false);
        } else if (msg.kb_sources) {
          // 模型补查 / 读前后文拿到的片段：编号接着往下编，和联网结果一样追加卡片
          bot.querySelector('.sources').insertAdjacentHTML('beforeend', sourcesHtml(msg.kb_sources));
          arrangeSources(bot, '', false);
        } else if (msg.plan) {
          showPlan(bot, msg.plan);
          if (nearBottom()) toBottom();
        } else if (msg.tool_result) {
          const steps = bot.querySelectorAll('.step.running');
          const step = steps[steps.length - 1];
          if (step) {
            step.classList.remove('running');
            step.querySelector('.n').textContent = `${msg.tool_result.lines} 行`;
            step.querySelector('.ret').textContent = msg.tool_result.preview;
            if (msg.tool_result.chars > (msg.tool_result.preview || '').length)
              step.querySelector('.out').insertAdjacentHTML('beforeend',
                `<div class="trunc">仅显示前 ${msg.tool_result.preview.length} 字，共 ${msg.tool_result.chars} 字 / ${msg.tool_result.lines} 行</div>`);
          }
          setStatus('工具已返回，模型正在分析…');
          if (nearBottom()) toBottom();
        } else if (msg.delta) {
          clearStatus();
          text += msg.delta;
          if (msg.delta.trim()) answered = true;
          if (!tFirst) tFirst = performance.now();
          if (!pending) { pending = true; requestAnimationFrame(paint); }
        } else if (msg.error) {
          // 检索一失败流就结束了，转圈要立刻停，错误随正文一起画出来
          clearStatus();
          text += `\n\n⚠️ ${msg.error}`;
        }
      }
    }
    finished = true;
    clearStatus();
    ans.innerHTML = md(text || '（没有返回内容）');
  } catch (e) {
    finished = true;
    clearStatus();
    ans.innerHTML = md(text) + `<p class="error">请求失败：${esc(e.message)}</p>`;
  } finally {
    finished = true;
    clearInterval(ticker);
    ans.classList.remove('cursor');
    // 新对话这一轮没答出任何东西：服务端已把它删掉，这边也忘掉它的 id，下一问重新开
    if (wasNew && !answered) convId = null;
    arrangeSources(bot, text, true);
    bot.dataset.took = ((performance.now() - t0) / 1000).toFixed(1);
    if (tFirst) bot.dataset.first = ((tFirst - t0) / 1000).toFixed(1);
    addTools(bot, text, q, webSrc);
    paintRun(bot);
    $('askBtn').disabled = false; $('question').focus();
    loadConvs();
    // 自由排查（没带 SOP）用了 ≥2 次数据类工具：服务端可能在后台长出一个 SOP 提议，退避轮询取回
    if (sopGrowth && !playbookId && bot.dataset.exec && bot.querySelectorAll('.step[data-cat="data"]').length >= 2) pollProposal(bot);
  }
}

function autosize() { const t = $('question'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 180) + 'px'; }

/* 模型选择：列表来自网关（这把 key 能用的模型），选择记在浏览器里。
   也可以手动输入模型名，但最终能不能用由网关决定——页面改不了网关地址和 key。 */
const CUSTOM = '__custom__';
let modelPick = localStorage.getItem('kb-model') || '';
let defaultModel = '';
function paintModels(list) {
  const sel = $('modelPick');
  const names = [...new Set([...list, modelPick].filter(Boolean))];
  sel.innerHTML = names.map(m =>
    `<option value="${esc(m)}" ${m === (modelPick || defaultModel) ? 'selected' : ''}>${esc(m)}${m === defaultModel ? '（默认）' : ''}</option>`
  ).join('') + `<option value="${CUSTOM}">手动输入模型名…</option>`;
  sel.hidden = !names.length;
  sel.title = '回答用的模型：' + (modelPick || defaultModel) + '\n列表来自网关，是这把 key 能调用的模型';
}
async function loadModels(fallback) {
  defaultModel = fallback || '';
  try {
    const d = await (await fetch('/api/models')).json();
    defaultModel = d.default || defaultModel;
    paintModels(d.models || []);
  } catch (_) { paintModels(defaultModel ? [defaultModel] : []); }
}
$('modelPick').addEventListener('change', e => {
  let v = e.target.value;
  if (v === CUSTOM) {
    v = (prompt('输入模型名（必须是网关上这把 key 有权调用的模型）：', modelPick || defaultModel) || '').trim();
    if (!v) { paintModels([...e.target.options].map(o => o.value).filter(x => x !== CUSTOM)); return; }
  }
  modelPick = v === defaultModel ? '' : v;
  if (modelPick) localStorage.setItem('kb-model', modelPick); else localStorage.removeItem('kb-model');
  paintModels([...e.target.options].map(o => o.value).filter(x => x !== CUSTOM));
});

/* 导航徽标、左下角状态都来自工作台汇总（/api/overview）。徽标只在有事要人处理时亮：
   工具 = 待审批的申请 + 内容变了要重新确认的脚本；SOP = 待确认的提议；工作台 = 全部待处理（再加离线的主机）。 */
async function refreshBadges() {
  try {
    const r = await fetch('/api/overview');
    if (!r.ok) return;
    overview = await r.json();
  } catch (_) { return; }   // 徽标只是提示，失败不影响使用
  paintNav();
}
function todoCounts(o = overview) {
  const p = (o && o.pending) || {};
  const tools = (p.tools || []).length + (p.scripts || []).length, sops = (p.proposals || []).length;
  return {tools, sops, all: tools + sops + (p.hosts || []).length};
}
function nb(id, text, cls, title) {
  const el = $(id);
  el.textContent = text || '';
  el.className = 'nb' + (cls ? ' ' + cls : '');
  el.title = title || '';
}
function paintNav() {
  const o = overview; if (!o) return;
  const c = todoCounts(), p = o.pending || {};
  nb('nbHome', c.all, 'alert', `${c.all} 件事待处理`);
  nb('nbTools', c.tools, 'alert', `${(p.tools || []).length} 条工具申请待审批` + ((p.scripts || []).length ? `，${p.scripts.length} 个脚本要重新确认` : ''));
  nb('nbSop', c.sops, 'purple', `${c.sops} 条 SOP 提议待确认`);
  nb('nbDocs', o.knowledge.documents, '', `${o.knowledge.documents} 个文档`);
  nb('nbAccess', o.access.enabled ? '开' : '关', o.access.enabled ? 'on' : '', o.access.enabled ? '对外 MCP 已开启' : '对外 MCP 没有打开');
  const t = o.tools;
  $('sideFoot').innerHTML = `<span class="dot ${t.error ? 'bad' : ''}"></span>${t.error ? '工具服务连不上' : `工具服务在线 · ${t.live} 个工具`}<br>`
    + `${o.knowledge.documents} 个文档 · ${o.knowledge.chunks} 个片段`;
  paintTop();
}
/* 联网开关：默认开启，记在浏览器里（关掉后下次打开仍是关）。首次见到开着的开关弹一次说明，
   让人知道哪些问题会上网、哪些永远不会外发。服务端没配置搜索时按钮不显示。 */
let webOn = localStorage.getItem('kb-web') !== 'off';
function paintWeb() {

  $('webBtn').querySelector('.state').textContent = webOn ? '开' : '关';
  $('webBtn').title = webOn ? '联网已开启：知识库答不了时会上网搜索公开资料（内部问题不会外发）。点击关闭'
                            : '联网已关闭：只用知识库和工具回答。点击开启';
}
function webNotice() {

  toast('联网已开启。只有知识库答不了、且问题不涉及内部信息时才会搜索；搜索词里出现 IP、密钥、内网域名或内部名词会被拦下。网络结果会单独标注 [W]，可经您确认后存入知识库。不需要时点「联网」关闭。', '', 9000);
}
$('webBtn').onclick = () => {
  webOn = !webOn; localStorage.setItem('kb-web', webOn ? 'on' : 'off'); paintWeb(); webNotice();
};
$('question').addEventListener('input', autosize);
$('question').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); }
});
$('askBtn').onclick = ask;
$('newBtn').onclick = newConv;
$('menuBtn').onclick = () => document.body.classList.toggle('menu');
$('scrim').onclick = () => document.body.classList.remove('menu');

/* ---------- 页面切换 ----------
   左侧导航 → go(页名)。工具页、SOP 页的页签和选中的条目放在查询串里（/tools?tab=pending&item=…），
   工作台「待处理」里的「审批」「去确认」直接链过去；对话页把当前对话放在 ?c=…，刷新后还在这个对话。 */
function tabBtn(kind, key, label, n, cls) {
  const on = (kind === 'tl' ? tlTab : pbTab) === key;
  return `<button class="${on ? 'on' : ''}" data-tab="${kind}:${key}">${label}${n ? `<span class="nb ${cls}">${n}</span>` : ''}</button>`;
}
function paintTop() {
  const o = overview, c = todoCounts();
  let sub = '', tabs = '';
  if (page === 'home') sub = o ? (c.all ? `${c.all} 件事待处理` : '没有待处理的事') : '';
  if (page === 'tools') {
    sub = o ? `${o.tools.live} 个可用 · 共 ${o.tools.total} 个` : '';
    tabs = tabBtn('tl', 'all', '全部工具') + tabBtn('tl', 'pending', '待审批', c.tools, 'alert') + tabBtn('tl', 'infra', '主机与数据源');
  }
  if (page === 'sop') {
    sub = (o ? `${o.sops.live} 个生效 · 共 ${o.sops.total} 个` : '')
      + (pbOrigins && o?.sops.total ? ` · 来源：文档 ${pbOrigins.doc || 0} / 实践 ${pbOrigins.practice || 0}${pbOrigins.manual ? ` / 手工 ${pbOrigins.manual}` : ''}` : '');
    tabs = tabBtn('pb', 'all', '全部 SOP') + tabBtn('pb', 'proposals', '待确认提议', c.sops, 'purple');
  }
  if (page === 'docs') sub = o ? `${o.knowledge.documents} 个文档 · ${o.knowledge.chunks} 个片段` : '';
  if (page === 'access') sub = o ? (o.access.enabled ? '已开启' : '没有打开') : '';
  $('topTitle').textContent = PAGES[page][1];
  $('topSub').textContent = sub;
  $('topTabs').innerHTML = tabs;
}
$('topTabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  const [kind, key] = b.dataset.tab.split(':');
  if (kind === 'tl') tlTab = key; else pbTab = key;
  mGroup = null; mItem = null; mSearch = ''; tlEditing = null; tlProposing = false; pbEditing = null; pbPicking = false;
  document.body.classList.remove('detail');
  syncUrl(true);
  renderManage();
});
function urlFor() {
  const qs = new URLSearchParams();
  if (page === 'tools' && tlTab !== 'all') qs.set('tab', tlTab);
  if (page === 'sop' && pbTab !== 'all') qs.set('tab', pbTab);
  if (['tools', 'sop', 'docs'].includes(page) && mItem) qs.set('item', mItem);
  if (page === 'chat' && convId) qs.set('c', convId);
  return PAGES[page][0] + (qs.toString() ? '?' + qs : '');
}
function syncUrl(push) {
  const url = urlFor();
  if (url !== location.pathname + location.search) history[push ? 'pushState' : 'replaceState'](null, '', url);
}
function go(name, opts = {}) {
  if (!PAGES[name]) name = 'home';
  const changed = page !== name;
  page = name;
  document.body.dataset.page = name;
  document.body.classList.remove('menu', 'detail');
  document.querySelectorAll('#side .nav a[data-page]').forEach(a => a.classList.toggle('on', a.dataset.page === name));
  paintNavRecent();
  $('pg-home').classList.toggle('on', name === 'home');
  $('pg-chat').classList.toggle('on', name === 'chat');
  $('pg-manage').classList.toggle('on', !['home', 'chat'].includes(name));
  if (!['home', 'chat'].includes(name)) {
    if (changed) { mGroup = null; mSearch = ''; tlEditing = null; tlProposing = false; pbEditing = null; pbPicking = false; mItem = null; axIssued = null; }
    mTab = name;
    localStorage.setItem('kb-mtab', name);
  }
  if (opts.tab) { if (name === 'tools') tlTab = opts.tab; if (name === 'sop') pbTab = opts.tab; }
  if (opts.item !== undefined) mItem = opts.item;
  applyBrand();
  paintTop();
  if (opts.push !== false) syncUrl(true);
  if (name === 'home') renderHome();
  else if (name === 'chat') { if (!$('thread').children.length) welcome(); setTimeout(() => $('question').focus(), 0); }
  else renderManage();
}
document.querySelector('#side .nav').addEventListener('click', e => {
  const c = e.target.closest('a[data-conv]');
  if (c) {
    if (e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;
    e.preventDefault();
    go('chat', {push: false});
    openConv(c.dataset.conv).then(() => syncUrl(true));
    return;
  }
  const a = e.target.closest('a[data-page]'); if (!a) return;
  if (e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;   // 新标签页打开照常
  e.preventDefault();
  if (a.dataset.page === 'tools') tlTab = 'all';
  if (a.dataset.page === 'sop') pbTab = 'all';
  go(a.dataset.page);
});
/* 当前地址 → 页面。兼容老地址：/manage（#settings、#access，或上次的页签）、
   /?q=…&pb=…&send=1（老管理页「▶ 执行」「用它提问」跳过来的） */
function route() {
  const path = location.pathname.replace(/\/+$/, '') || '/';
  const qs = new URLSearchParams(location.search);
  if (path === '/manage') {
    const want = location.hash.slice(1) || localStorage.getItem('kb-mtab') || 'tools';
    history.replaceState(null, '', PAGES[['tools', 'sop', 'docs', 'access', 'settings'].includes(want) ? want : 'tools'][0]);
    return route();
  }
  if (path === '/' && qs.get('q')) {
    const text = qs.get('q');
    history.replaceState(null, '', '/chat');
    go('chat', {push: false});
    $('question').value = text; autosize();
    if (qs.get('pb')) pendingPlaybook = {id: qs.get('pb'), name: (text.match(/《(.+?)》/) || [])[1] || '', prefix: text.split('（')[0]};
    if (qs.get('send')) ask();
    else $('question').setSelectionRange(text.length - 1, text.length - 1);
    return;
  }
  const name = Object.keys(PAGES).find(k => PAGES[k][0] === path) || 'home';
  if (name === 'tools') tlTab = ['pending', 'infra'].includes(qs.get('tab')) ? qs.get('tab') : 'all';
  if (name === 'sop') pbTab = qs.get('tab') === 'proposals' ? 'proposals' : 'all';
  go(name, {push: false, item: qs.get('item') || null});
  if (name === 'chat' && qs.get('c') && qs.get('c') !== convId) openConv(qs.get('c'));
}
window.addEventListener('popstate', route);
const openPending = id => go('tools', {tab: 'pending', item: id});

/* ---------- 工作台 ----------
   一屏看全：问点什么（示例按查知识 / 查数据 / 按 SOP 排查 / 计算分组）、四张状态卡（知识库、工具、SOP、对外接入）、
   待处理（工具申请待审批、SOP 提议待确认、脚本内容变了、主机离线，每项一键进入处理）、最近的对话。 */
const KIND_LABEL = {command: '命令型', script: '脚本型', http: '接口型', sql: 'SQL', mcp: 'MCP'};
function ago(t) {
  if (!t) return '';
  const d = new Date(String(t).includes('T') || String(t).endsWith('Z') ? t : String(t).replace(' ', 'T'));
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 60) return '刚刚';
  if (s < 3600) return `${Math.floor(s / 60)} 分钟前`;
  if (s < 86400 && new Date().getDate() === d.getDate()) return `今天 ${d.toTimeString().slice(0, 5)}`;
  return d.toLocaleString('zh-CN', {month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'});
}
function sourcePills(t) {
  const s = t.sources || {}, h = t.hosts || {}, mcp = s.mcp || {};
  const pill = (on, text, title) => `<span class="pill ${on ? 'ok' : 'off'}" title="${esc(title)}">${on ? '✓' : '–'} ${text}</span>`;
  return [
    h.configured ? `<span class="pill ${h.offline.length ? 'warn' : 'ok'}" title="主机清单：${h.offline.length ? esc(h.offline.map(x => x.name).join('、')) + ' 离线' : '全部在线'}">🖥 ${h.online}/${h.total} 主机在线</span>`
                 : pill(false, '远程主机', '没有配置主机清单'),
    pill(s.k8s, 'K8s', s.k8s ? `${s.k8s} 个 Kubernetes 工具` : '没有 Kubernetes 工具'),

      <span class="hint">不是网页登录密码。审批口令由管理员在宿主机上设置，只存哈希，由工具服务核对；连续输错 ${ap.max_failures || 5} 次，页面审批锁定 ${ap.lock_minutes || 15} 分钟。</span></label>
    ${local ? '' : `<div class="plain">⚠ 当前是明文连接（${esc(location.host)}），口令会以明文经过网络。经 SSH 隧道、从本机地址（127.0.0.1）打开更安全。</div>`}
    <div class="err" id="dlgErr"></div>
    <div class="row"><button type="button" class="btn" data-dlgcancel>取消</button><button type="submit" class="btn warn" id="dlgOk">${esc(confirm || '确定')}</button></div></form>`;
  document.body.appendChild(wrap);
  dlgCancel = cancel || null;
  const input = $('dlgPass'), ok = $('dlgOk');
  setTimeout(() => input.focus(), 30);
  wrap.addEventListener('mousedown', e => { if (e.target === wrap) closeDialog(true); });
  wrap.querySelector('[data-dlgcancel]').onclick = () => closeDialog(true);
  wrap.querySelector('form').addEventListener('submit', async e => {
    e.preventDefault();
    const pass = input.value;
    if (!pass) { input.focus(); return; }
    input.value = '';
    ok.disabled = true; ok.textContent = '核对中…'; $('dlgErr').textContent = '';
    try {
      const result = await run(pass);
      dlgCancel = null; wrap.remove();
      if (done) done(result);
    } catch (err) {
      $('dlgErr').textContent = err.message;
      ok.textContent = confirm || '确定';
      // 锁定、没设口令、脚本被改过，或者申请已经入队（再点只会撞上同名申请）：按钮变灰，关掉对话框再处理
      ok.disabled = err.status === 423 || err.status === 409 || !!err.pending;
      input.focus();
      if (err.status === 423 || err.status === 409) refreshApproval();
    }
  });
}
async function refreshApproval() {
  const r = await fetch('/api/tools/approval').catch(() => null);
  if (r && r.ok) apState.approval = await r.json();
}
async function postJson(path, body) {
  const r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    const err = new Error(typeof d.detail === 'string' ? d.detail : `请求失败（${r.status}）`);
    err.status = r.status;
    err.pending = d.pending || null;
    throw err;
  }
  return d;
}
const approveRequest = (id, body) => postJson(`/api/tools/pending/${encodeURIComponent(id)}/approve`, body)
  .then(d => ({...d, id}));
function approveFlow(id) {
  const it = apState.pending.find(x => x.id === id); if (!it) return;
  const d = it.detail || {}, t = it.tool || {};
  const attest = !!$('apAttest')?.checked;
  if (d.kind === 'mcp' && !d.mcp.readonly_declared && !attest) {
    toast('这个 MCP 工具没有只读声明：先勾选「我确认这个工具只读」', 'err');
    const box = $('apAttest')?.closest('.attest'); if (box) flash(box);
    return;
  }
  askPassphrase({
    title: `批准「${t.label || t.name}」`, summary: approveSummary(d), confirm: '批准',
    run: passphrase => approveRequest(id, {passphrase, attest_readonly: attest, script_sha256: d.script?.sha256 || ''}),
    done: result => { apResults[id] = result; mItem = id; toast(`已批准：${t.label || t.name}`, 'ok'); renderManage(); refreshBadges(); },
  });
}
async function rejectFlow(id) {
  const it = apState.pending.find(x => x.id === id); if (!it) return;
  if (!confirm(`拒绝「${it.tool?.label || it.tool?.name}」？申请会被删掉，不会写进配置。`)) return;
  try { await postJson(`/api/tools/pending/${encodeURIComponent(id)}/reject`); toast('已拒绝', 'ok'); }
  catch (err) { toast('拒绝失败：' + err.message, 'err'); }
  mItem = null; renderManage(); refreshBadges();
}
function trustFlow(script) {
  const s = apState.held.find(x => x.script === script); if (!s) return;
  askPassphrase({
    title: `重新确认脚本 ${script}`, confirm: '确认',
    summary: `确认的是此刻的内容（sha256 ${esc(s.sha256.slice(0, 16))}…）；引用它的工具「${esc(s.label || s.tool)}」恢复可用。`,
    run: passphrase => postJson(`/api/tools/scripts/${encodeURIComponent(script)}/trust`, {passphrase, sha256: s.sha256}),
    done: () => { toast(`已重新确认 ${script}`, 'ok'); mItem = null; renderManage(); refreshBadges(); },
  });
}

        : '<div class="note">还没有外部调用。</div>'}
    </div>
    <div class="card"><h3>接入须知</h3><ul class="ax">
      <li><b>外部客户端对写操作要保持人工确认。</b>这里的工具全部只读，但外部智能体通常能执行命令、改文件；知识库文档和工具输出都可能夹带指令，诱导它做坏事。</li>
      <li><b>能上传文档的人，也就能影响外部智能体。</b>上传权限要和对外开放一起考虑。</li>
      <li>知识库片段和工具返回会进入外部智能体所用的模型服务商，不再只经过自己的模型网关；只开放不涉及个人的数据。</li>
      <li>令牌只存哈希：丢了就吊销重签，找不回来。</li></ul></div>
  </div>`;
}
$('msettings').addEventListener('click', async e => {
  if (mTab !== 'access') return;
  const id = e.target.id;
  if (id === 'axAllCats') {
    document.querySelectorAll('[data-axcat]').forEach(x => { x.disabled = e.target.checked; if (e.target.checked) x.checked = false; });
    return;
  }
  if (id === 'axCopy') {
    if (navigator.clipboard) navigator.clipboard.writeText(axIssued?.secret || '').then(() => toast('已复制', 'ok'));
    else toast('浏览器不允许脚本复制（非 https），请手动选中上面的令牌复制', '', 6000);
    return;
  }
  if (id === 'axSkills') { location.href = '/api/mcp/skills.zip'; return; }
  const revoke = e.target.dataset.axrevoke;
  if (revoke) {
    if (!confirm('吊销这枚令牌？用它的客户端下一个请求就会失败，不能恢复。')) return;
    const r = await fetch('/api/mcp/tokens/' + encodeURIComponent(revoke), {method: 'DELETE'});
    toast(r.ok ? '已吊销' : '吊销失败', r.ok ? 'ok' : 'err');
    return renderAccess();
  }
  if (id === 'axIssue') {
    const scopes = [...document.querySelectorAll('[data-axscope]:checked')].map(x => x.dataset.axscope);
    const all = $('axAllCats').checked;
    const cats = [...document.querySelectorAll('[data-axcat]:checked')].map(x => x.dataset.axcat);
    const body = {name: $('axName').value.trim(), scopes, categories: all ? null : cats,
                  expires_days: $('axDays').value ? +$('axDays').value : null,
                  rate_per_minute: $('axRate').value ? +$('axRate').value : null,
                  max_result_chars: $('axChars').value ? +$('axChars').value : null};
    if (!body.name) return toast('先给令牌起个名字', 'err');
    if (!scopes.length) return toast('至少选一个范围', 'err');
    if (!all && !cats.length && scopes.some(sc => sc !== 'data')) return toast('选几个文档分类，或者勾「全部分类」', 'err');
    const r = await fetch('/api/mcp/tokens', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    const d = await r.json();
    if (!r.ok) return toast('签发失败：' + (Array.isArray(d.detail) ? d.detail.map(x => x.msg).join('；') : d.detail), 'err', 8000);
    axIssued = d;
    return renderAccess();
  }
});

$('mgroups').addEventListener('click', e => {
  if (e.target.closest('[data-infra]')) { tlTab = 'infra'; syncUrl(true); return renderManage(); }
  const g = e.target.closest('[data-mgroup]'); if (!g) return;
  mGroup = g.dataset.mgroup; mSearch = ''; mItem = null; tlProposing = false; pbEditing = null; pbPicking = false; renderManage();
});
$('mlist').addEventListener('click', e => {
  const row = e.target.closest('[data-mitem]');
  if (row) {
    mItem = row.dataset.mitem; tlEditing = null; tlProposing = false; pbEditing = null; pbPicking = false;
    $('mrows').querySelectorAll('.mrow').forEach(r => r.classList.toggle('on', r === row));
    if (mTab === 'tools' && tlTab === 'pending') renderApDetail();
    else if (mTab === 'sop' && pbTab === 'proposals') renderProposalDetail();
    else renderDetail();
    document.body.classList.add('detail');   // 窄屏：详情盖住整页
    syncUrl(false);
    return;
  }
  const more = e.target.closest('[data-docmore]');
  if (more) {
    const list = $('mrows')._docList || [], from = +more.dataset.docmore;
    more.insertAdjacentHTML('beforebegin', list.slice(from, from + PAGE).map(docRow).join(''));
    const left = list.length - from - PAGE;
    more.outerHTML = left > 0 ? `<button class="more" data-docmore="${from + PAGE}">加载更多（还有 ${left} 条）</button>` : '';
    return;
  }
  if (e.target.id === 'mUpload') return $('files').click();
  const open = fn => { fn(); mItem = null; renderDetail(); document.body.classList.add('detail'); };
  if (e.target.id === 'mNewTool') return open(() => { tlProposing = true; tlProposeKind = 'command'; tlParamState = {}; });
  if (e.target.id === 'mNewSop') return open(() => { pbEditing = {steps: []}; pbPicking = false; });
  if (e.target.id === 'mExtract') return open(() => { pbPicking = true; pbEditing = null; pbDocFilter = ''; });
});
$('mlist').addEventListener('input', e => {
  if (e.target.id !== 'mSearch') return;
  mSearch = e.target.value; mSearchFocus = true;
  clearTimeout(searchTimer); searchTimer = setTimeout(renderManage, 250);
});
$('mdetail').addEventListener('click', async e => {
  if (e.target.closest('[data-back]')) { document.body.classList.remove('detail'); return; }
  const ok = e.target.closest('[data-approve]'); if (ok) return approveFlow(ok.dataset.approve);
  const no = e.target.closest('[data-apreject]'); if (no) return rejectFlow(no.dataset.apreject);
  const tr = e.target.closest('[data-trust]'); if (tr) return trustFlow(tr.dataset.trust);
  const see = e.target.closest('[data-seetool]');
  if (see) { tlTab = 'all'; mGroup = null; return go('tools', {item: see.dataset.seetool}); }
  const use = e.target.closest('[data-asktool]');
  if (use) { go('chat'); $('question').value = `用「${use.dataset.asktool}」查一下`; autosize(); $('question').focus(); return; }
  const x = e.target.closest('[data-mextract]');
  if (x) {
    x.disabled = true; x.textContent = '抽取中…';
    try {
      const r = await fetch('/api/playbooks/extract', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({source: x.dataset.mextract})});
      const d = await r.json();
      if (!r.ok) throw new Error(Array.isArray(d.detail) ? d.detail.map(v => v.msg).join('；') : d.detail);
      toast(d.extracted.length ? `抽取出 ${d.extracted.length} 个 SOP，已默认停用；核对后启用。${d.note ? '\n' + d.note : ''}`
                               : `没有抽出 SOP。原因：${d.note || '未知'}`, d.extracted.length ? 'ok' : 'err', 8000);
      if (d.extracted.length) { pbTab = 'all'; go('sop', {item: d.extracted[0].id}); mGroup = x.dataset.mextract; renderManage(); }
      else renderDetail();
    } catch (err) { toast('抽取失败：' + err.message, 'err'); renderDetail(); }
    return;
  }
  if (mTab === 'docs') docActions(e);
});
/* 分栏宽度可拖：分组栏、详情栏各自记在浏览器里，双击分隔条恢复默认 */
const SPLIT = {mgroups: [160, 420, 230], mdetail: [300, 800, 440]};   // [最小, 最大, 默认]
function applySplit() {
  for (const id in SPLIT) {
    const w = +localStorage.getItem('kb-w-' + id);
    $(id).style.width = (w >= SPLIT[id][0] && w <= SPLIT[id][1] ? w : SPLIT[id][2]) + 'px';
  }
}
document.querySelectorAll('.msplit').forEach(bar => {
  const id = bar.dataset.split, pane = $(id), [min, max] = SPLIT[id];
  bar.addEventListener('dblclick', () => { localStorage.removeItem('kb-w-' + id); applySplit(); });
  bar.addEventListener('pointerdown', e => {
    e.preventDefault(); bar.setPointerCapture(e.pointerId); bar.classList.add('on'); document.body.classList.add('resizing');
    const x0 = e.clientX, w0 = pane.getBoundingClientRect().width, dir = id === 'mdetail' ? -1 : 1;
    // 上限还要给列表栏留出最小宽度，不然工具栏按钮会被挤出去
    const other = $(id === 'mdetail' ? 'mgroups' : 'mdetail').getBoundingClientRect().width;
    const cap = Math.min(max, $('manage').getBoundingClientRect().width - other - 360 - 10);
    const move = ev => { pane.style.width = Math.min(cap, Math.max(min, w0 + dir * (ev.clientX - x0))) + 'px'; };
    const up = () => { bar.classList.remove('on'); document.body.classList.remove('resizing');
      localStorage.setItem('kb-w-' + id, Math.round(pane.getBoundingClientRect().width));
      bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); bar.removeEventListener('pointercancel', up); };
    bar.addEventListener('pointermove', move); bar.addEventListener('pointerup', up); bar.addEventListener('pointercancel', up);
  });
});
applySplit();
// 先取工作台汇总（导航徽标、工具中文名都靠它），再按地址打开对应的页
refreshBadges().finally(() => { route(); loadDocs(); loadConvs(); });
// 窄屏上输入框放不下长提示
if (matchMedia('(max-width: 820px)').matches) $('question').placeholder = '问点什么…';
</script>
</body>
</html>
