<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>doc2sop</title>
<style>
:root {
  --bg: #f5f6fa; --panel: #ffffff; --panel-2: #f0f2f7; --border: #e3e6ee; --text: #1c2030;
  --muted: #7a8094; --accent: #4f6bff; --accent-2: #7c5cff; --accent-soft: #eef1ff;
  --danger: #e5484d; --ok: #1f9d6a; --shadow: 0 6px 24px rgba(30, 40, 90, .08);
  --user-bg: linear-gradient(135deg, #4f6bff, #7c5cff);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1117; --panel: #171a23; --panel-2: #1f2330; --border: #2a2f3d; --text: #e6e8ef;
    --muted: #8a90a3; --accent: #7b8cff; --accent-2: #a28bff; --accent-soft: #232a45;
    --shadow: 0 6px 24px rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 15px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
       color: var(--text); background: var(--bg); display: flex; overflow: hidden; }
button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
button:disabled { opacity: .5; cursor: default; }

/* ---------- 外壳：左侧常驻导航 + 右侧页面 ---------- */
#side { width: 216px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
        display: flex; flex-direction: column; transition: transform .25s; z-index: 50; }
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; cursor: pointer; border-radius: 12px; }
.brand:hover h1 { color: var(--accent); }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--user-bg); display: grid;
        place-items: center; color: #fff; font-size: 18px; box-shadow: var(--shadow); flex-shrink: 0; }
.brand h1 { font-size: 16px; margin: 0; }
.brand small { display: block; color: var(--muted); font-size: 11.5px; }
.nav { flex: 1; overflow-y: auto; padding: 6px 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 10px; font-size: 14px;
         color: var(--text); text-decoration: none; position: relative; }
.nav a svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round;
             stroke-linejoin: round; flex-shrink: 0; color: var(--muted); }
.nav a:hover { background: var(--panel-2); }
.nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav a.on svg { color: var(--accent); }
.nav a.on::before { content: ''; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0;
                    background: var(--accent); }
.nav .sec { font-size: 11px; color: var(--muted); letter-spacing: .08em; padding: 14px 12px 4px; }
/* 对话下面常驻最近 5 条对话（手机上在导航抽屉里） */
.nav-recent { display: flex; flex-direction: column; gap: 1px; margin: 0 0 4px 21px; padding-left: 6px; border-left: 1px solid var(--border); }
.nav-recent:empty { display: none; }
.nav .nav-recent a { display: block; padding: 4px 9px; font-size: 12.5px; color: var(--muted); border-radius: 7px;
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .nav-recent a:hover { color: var(--text); }
.nav .nav-recent a.on { background: none; color: var(--accent); font-weight: 600; }
.nav .nav-recent a.on::before { display: none; }
.nb { margin-left: auto; min-width: 20px; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600;
      line-height: 16px; text-align: center; background: var(--panel-2); color: var(--muted); font-variant-numeric: tabular-nums; }
.nb:empty { display: none; }
.nb.alert { background: #f59e0b; color: #fff; }
.nb.purple { background: #7c3aed; color: #fff; }
.nb.on { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.side-foot { border-top: 1px solid var(--border); padding: 10px 16px 12px; font-size: 11.5px; color: var(--muted); line-height: 1.7; }
.side-foot .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 1px; }
.side-foot .dot.bad { background: var(--danger); }
.drop { border: 1.5px dashed var(--border); border-radius: 12px; padding: 14px 12px;
        text-align: center; color: var(--muted); font-size: 13px; cursor: pointer; transition: .2s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.drop b { display: block; color: var(--text); font-size: 14px; margin-bottom: 2px; }
.drop.over b { color: var(--accent); }
.queue { padding: 0; }
.queue:not(:empty) { padding: 8px 16px 0; background: var(--panel); }
.job { font-size: 12.5px; background: var(--panel-2); border-radius: 8px; padding: 7px 10px; margin-bottom: 6px;
       display: flex; gap: 8px; align-items: flex-start; }
.job .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job.err { color: var(--danger); } .job.done { color: var(--ok); }
.job.err .name { white-space: pre-wrap; overflow: visible; word-break: break-word; line-height: 1.5; }
.job .close { color: inherit; opacity: .7; padding: 0 2px; flex-shrink: 0; }
.job .close:hover { opacity: 1; }
.spin { width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent);
        border-radius: 50%; animation: spin .8s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 10px; }

/* Main */
main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#top { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px 20px; border-bottom: 1px solid var(--border);
       background: var(--panel); position: relative; z-index: 30; flex-shrink: 0; }
#top svg, .page-x svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.9;
                        stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.top-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.top-title .t { font-weight: 650; font-size: 16px; white-space: nowrap; }
.top-title .sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-tabs { display: flex; gap: 4px; margin-left: 8px; }
.top-tabs:empty { display: none; }
.top-tabs button { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px;
                   font-size: 13px; color: var(--muted); white-space: nowrap; }
.top-tabs button:hover { background: var(--panel-2); color: var(--text); }
.top-tabs button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.top-tabs .nb { margin-left: 0; }
.top-acts { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.top-acts [data-for] { display: none !important; }
body[data-page="chat"] .top-acts [data-for~="chat"]:not([hidden]) { display: inline-flex !important; }
.page { flex: 1; min-height: 0; display: none; flex-direction: column; }
.page.on { display: flex; }
.model-chip { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; color: var(--muted);
              background: var(--panel-2); border: 1px solid var(--border); padding: 3px 26px 3px 22px; border-radius: 999px;
              max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
              appearance: none; -webkit-appearance: none; outline: none; position: relative;
              background-image:
                radial-gradient(circle, var(--ok) 2.6px, color-mix(in srgb, var(--ok) 20%, transparent) 2.7px, transparent 5px),
                linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                linear-gradient(135deg, var(--muted) 50%, transparent 50%);
              background-position: 6px center, calc(100% - 13px) 55%, calc(100% - 9px) 55%;
              background-size: 12px 12px, 4px 4px, 4px 4px; background-repeat: no-repeat; }
.model-chip:hover { color: var(--text); border-color: var(--accent); }
.model-chip option { font-size: 13px; color: var(--text); background: var(--panel); }
/* 作者样式里的 display 会盖掉 hidden 属性，不加这条，模型列表回来前会先露出一个空「●」 */
.model-chip[hidden], .web-toggle[hidden] { display: none; }
.tools .via { margin-left: auto; font-size: 11.5px; color: var(--muted); align-self: center; padding-right: 4px;
              max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 11px; border-radius: 10px;
           color: var(--text); font-size: 13px; transition: background .15s, color .15s; }
.nav-btn:hover { background: var(--panel-2); }
.nav-btn.open { background: var(--accent-soft); color: var(--accent); }
.nav-btn.icon-only { padding: 0 9px; }
.new-btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 10px;
           background: var(--user-bg); color: #fff; font-size: 13px; font-weight: 500;
           box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 30%, transparent); transition: transform .15s; }
.new-btn:hover { transform: translateY(-1px); }
.nav-sep { width: 1px; height: 20px; background: var(--border); margin: 0 6px; }
.badge { min-width: 18px; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; line-height: 16px;
         text-align: center; background: var(--panel-2); color: var(--muted); font-variant-numeric: tabular-nums; }
.badge:empty { display: none; }
.badge.on { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.nav-btn.open .badge { background: var(--panel); }
.pb-head .t small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
@media (max-width: 1000px) { .model-chip { display: none; } }
@media (max-width: 700px) { .nav-btn .lbl, .new-btn .lbl { display: none; } }
.icon-btn { padding: 6px 10px; border-radius: 8px; color: var(--muted); font-size: 13px; }
.icon-btn:hover { background: var(--panel-2); color: var(--text); }
.hist-wrap { position: static; }
.hist { position: absolute; top: calc(100% + 6px); right: 12px; width: 300px; max-width: calc(100vw - 24px);
        max-height: 60vh; overflow-y: auto;
        background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 6px;
        box-shadow: var(--shadow); z-index: 40; }
.conv { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; cursor: pointer; }
.conv:hover { background: var(--panel-2); }
.conv.on { background: var(--accent-soft); }
.conv .meta { flex: 1; min-width: 0; }
.conv .title { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv .sub { font-size: 12px; color: var(--muted); }
.conv .del { opacity: 0; color: var(--muted); padding: 4px 6px; border-radius: 6px; }
.conv:hover .del { opacity: 1; }
.conv .del:hover { color: var(--danger); background: var(--panel); }
#chat { flex: 1; overflow-y: auto; padding: 24px 20px 12px; scroll-behavior: smooth; }
.wrap { max-width: 820px; margin: 0 auto; }

.welcome { text-align: center; padding: 5vh 10px 20px; }
.welcome .logo { width: 56px; height: 56px; font-size: 28px; border-radius: 16px; margin: 0 auto 14px; }
.welcome h2 { margin: 0 0 6px; font-size: 22px; }
.welcome p { color: var(--muted); margin: 0 0 22px; }
/* 两列网格：四个示例永远两行，不会第四个孤零零掉到输入框底下 */
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 620px; margin: 0 auto; }
.chip { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px;
        font-size: 13.5px; text-align: left; box-shadow: var(--shadow); }
.chip:hover { border-color: var(--accent); color: var(--accent); }
@media (max-width: 820px) { .chips { grid-template-columns: 1fr; } }

.msg { display: flex; gap: 12px; margin-bottom: 22px; animation: in .25s ease; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }
.msg.user { justify-content: flex-end; }
.bubble-user { background: var(--user-bg); color: #fff; padding: 10px 14px; border-radius: 16px 16px 4px 16px;
               max-width: 80%; white-space: pre-wrap; word-break: break-word; box-shadow: var(--shadow); }
.avatar { width: 32px; height: 32px; border-radius: 10px; background: var(--user-bg); color: #fff; display: grid;
          place-items: center; flex-shrink: 0; font-size: 16px; }
.bot { flex: 1; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 4px 16px 16px 16px;
        padding: 14px 18px; box-shadow: var(--shadow); }
.status { color: var(--muted); font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
.status .tick { margin-left: auto; font-size: 12px; opacity: .7; font-variant-numeric: tabular-nums; }
.answer { word-break: break-word; }
.answer > :first-child { margin-top: 0; } .answer > :last-child { margin-bottom: 0; }
.answer h1, .answer h2, .answer h3, .answer h4 { margin: 14px 0 6px; line-height: 1.35; }
.answer h1 { font-size: 19px; } .answer h2 { font-size: 17px; } .answer h3, .answer h4 { font-size: 15.5px; }
.answer p { margin: 6px 0; } .answer ul, .answer ol { margin: 6px 0; padding-left: 22px; }
.answer li { margin: 3px 0; }
.answer code { background: var(--panel-2); padding: 1px 5px; border-radius: 5px; font-size: 13px;
               font-family: ui-monospace, Consolas, monospace; }
.answer pre { background: var(--panel-2); padding: 12px 14px; border-radius: 10px; overflow-x: auto; }
.answer pre code { background: none; padding: 0; }
.answer blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--accent); color: var(--muted); }
.answer table { border-collapse: collapse; margin: 8px 0; font-size: 13.5px; display: block; overflow-x: auto; }
.answer th, .answer td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
.answer th { background: var(--panel-2); white-space: nowrap; }
.answer hr { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
.cite { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; margin: 0 1px;
        border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 700;
        cursor: pointer; vertical-align: 2px; }
.cite:hover { background: var(--accent); color: #fff; }
.error { color: var(--danger); }
.cursor::after { content: "▍"; color: var(--accent); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.sources { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.src-unused { font-size: 12.5px; color: var(--muted); }
.src-unused > summary { cursor: pointer; padding: 4px 2px; list-style: none; }
.src-unused > summary::-webkit-details-marker { display: none; }
.src-unused > summary::before { content: '▸ '; }
.src-unused[open] > summary::before { content: '▾ '; }
.src-unused .src { margin-top: 6px; opacity: .7; }
.src { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; font-size: 13px;
       transition: border-color .2s; }
.src.flash { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.src summary { list-style: none; cursor: pointer; padding: 8px 12px; display: flex; gap: 8px; align-items: center; }
.src summary::-webkit-details-marker { display: none; }
.src summary .n { color: var(--accent); font-weight: 700; }
.src summary .loc { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { width: 48px; height: 5px; background: var(--panel-2); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.src .body { white-space: pre-wrap; padding: 0 12px 10px; color: var(--muted); max-height: 260px; overflow-y: auto; }
.tools { margin-top: 6px; display: flex; gap: 4px; }
.steps { margin: 8px 0 2px; display: flex; flex-direction: column; gap: 6px; }
.step { background: var(--panel-2); border: 1px solid var(--border); border-left: 3px solid var(--accent);
        border-radius: 8px; font-size: 13px; overflow: hidden; animation: in .2s ease; }
.step summary { list-style: none; cursor: pointer; padding: 7px 11px; display: flex; gap: 8px; align-items: center; }
.step summary::-webkit-details-marker { display: none; }
.step .ico { font-size: 13px; }
.step .cmd { font-family: ui-monospace, Consolas, monospace; color: var(--accent); flex-shrink: 0; }
.step .arg { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step .n { color: var(--muted); font-size: 12px; flex-shrink: 0; }
.step .out { white-space: pre-wrap; padding: 0 11px 9px; color: var(--muted); font-size: 12.5px;
             font-family: ui-monospace, Consolas, monospace; max-height: 240px; overflow-y: auto; }
.step.running { border-left-color: #f59e0b; }
.step.running .cmd { color: #f59e0b; }

/* Playbooks / Tools：右侧抽屉，分组可折叠（菜单形态），条目多了也翻得动 */
.pb-wrap { position: static; }
.pb-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 520px; max-width: 100vw;
            overflow-y: auto; background: var(--panel); border-left: 1px solid var(--border);
            padding: 12px 14px 20px; box-shadow: -8px 0 30px rgba(0,0,0,.12); z-index: 60;
            animation: drawer-in .18s ease-out; }
.pb-panel.tl-wrap, .pb-panel.pb-wrap { position: fixed; }
@keyframes drawer-in { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.pb-head { display: flex; align-items: center; gap: 8px; padding: 2px 0 10px; position: sticky; top: -12px;
           background: var(--panel); z-index: 2; margin: -12px -14px 0; padding: 12px 14px 10px; }
.pb-head .t { flex: 1; font-weight: 600; font-size: 14px; }
.pb-head .x { width: 28px; height: 28px; border-radius: 8px; font-size: 15px; color: var(--muted); background: var(--panel-2); }
.pb-head .x:hover { color: var(--text); }
.pb-search { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
.pb-search input { flex: 1; font: inherit; font-size: 12.5px; padding: 6px 9px; border-radius: 7px;
                   border: 1px solid var(--border); background: var(--panel-2); color: var(--text); outline: none; }
.pb-search input:focus { border-color: var(--accent); }
.pb-search .n { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.pb-nomatch { font-size: 12.5px; color: var(--muted); text-align: center; padding: 14px 0; }
.grp { margin-bottom: 4px; }
.grp[hidden], .pb[hidden] { display: none; }
.grp > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 7px; user-select: none;
                 font-size: 12.5px; font-weight: 600; color: var(--text); padding: 8px 6px; border-radius: 8px; }
.grp > summary::-webkit-details-marker { display: none; }
.grp > summary:hover { background: var(--panel-2); }
.grp > summary .chev { width: 14px; color: var(--muted); transition: transform .15s; font-size: 11px; }
.grp[open] > summary .chev { transform: rotate(90deg); }
.grp > summary .gl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grp > summary .gc { font-weight: 400; font-size: 11.5px; color: var(--muted); }
.grp > summary .gc b { color: #059669; font-weight: 600; }
.grp > .body { padding: 2px 0 4px 8px; }
.more { display: block; width: 100%; margin: 2px 0 10px; padding: 8px; border-radius: 8px; font-size: 12.5px;
        border: 1px dashed var(--border); background: var(--panel-2); color: var(--accent); }
.more:hover { border-style: solid; }
.more:disabled { color: var(--muted); }
.pb { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; }
.pb.off { opacity: .55; }
.pb.bad { border-color: var(--danger); }
.pb-top { display: flex; align-items: center; gap: 8px; padding: 9px 11px; }
.pb-top .nm { flex: 1; font-size: 13.5px; font-weight: 600; min-width: 0;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pb-top .src { font-size: 11.5px; color: var(--muted); flex-shrink: 0; }
.pb-top button { font-size: 12px; color: var(--muted); padding: 3px 7px; border-radius: 6px; flex-shrink: 0; }
.pb-top button:hover { background: var(--panel-2); color: var(--text); }
.pb-body { padding: 0 11px 10px; font-size: 12.5px; }
.pb-trig { color: var(--muted); margin-bottom: 6px; }
.pb-step { display: flex; gap: 7px; padding: 5px 0; border-top: 1px dashed var(--border); align-items: baseline; flex-wrap: wrap; }
.pb-step .i { color: var(--accent); font-weight: 700; flex-shrink: 0; }
.pb-step .tl { font-family: ui-monospace, Consolas, monospace; color: var(--accent); flex-shrink: 0; }
.pb-step .ck { color: var(--muted); flex: 1; }
.pb-warn { color: var(--danger); font-size: 12px; padding: 4px 11px 8px; }
.pb-edit textarea { width: 100%; box-sizing: border-box; min-height: 190px; font-size: 12.5px;
                    font-family: ui-monospace, Consolas, monospace; padding: 9px; border-radius: 8px;
                    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
                    resize: vertical; }
.pb-edit .row { display: flex; gap: 6px; margin-top: 7px; }
.pb-edit .row button { padding: 6px 13px; border-radius: 7px; font-size: 13px; }

                color: var(--muted); margin-top: 3px; }

/* 工具卡片的标记多（SQL、外部、连接……），一行放不下就折行，按钮靠右，不把「停用」挤出卡片 */

#tlNewSql { width: 100%; box-sizing: border-box; min-height: 70px; font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace;
  padding: 7px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
  resize: vertical; margin-bottom: 6px; }
.tl-rows { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); margin: 0 0 6px; }

.tl-pick input { margin-bottom: 6px; }
.tl-os { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 12px; color: var(--muted); margin: -2px 0 8px; }
.tl-os label { display: flex; align-items: center; gap: 4px; color: var(--text); }
.tl-os input { width: auto; margin: 0; }

.tl-pform { border: 1px dashed var(--border); border-radius: 10px; padding: 8px 10px 4px; margin-bottom: 8px; }
.tl-param { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: center; margin-bottom: 6px;
            padding-bottom: 6px; border-bottom: 1px solid var(--border); }

.tl-param label { font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 4px; }

.tl-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
.tl-tab { font-size: 12.5px; padding: 4px 14px; border-radius: 7px; border: 1px solid var(--border);
          background: var(--panel); color: var(--muted); }
.tl-tab.on { background: var(--user-bg); color: #fff; border-color: var(--user-bg); }
.tl-script { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; white-space: pre;
             overflow: auto; max-height: 180px; background: var(--panel-2); color: var(--text);
             border: 1px solid var(--border); border-radius: 7px; padding: 8px; margin: 2px 0 6px; }
.pb-pick input:focus, .pb-pick select:focus { border-color: var(--accent); }
.pb-pick .row { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
.pb-pick .row button { padding: 6px 13px; border-radius: 7px; font-size: 13px; }
.pb-pick .go { background: var(--user-bg); color: #fff; }
.pb-pick .cancel { background: var(--panel); color: var(--muted); }
.pb-pick .cnt { flex: 1; font-size: 12px; color: var(--muted); }
.tools button { font-size: 12px; color: var(--muted); padding: 3px 8px; border-radius: 6px; }
.tools button:hover { background: var(--panel-2); color: var(--text); }
.tools button[data-savenote] { color: #0284c7; }
.note-edit { margin-top: 8px; border: 1px solid #0ea5e9; border-radius: 10px; padding: 10px;
             background: rgba(14,165,233,.06); font-size: 13px; }
.note-edit .hd { font-weight: 600; margin-bottom: 6px; }
.note-edit input, .note-edit textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 13px;
             padding: 7px 9px; border-radius: 7px; border: 1px solid var(--border);
             background: var(--panel); color: var(--text); margin-bottom: 6px; }
.note-edit textarea { min-height: 160px; resize: vertical; }

.note-edit .ok { background: var(--user-bg); color: #fff; }

.note-edit .msg { font-size: 12px; color: var(--muted); }
.note-edit .done { color: #059669; }
/* 「沉淀为 SOP」提议卡：回答末尾和 SOP 面板「待确认提议」共用 */
.proposal { margin-top: 8px; border: 1px solid #a78bfa; border-radius: 10px; padding: 10px 12px;
            background: rgba(139,92,246,.06); font-size: 13px; }
.proposal .hd { font-weight: 600; line-height: 1.5; }
.proposal .trig { font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; }
.proposal > details > summary { cursor: pointer; font-size: 12.5px; color: #7c3aed; margin: 6px 0 2px; list-style: none; }
.proposal > details > summary::before { content: '▸ '; }
.proposal > details[open] > summary::before { content: '▾ '; }
.proposal ol { margin: 4px 0 6px; padding-left: 20px; }
.proposal ol li { margin: 4px 0; }
.proposal ol b { font-family: ui-monospace, Consolas, monospace; color: var(--accent); font-weight: 600; }
.proposal ol .a { color: var(--muted); font-size: 12px; margin-left: 4px; }
.proposal ol .cp { font-size: 12.5px; }
.proposal ol .ev { font-size: 12px; color: var(--muted); }
.proposal ol .ev.bad { color: #b45309; }
.proposal .lbl { font-size: 11.5px; color: var(--muted); margin: 6px 0 2px; }
.proposal .step { margin: 4px 0; }
.proposal .row { display: flex; gap: 6px; align-items: center; margin: 8px 0 2px; }
.proposal .row button { padding: 5px 13px; border-radius: 7px; font-size: 13px; }
.proposal .ok { background: #7c3aed; color: #fff; }
.proposal .cancel { background: var(--panel-2); color: var(--muted); }
.proposal .msg { font-size: 12px; color: var(--muted); }
.proposal .tip { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
/* 提议卡片刚出现时闪一下，让正看着回答末尾的人注意到它 */
.proposal { transition: box-shadow .3s; }
.proposal.flash { box-shadow: 0 0 0 4px #ddd6fe; }
/* 用户翻到别处时不拉他回来，改在输入框上方挂一条可点的提示 */
.nudge { position: absolute; left: 50%; bottom: calc(100% - 2px); transform: translateX(-50%); z-index: 5;
         padding: 6px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: #fff; cursor: pointer;
         background: #7c3aed; box-shadow: 0 4px 14px rgba(124,58,237,.35); white-space: nowrap;
         animation: toast-in .18s ease-out; }
.nudge:hover { background: #6d28d9; }
.pb-pending { margin: 0 0 10px; }
.pb-pending > summary { cursor: pointer; font-size: 13px; font-weight: 600; color: #7c3aed; padding: 6px 4px; list-style: none; }
.pb-pending > summary::before { content: '▸ '; }
.pb-pending[open] > summary::before { content: '▾ '; }
.pb-pending .proposal { margin: 4px 0 8px; }

/* Composer */
.composer { padding: 10px 20px 18px; position: relative; }
.box { max-width: 820px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; background: var(--panel);
       border: 1px solid var(--border); border-radius: 16px; padding: 8px 8px 8px 8px; box-shadow: var(--shadow); }

#question { flex: 1; border: 0; outline: none; resize: none; background: transparent; color: var(--text);
            font: inherit; max-height: 180px; padding: 6px 4px; }
#askBtn { width: 38px; height: 38px; border-radius: 12px; background: var(--user-bg); color: #fff; font-size: 17px;
          flex-shrink: 0; }
/* 联网开关：放在输入框最左边，开关态一眼能分辨 */
.web-toggle { height: 38px; padding: 0 12px 0 10px; border-radius: 12px; font-size: 13px; font-weight: 600; flex-shrink: 0;
              display: inline-flex; align-items: center; gap: 6px; align-self: flex-end;
              border: 1.5px solid var(--border); background: var(--panel-2); color: var(--muted); transition: all .15s; }
.web-toggle svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.web-toggle .state { font-size: 11px; font-weight: 500; padding: 1px 6px; border-radius: 999px; background: var(--panel); color: var(--muted); }
.web-toggle:hover { border-color: #0ea5e9; color: #0284c7; }
.web-toggle.on { border-color: #0ea5e9; background: linear-gradient(135deg, #0ea5e9, #2563eb); color: #fff;
                 box-shadow: 0 2px 10px rgba(14,165,233,.35); }

.tools .via b { font-weight: 500; color: var(--text); }
.tools .via .dot { margin: 0 6px; opacity: .5; }
.src.web summary .n { color: #0284c7; }
.src.web summary .host { color: var(--muted); font-size: 12px; flex-shrink: 0; }
.src.web .body a { color: #0284c7; word-break: break-all; }
.step.web { border-left-color: #0ea5e9; }
.step.web .cmd { color: #0284c7; }
.step.kb { border-left-color: #10b981; }
.step.kb .cmd { color: #059669; }
.step.compute { border-left-color: #8b5cf6; }
.step.compute .cmd { color: #7c3aed; }
.plan { background: var(--panel-2); border: 1px solid var(--border); border-left: 3px solid #10b981; border-radius: 10px;
        padding: 7px 11px; margin: 8px 0 2px; font-size: 13px; }
.plan .hd { font-weight: 600; margin-bottom: 3px; }
.plan .hd .n { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
.plan .it { display: flex; gap: 8px; align-items: baseline; padding: 1px 0; }
.plan .it .ck { flex-shrink: 0; width: 1.2em; text-align: center; }
.plan .it.done, .plan .it.skipped { color: var(--muted); }
.plan .it.done .tt { text-decoration: line-through; }
.plan .it.in_progress { color: var(--accent); font-weight: 600; }
.hint { max-width: 820px; margin: 6px auto 0; font-size: 12px; color: var(--muted); text-align: center; }

/* ---------- 工具 / SOP / 文档：分组 → 列表 → 详情；设置、对外接入、主机与数据源：单栏 ---------- */
#manage { display: flex; flex: 1; min-height: 0; }
body.nogroups #mgroups, body.nogroups .msplit[data-split="mgroups"] { display: none; }
#mgroups { width: 230px; flex-shrink: 0; border-right: 1px solid var(--border); overflow-y: auto; padding: 10px 8px; background: var(--panel); }
.mg-head { font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: .04em; padding: 6px 10px 6px; }
.mg { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text); }
.mg:hover { background: var(--panel-2); }
.mg.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.mg .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mg .c { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mg .c b { color: #059669; font-weight: 600; }
.mg.on .c, .mg.on .c b { color: var(--accent); }
.mg.special { color: #b45309; }
#mlist { flex: 1; min-width: 360px; display: flex; flex-direction: column; background: var(--bg); }
.mtool { display: flex; flex-wrap: wrap; row-gap: 8px; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
.mtool .ttl { font-weight: 650; font-size: 15px; white-space: nowrap; }
.mtool .ttl small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 8px; }
.mtool input[type=search] { flex: 1; min-width: 120px; font: inherit; font-size: 13px; padding: 7px 11px; border-radius: 8px;
                            border: 1px solid var(--border); background: var(--panel-2); color: var(--text); outline: none; }
.mtool input[type=search]:focus { border-color: var(--accent); }
.mtool input.cat { width: 200px; font: inherit; font-size: 13px; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--border);
                   background: var(--panel-2); color: var(--text); outline: none; }
.mtool .passline { margin-left: auto; }
.attest.flash { box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 25%, transparent); }
.mtool .act { white-space: nowrap; font-size: 13px; padding: 7px 13px; border-radius: 8px; background: var(--user-bg); color: #fff; }
.mtool .act.ghost { background: var(--panel-2); color: var(--text); }
.mtool .act:hover { filter: brightness(1.05); }
.mrows { flex: 1; overflow-y: auto; }
.mrow { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; column-gap: 12px; padding: 10px 16px;
        border-bottom: 1px solid var(--border); cursor: pointer; background: var(--panel); }
.mrow:hover { background: var(--panel-2); }
.mrow.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.mrow .t { grid-column: 1; grid-row: 1; font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .t code { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.mrow .s { grid-column: 1; grid-row: 2; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .st { grid-column: 2; grid-row: 1 / 3; align-self: center; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
            background: var(--panel-2); color: var(--muted); }
.mrow .st.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.mrow .st.bad { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
.mrow .st.cat { background: var(--accent-soft); color: var(--accent); }
.mrows .more { margin: 10px 16px; width: auto; }
.mrows .empty { padding: 48px 16px; }
#mdetail { width: 440px; flex-shrink: 0; border-left: 1px solid var(--border); overflow-y: auto; padding: 16px; background: var(--panel); }
#mdetail .pb-panel { position: static; width: auto; border: 0; box-shadow: none; animation: none; padding: 0; overflow: visible; }
#mdetail .pb-panel[hidden] { display: none; }
#mdetail .pb { margin: 0 0 10px; }
#mdetail .pb-pick, #mdetail .pb-edit { margin: 0; }
.md-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 60px 10px; line-height: 1.8; }
/* 分栏拖拽条：细线，悬停/拖动时变粗变色 */
.msplit { width: 5px; margin: 0 -2px; flex-shrink: 0; cursor: col-resize; position: relative; z-index: 5; background: transparent;
          transition: background .15s; }
.msplit:hover, .msplit.on { background: var(--accent); }
body.resizing { cursor: col-resize; user-select: none; }
body.resizing * { pointer-events: none; }
body.resizing .msplit { pointer-events: auto; }
#mgroups, #mdetail { border: 0; }
#mgroups { box-shadow: inset -1px 0 0 var(--border); }
#mdetail { box-shadow: inset 1px 0 0 var(--border); }
/* 单栏页（设置、对外接入、主机与数据源）：不要分组栏、列表栏和详情栏 */
body.settings #mgroups, body.settings #mlist, body.settings #mdetail, body.settings .msplit { display: none; }
#msettings { flex: 1; overflow-y: auto; padding: 24px 32px 48px; background: var(--bg); }
#msettings[hidden] { display: none; }
.sf { max-width: 760px; margin: 0 auto; }
.sf h2 { font-size: 17px; margin: 0 0 4px; }
.sf .lead { color: var(--muted); font-size: 13px; margin: 0 0 18px; line-height: 1.6; }

.sf label { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; margin-bottom: 10px; font-size: 13px; }

.sf label > span i { display: block; font-style: normal; font-size: 11px; color: var(--muted); opacity: .8; }

                        background: var(--panel-2); color: var(--text); outline: none; width: 100%; box-sizing: border-box; }

.sf .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.sf .row button { font-size: 13px; padding: 8px 16px; border-radius: 8px; background: var(--panel-2); color: var(--text); }
.sf .row button.pri { background: var(--user-bg); color: #fff; }
.sf .row button.danger { color: var(--danger); }

.sf .result { margin-top: 12px; font-size: 13px; line-height: 1.7; padding: 10px 12px; border-radius: 8px; background: var(--panel-2); }

/* 页内提示：替代 alert，不打断操作 */

          display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }

/* toast 在右侧页面区域里居中，不压在导航上 */
@media (min-width: 821px) { #toasts { left: calc(50% + 108px); } }

/* 首屏引导：知识库空、或还没有生效的 SOP 时显示 */

.onboard .st.done .k i { background: #059669; }

/* 演示场景包的导入进度：挂在引导卡上方，一行字，导完自己消失 */

/* 工具调用卡片展开后的参数与返回 */

.ic.kb { background: rgba(16,185,129,.13); } .ic.tl { background: var(--accent-soft); }

.welcome .ex { max-width: 760px; margin: 0 auto; text-align: left; }

/* ---------- 审批：申请的完整内容、风险提示、口令 ---------- */

.kd.command { background: rgba(71,85,105,.12); color: #475569; } .kd.script { background: rgba(245,158,11,.16); color: #b45309; }

.argv { display: flex; flex-wrap: wrap; gap: 5px; font: 12.5px ui-monospace, Consolas, monospace; background: var(--panel-2);
        border: 1px solid var(--border); border-radius: 10px; padding: 10px; }

.ap pre.code { margin: 0; font: 12px/1.55 ui-monospace, Consolas, monospace; background: var(--panel-2); border: 1px solid var(--border);
               border-radius: 10px; padding: 10px 12px; max-height: 240px; overflow: auto; white-space: pre; }
.ap .note { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 6px; }
.ap .note code { font-size: 11.5px; }
table.pt { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.pt th, table.pt td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.pt th { color: var(--muted); font-weight: 500; white-space: nowrap; }
table.pt .rx { display: block; font-size: 11px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
.where { display: grid; grid-template-columns: 70px 1fr; gap: 7px 10px; font-size: 12.5px; margin: 0; }

.ap-bar { position: sticky; bottom: -16px; margin: 0 -16px -16px; padding: 12px 16px 16px; background: var(--panel);
          border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; z-index: 2; }

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPE = {pdf:['PDF','#e5484d'], docx:['DOC','#3b82f6'], pptx:['PPT','#f97316'], txt:['TXT','#64748b'],
  md:['MD','#0ea5e9'], markdown:['MD','#0ea5e9'], png:['IMG','#10b981'], jpg:['IMG','#10b981'], jpeg:['IMG','#10b981'],
  webp:['IMG','#10b981'], bmp:['IMG','#10b981'], gif:['IMG','#10b981']};
let allDocs = [], seq = 0;
/* 左侧导航的每一项是一页，对应一个路径（/、/chat、/tools…）：同一份 HTML 按路径切换，刷新、书签都回到原处。
   工具、SOP、文档是「分组 → 列表 → 详情」三栏；设置、对外接入、主机与数据源是单栏。 */
const PAGES = {home: ['/', '工作台'], chat: ['/chat', '对话'], tools: ['/tools', '工具'], sop: ['/sop', 'SOP'],
               docs: ['/docs', '文档'], access: ['/access', '对外接入'], settings: ['/settings', '设置']};
let page = 'home';
let mTab = 'tools', mGroup = null, mItem = null, mSearch = '';
// 工具页的页签：全部工具 / 待审批 / 主机与数据源；SOP 页：全部 SOP / 待确认提议
let tlTab = 'all', pbTab = 'all', pbOrigins = null;
const mCache = {};  // 列表里出现过的条目：id -> 数据，点开详情直接用
// 工作台的汇总（/api/overview）：导航徽标、示例问题、工具的中文名都从这里取
let overview = null;
// 首屏引导要用的三个数字：文档数、可用工具数、生效 SOP 数
let onboard = {docs: 0, tools: 0, sops: 0, configured: true, loaded: false, examples: [], packs: null};
let packPoll = null;

/* 页内提示，替代 alert：不阻塞，几秒后自己消失。kind: '' | 'err' | 'ok' */
function toast(text, kind = '', ms = 4000) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = text;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .25s'; setTimeout(() => el.remove(), 260); }, ms);
}

/* ---------- Minimal, XSS-safe Markdown ---------- */
function inline(s) {
  s = esc(s);
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => (codes.push(c), `\u0000${codes.length - 1}\u0000`));
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
       .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
       .replace(/~~([^~]+)~~/g, '<del>$1</del>')
       .replace(/\[(W?\d{1,2})\]/g, '<span class="cite" data-n="$1">$1</span>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}
function md(src) {
  const lines = src.replace(/\r/g, '').split('\n'); const out = []; let i = 0;
  const isTableSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`); continue;
    }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (l.includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const head = cells(l); i += 2; const rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) rows.push(cells(lines[i++]));
      out.push(`<table><thead><tr>${head.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>` +
        rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('') + '</tbody></table>');
      continue;
    }
    if (/^>\s?/.test(l)) {
      const buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
      out.push(`<blockquote>${md(buf.join('\n'))}</blockquote>`); continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      const ordered = /^\s*\d/.test(l); const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
        let item = lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, '');
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]))
          item += '\n' + lines[i++].trim();
        const sub = [];
        while (i < lines.length && /^\s{2,}([-*+]|\d+[.)])\s+/.test(lines[i])) sub.push(lines[i++].trim());
        items.push(inline(item).replace(/\n/g, '<br>') + (sub.length ? md(sub.join('\n')) : ''));
      }
      const tag = ordered ? 'ol' : 'ul';
      out.push(`<${tag}>${items.map(x => `<li>${x}</li>`).join('')}</${tag}>`); continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|>|\s*([-*+]|\d+[.)])\s+)/.test(lines[i])
           && !(lines[i].includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1]))) buf.push(lines[i++]);
    out.push(`<p>${buf.map(inline).join('<br>')}</p>`);
  }
  return out.join('');
}

/* ---------- Documents ---------- */
async function loadDocs() {
  const d = await (await fetch('/api/documents')).json();
  allDocs = d.documents;
  const before = JSON.stringify(onboard);
  const pk = d.packs || {};
  onboard = {docs: allDocs.length, tools: (d.tools || []).length, sops: d.playbooks || 0, configured: d.configured !== false, loaded: true,
             examples: d.examples || [],
             packs: {importing: pk.importing || '', stage: pk.stage || '', pending: pk.pending || [], notes: pk.notes || {}, failed: pk.failed || {}}};
  if (d.bot_name && d.bot_name !== botName) botName = d.bot_name;
  applyBrand();
  if ($('thread').querySelector('.welcome') && (before !== JSON.stringify(onboard) || d.bot_name !== botName)) welcome();
  // 演示场景包还在后台导：隔几秒刷一次，导完工作台的引导自己变样、示例问题换成包里的
  clearTimeout(packPoll);
  if (onboard.configured && (onboard.packs.importing || onboard.packs.pending.length)) packPoll = setTimeout(loadDocs, 3000);
  $('catList').innerHTML = (d.categories || []).map(c => `<option value="${esc(c)}">`).join('');
  loadModels(d.chat_model);
  refreshBadges();
  $('webBtn').hidden = !d.web_search;
  sopGrowth = !!d.sop_growth;
  paintWeb();
  if (d.web_search && page === 'chat') webNotice();
  if (page === 'docs') renderManage();
  if (page === 'home') renderHome();
}
/* 文档的 改分类 / 下载 / 删除：文档页详情里的按钮 */
async function docActions(e) {
  const tag = e.target.closest('.tag');
  if (tag) {
    const next = prompt(`「${tag.dataset.cat}」的分类：`, tag.dataset.now);
    if (next === null) return;
    const value = next.trim();
    if (!value || value === tag.dataset.now) return;
    const r = await fetch('/api/documents/' + encodeURIComponent(tag.dataset.cat) + '/category',
                          {method: 'PATCH', headers: {'Content-Type': 'application/json'},
                           body: JSON.stringify({category: value})});
    if (!r.ok) {
      const d = await r.json().catch(() => ({detail: '服务器错误 ' + r.status}));
      toast('修改分类失败：' + (d.detail?.[0]?.msg || d.detail), 'err');
    }
    loadDocs();
    return;
  }
  const download = e.target.closest('.download');
  if (download) {
    download.disabled = true;
    download.textContent = '下载中';
    try {
      const r = await fetch('/api/documents/' + encodeURIComponent(download.dataset.name) + '/download');
      if (!r.ok) {
        const d = await r.json().catch(() => ({detail: '服务器错误 ' + r.status}));
        throw new Error(d.detail);
      }
      const url = URL.createObjectURL(await r.blob());
      const link = document.createElement('a');
      link.href = url;
      link.download = download.dataset.name;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (error) {
      toast('下载失败：' + error.message, 'err');
    } finally {
      download.disabled = false;
      download.textContent = '下载';
    }
    return;
  }
  const name = e.target.closest('.del')?.dataset.name;
  if (!name || !confirm(`确定删除「${name}」？`)) return;
  await fetch('/api/documents/' + encodeURIComponent(name), {method: 'DELETE'});
  if (mItem === name) mItem = null;
  loadDocs();
}

/* ---------- Upload ---------- */
let uploading = Promise.resolve();
function enqueue(files) {
  if (!files.length) return;
  const category = ($('newCat')?.value || '').trim();
  for (const f of files) {
    const job = document.createElement('div'); job.className = 'job';
    if (category) job.dataset.category = category;

async function upload(f, job) {
  const state = job.lastElementChild;
  state.textContent = '上传中';
  const fail = reason => {
    job.querySelector('.spin')?.remove();
    job.classList.add('err');
    job.querySelector('.name').textContent = `${f.name}\n✕ ${reason}`;
    state.remove();
    job.insertAdjacentHTML('beforeend', '<button class="close" title="关闭">✕</button>');
  };
  try {
    const fd = new FormData();
    fd.append('file', f);
    fd.append('background', '1');
    if (job.dataset.category) fd.append('category', job.dataset.category);
    const r = await fetch('/api/documents', {method: 'POST', body: fd});
    let d = await r.json().catch(() => ({detail: `服务器错误 ${r.status}（响应不是 JSON，可能是网关超时）`}));
    if (!r.ok) {
      return fail(Array.isArray(d.detail) ? d.detail.map(x => x.msg || JSON.stringify(x)).join('；')
                                          : (d.detail || `HTTP ${r.status}`));
    }
    // 后台入库：轮询进度，页面上能看到「识别图片 3/12」「向量化 57 个片段」这样的阶段
    if (d.job) {
      let job_;
      do {
        await new Promise(res => setTimeout(res, 1200));
        const jr = await fetch('/api/jobs/' + d.job);
        if (!jr.ok) return fail('任务状态丢失，请刷新后查看文档列表');
        job_ = await jr.json();
        state.textContent = job_.stage;
      } while (job_.status === 'queued' || job_.status === 'running');
      if (job_.status === 'error') return fail(job_.detail || '入库失败');
      d = job_.result;
    }
    const im = d.images || {};
    job.querySelector('.spin')?.remove();
    job.classList.add('done');
    state.textContent = `✓ ${d.chunks} 片段` + (im.described ? ` · ${im.described} 图` : '')
                      + (im.failed ? ` · ${im.failed} 图失败` : '') + ` · ${d.category}`;
    setTimeout(() => job.remove(), im.failed ? 15000 : 6000);
  } catch (e) {
    fail(`网络中断或请求超时：${e.message}`);
  } finally { loadDocs(); }
}

/* PDF 抽出的文本常常一词一行，直接显示像被撕碎。只在「短行占多数」时合并单换行，
   空行分段、列表、表格、代码缩进保留；只影响显示，不动入库内容。 */
function tidy(text) {
  // PDF 常把「1.」拆成「1」「.」两行，先缝回去
  const lines = String(text || '').replace(/\n(\d+)\n\.\s*\n/g, '\n$1. ').split('\n');
  const body = lines.filter(l => l.trim());
  if (body.length < 6 || body.filter(l => l.trim().length < 12).length < body.length * 0.5) return text;
  const keep = l => /^\s*(?:[-*•]|\d+[.、)]|\||#|```|\s{2,})/.test(l) || /^\s*$/.test(l);
  // 上一行是空行 / 表格 / 代码缩进时才强制换行；列表项的续行要接回去
  const hard = l => /^\s*$/.test(l) || /^\s*(?:\||```|\s{2,})/.test(l);
  const cjk = ch => /[\u3000-\u9fff\uff00-\uffef]/.test(ch);
  let out = '', prev = '';
  for (const raw of lines) {
    const l = raw.trim();
    if (!out || keep(raw) || hard(prev) || !l) { out += (out ? '\n' : '') + raw.replace(/\s+$/, ''); prev = raw; continue; }
    const a = out[out.length - 1], b = l[0];
    out += (cjk(a) || cjk(b) || /[（(【「]$/.test(out) ? '' : ' ') + l; prev = raw;
  }
  return out.replace(/\n{3,}/g, '\n\n');
}

    <input class="nt" maxlength="60" value="${esc(title)}" placeholder="文档标题">

async function saveNote(bot, box) {
  const msg = box.querySelector('.msg');

                answer: box.querySelector('.nb').value.trim(),

                                             body: JSON.stringify(body)});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : '保存失败');
    box.innerHTML = `<div class="done">✓ 已存入知识库：${esc(d.source)}（${d.chunks} 个片段）。下次问到相同问题会直接从知识库回答。</div>`;

/* ---------- 自由排查 → 沉淀为 SOP ----------
   回答结束后服务端在后台判断这一轮值不值得长成 SOP；提议落库，页面按退避节奏轮询取回。
   卡片在回答末尾和 SOP 面板「待确认提议」里长一个样：保存 = 存成「从实践沉淀」且默认停用，忽略 = 同样的轨迹 30 天内不再提。 */
function proposalHtml(p) {
  const s = p.summary || {};
  const head = p.kind === 'extend_sop'
    ? `这次用 ${s.tools || '?'} 个工具得出结论，和 SOP《${esc(p.target?.name || '')}》很像——把多出来的 ${p.steps.length} 步补充进去？`
    : `这次用 ${s.tools || '?'} 个工具、${p.steps.length} 步得出结论，沉淀为 SOP《${esc(p.name)}》？`;
  const kv = a => Object.entries(a || {}).map(([k, v]) => `${esc(k)}=${esc(v === '' ? '（使用时填）' : v)}`).join(' ');
  const steps = p.steps.map(st => `<li><b title="${esc(st.tool)}">${esc(toolLabel(st.tool))}</b><span class="a">${kv(st.args)}</span>
      <div class="cp">${esc(st.checkpoint || '')}</div>${st.evidence ? `<div class="ev ${st.evidence.startsWith('⚠') ? 'bad' : ''}">依据：${esc(st.evidence)}</div>` : ''}</li>`).join('');
  const ev = (p.evidence || []).map(e => `<details class="step ${e.ok ? '' : 'running'}"><summary><span class="ico">🔧</span>
      <span class="cmd">第 ${e.n} 次 ${esc(e.tool)}</span><span class="arg">${kv(e.args)}</span></summary>
      <div class="out"><pre class="ret">${esc(e.preview || '')}</pre></div></details>`).join('');
  return `<div class="proposal" data-pid="${esc(p.id)}">
    <div class="hd">💡 ${head}${p.trigger ? `<div class="trig">适用：${esc(p.trigger)}</div>` : ''}</div>
    <details><summary>查看步骤</summary><ol>${steps}</ol>${ev ? `<div class="lbl">依据的工具返回</div>${ev}` : ''}</details>
    <div class="row"><button class="ok" data-papprove="${esc(p.id)}">保存</button><button class="cancel" data-preject="${esc(p.id)}">忽略</button><span class="msg"></span></div>
    <div class="tip">${p.kind === 'extend_sop' ? '保存后补到那个 SOP 的末尾，启停状态不变。' : '保存后默认停用，去 SOP 页核对每一步后再启用。'}忽略后同样的排查路径 30 天内不再提。</div></div>`;
}
function showProposal(bot, p) {
  if (!bot || bot.querySelector('.proposal')) return;
  (bot.querySelector('.tools') || bot.querySelector('.card')).insertAdjacentHTML('afterend', proposalHtml(p));
}
/* 提议是回答结束后几秒到几十秒才冒出来的，插在来源和工具条下面，大概率在视口外。
   用户还看着这条回答的末尾（正文底边在视口里）→ 把卡片滚进来并闪一下；
   已经翻去看别处 → 不拉他回来，在输入框上方挂一条可点的提示。回放补画的卡片不走这里。 */
function flash(el) { el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); }
function revealProposal(bot) {
  const box = bot.querySelector('.proposal'); if (!box) return;
  const view = $('chat').getBoundingClientRect(), end = bot.querySelector('.card').getBoundingClientRect().bottom;
  if (end >= view.top && end <= view.bottom) { box.scrollIntoView({block: 'nearest', behavior: 'smooth'}); flash(box); }
  else showNudge(box);
}
let nudgeWatch = null;
function hideNudge() { document.querySelector('.nudge')?.remove(); nudgeWatch?.disconnect(); nudgeWatch = null; }
function showNudge(box) {
  hideNudge();
  const el = document.createElement('button');
  el.className = 'nudge'; el.textContent = '💡 有一条 SOP 提议 ↓';
  el.onclick = () => { hideNudge(); if (box.isConnected) { box.scrollIntoView({block: 'center', behavior: 'smooth'}); flash(box); } };
  document.querySelector('.composer').appendChild(el);
  // 用户自己滚到卡片处，提示就没必要留着了
  nudgeWatch = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) hideNudge(); }, {root: $('chat'), threshold: .5});
  nudgeWatch.observe(box);
}
async function pollProposal(bot) {
  for (const wait of [2000, 4000, 8000, 8000, 8000, 8000, 8000, 8000]) {
    await new Promise(r => setTimeout(r, wait));
    if (!bot.isConnected) return;   // 用户已经换了对话
    try {
      const d = await (await fetch('/api/proposals?execution_id=' + encodeURIComponent(bot.dataset.exec))).json();
      const p = (d.proposals || [])[0];
      if (p) { showProposal(bot, p); revealProposal(bot); return; }
    } catch (_) {}
  }
}
async function decideProposal(el, approve) {
  const box = el.closest('.proposal'), pid = box.dataset.pid, msg = box.querySelector('.msg');
  box.querySelectorAll('button').forEach(b => b.disabled = true);

  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    msg.textContent = typeof d.detail === 'string' ? d.detail : '失败';
    box.querySelectorAll('button').forEach(b => b.disabled = false);
    return;
  }
  if (approve) {

    box.innerHTML = `<div class="hd">✅ 已保存到 SOP《${esc(name)}》${d.playbook?.enabled ? '' : '（默认停用，去 SOP 页核对后启用）'}</div>`;
    toast(`已保存 SOP《${name}》`, 'ok');
  } else {
    box.remove();
  }
  hideNudge();
  refreshBadges();
  if (page === 'sop') renderManage();
}

async function openConv(id) {
  const r = await fetch('/api/conversations/' + encodeURIComponent(id));
  if (!r.ok) { convId = null; welcome(); return; }
  const d = await r.json();
  convId = id;
  hideNudge();
  $('thread').innerHTML = '';
  let lastQuestion = '';
  for (const m of d.messages) {
    if (m.role === 'user') { addUser(m.content); lastQuestion = m.content; continue; }
    const bot = addBot(`<div class="answer">${md(m.content)}</div>`);
    if (m.model) bot.dataset.model = m.model;
    if (m.execution_id) bot.dataset.exec = m.execution_id;
    if (m.playbook) { bot.dataset.playbook = m.playbook.name || m.playbook.id; bot.dataset.playbookId = m.playbook.id; }
    bot.querySelector('.steps').innerHTML = (m.tools || []).map(t => stepHtml(t, false)).join('');
    // 待办清单不单独落库：取这条回答里最后一次 plan 调用的参数（整张清单）
    const plans = (m.tools || []).filter(t => stepCategory(t) === 'internal' && t.args && Array.isArray(t.args.items));
    if (plans.length) showPlan(bot, plans[plans.length - 1].args.items);

/* ---------- Playbooks ---------- */
let pbTools = {}, pbEditing = null, pbPicking = false, pbDocFilter = '', pbSearch = '';

/* ---------- 大列表：分组懒加载 + 服务端分页 ----------
   工具和 SOP 会涨到几千条。面板默认只画分组（名字 + 数量，全部折叠），
   点开一组才向服务端要这一组的第一页（30 条），再点「加载更多」翻页；
   搜索也在服务端做，结果同样分页。哪些组是展开的记在浏览器里。 */
const PAGE = 30;
const LAZY = {
  tl: {url: '/api/tools', key: 'group', items: d => Object.entries(d.tools || {}).map(([n, t]) => tlCard(n, t)).join(''),
       rows: d => Object.entries(d.tools || {}).map(([n, t]) => tlRow(n, t)).join(''),
       count: d => Object.keys(d.tools || {}).length, label: '工具'},
  pb: {url: '/api/playbooks', key: 'source', items: d => (d.playbooks || []).map(pbCard).join(''),
       rows: d => (d.playbooks || []).map(pbRow).join(''),
       count: d => (d.playbooks || []).length, label: 'SOP'},
};
// 分组的展开状态只在当前页面内记住（刷新归零），不然像是缓存没清
const opened = new Set();
function searchBox(id, value, placeholder) {
  return `<div class="pb-search"><input type="search" id="${id}" data-search-box
            placeholder="${placeholder}" value="${esc(value)}" autocomplete="off">
          <span class="n" id="${id}N"></span></div>`;
}
function groupHtml(panel, g) {
  const key = panel + ':' + g.name;
  return `<details class="grp" data-panel="${panel}" data-grp="${esc(key)}" data-name="${esc(g.name)}" ${opened.has(key) ? 'open' : ''}>
    <summary><span class="chev">▶</span><span class="gl">${esc(g.name)}</span>
      <span class="gc"><b>${g.live}</b> / ${g.total}</span></summary>
    <div class="body" data-loaded="0"></div></details>`;
}
function groupsHtml(panel, groups) {
  return `<div class="groups">${groups.map(g => groupHtml(panel, g)).join('')}</div><div class="results" hidden></div>`;
}
async function fetchPage(panel, params, offset) {
  const cfg = LAZY[panel];
  const qs = new URLSearchParams({...params, offset, limit: PAGE});
  return (await fetch(`${cfg.url}?${qs}`)).json();
}
function moreHtml(panel, params, next, total, render = 'items') {
  const left = total - next;
  return left > 0 ? `<button class="more" data-more="${panel}" data-render="${render}" data-params='${esc(JSON.stringify(params))}' data-next="${next}">加载更多（还有 ${left} 条）</button>` : '';
}
async function loadGroup(el) {
  const panel = el.dataset.panel, body = el.querySelector('.body');
  if (body.dataset.loaded === '1') return;
  body.dataset.loaded = '1';
  body.innerHTML = '<div class="pb-nomatch">加载中…</div>';
  const params = {[LAZY[panel].key]: el.dataset.name};

  body.innerHTML = LAZY[panel].items(d) + moreHtml(panel, params, LAZY[panel].count(d), d.total);
}
async function loadSearch(panel, q) {
  const root = $(panel + 'Panel'), results = root.querySelector('.results'), groups = root.querySelector('.groups');
  const n = $(panel + 'SearchN');
  if (!q.trim()) { results.hidden = true; groups.hidden = false; if (n) n.textContent = ''; return; }

/* 面板重绘后把之前展开的组重新装回第一页；搜索框有字就重跑搜索 */

let searchTimer;
function onSearchInput(panel, value) {
  clearTimeout(searchTimer);

}
function searchable(...parts) {
  return esc(parts.flat().filter(Boolean).join(' ').toLowerCase());
}

function pbStepsText(steps) {
  // 一行一步：工具 | 参数JSON | 检查点 | 文档原句（可空）
  return steps.map(s => [s.tool, JSON.stringify(s.args || {}), s.checkpoint || '', s.evidence || ''].join(' | ')).join('\n');
}
function pbParseSteps(text) {
  const steps = [];
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line) continue;
    const parts = line.split('|');
    const tool = (parts[0] || '').trim();
    if (!tool) continue;
    let args = {};
    const argText = (parts[1] || '').trim();
    if (argText) {
      try { args = JSON.parse(argText); }
      catch { throw new Error(`参数不是合法 JSON：${argText}`); }
      if (typeof args !== 'object' || Array.isArray(args)) throw new Error('参数必须是 JSON 对象');
    }
    steps.push({tool, args, checkpoint: (parts[2] || '').trim(), evidence: parts.slice(3).join('|').trim()});
  }
  if (!steps.length) throw new Error('至少需要一个步骤');
  return steps;
}

function pbCard(p) {
  const bad = (p.missing_tools || []).length;
  const steps = p.steps.map((s, i) => {
    const args = Object.entries(s.args || {}).filter(([, v]) => v).map(([k, v]) => `${k}=${v}`).join(' ');
    const ev = s.evidence ? `<span class="ev ${s.evidence.startsWith('⚠') ? 'bad' : ''}" title="文档原句">“${esc(s.evidence)}”</span>` : '';
    return `<div class="pb-step"><span class="i">${i + 1}</span>
      <span class="tl" title="${esc(s.tool)}">${esc(toolLabel(s.tool))}</span>
      <span class="ck">${esc(args ? args + ' · ' : '')}${esc(s.checkpoint)}</span>${ev}</div>`;
  }).join('');
  const live = p.enabled && !bad;
  return `<div class="pb${p.enabled ? '' : ' off'}${bad ? ' bad' : ''}" data-id="${p.id}"
       data-search="${searchable(p.name, p.source, p.trigger, p.steps.map(s => [s.tool, s.checkpoint, s.evidence]))}">
    <div class="pb-top">
      <span class="nm" title="${esc(p.name)}">${esc(p.name)}</span>
      ${live ? `<button class="run" data-run="${p.id}" title="按这个 SOP 的步骤调用工具并给出结论">▶ 执行</button>` : ''}
      <button data-toggle="${p.id}">${p.enabled ? '已启用' : '已停用'}</button>
      <button data-edit="${p.id}">编辑</button>
      <button data-del="${p.id}">删除</button>
    </div>
    ${bad ? `<div class="pb-warn">⚠ 引用了当前不可用的工具：${esc(p.missing_tools.join('、'))}，该 SOP 不会生效</div>` : ''}
    <div class="pb-body">
      ${p.trigger ? `<div class="pb-trig">适用：${esc(p.trigger)}</div>` : ''}
      ${steps}
    </div></div>`;
}

function pbEditor(p) {
  const tools = Object.entries(pbTools).map(([n, d]) => `${n}：${d}`).join('\n');
  return `<div class="pb pb-edit" data-id="${p.id || ''}">
    <div class="pb-top"><span class="nm">${p.id ? '编辑 SOP' : '新建 SOP'}</span></div>
    <div class="pb-body">
      <input id="pbName" placeholder="SOP 名称" maxlength="60" value="${esc(p.name || '')}"

             value="${esc(p.trigger || '')}"

                    border:1px solid var(--border);background:var(--panel-2);color:var(--text);font:inherit">
      <div style="margin:8px 0 4px;color:var(--muted);font-size:12px">
        步骤，一行一步：<code>工具 | 参数JSON | 检查点 | 文档原句（可空）</code></div>

  const options = matched.map(d =>
    `<option value="${esc(d.source)}">${esc(d.source)}　[${esc(d.category || '未分类')}]</option>`).join('');
  return `<div class="pb-pick">
    <div class="hd">从哪个文档抽取 SOP？</div>
    <details class="pb-help">
      <summary>文档怎么写才抽得出来？</summary>
      <div>抽取器会把文档里<b>按步骤查看、核对</b>的做法，翻译成对现有工具的有序调用。写法要点：</div>
      <ol>
        <li>标题写清是「做什么」的规范/手册，开头一句话说明什么时候用</li>
        <li>第一屏就是带编号的步骤，每步标题是「看什么」的名词（宿主机磁盘、当年节假日…）</li>
        <li>每步至少一条带数字或明确状态的判断标准，如「根分区 &gt;80% 告警」，不要写「检查是否正常」</li>
        <li>写意图不写命令：「查看各挂载点使用率」而不是「执行 df -h」</li>
        <li>容器名、年份这类具体对象不要写死，使用时由提问补上</li>
        <li>修改、重启、删除类操作放单独一节，抽取只认只读步骤</li>
        <li>只读前 6000 字，最多 3 个 SOP × 6 步；一件事一篇</li>
      </ol>
      <div>参考 <code>sample_kb/日常巡检规范.md</code>；完整教程见仓库 <code>docs/SOP文档写法.md</code>。抽出的 SOP 默认停用，确认顺序、工具、检查点无误后再启用。</div>
    </details>
    <input id="pbDocFilter" placeholder="输入关键字筛选文档名或分类…" value="${esc(pbDocFilter)}">
    <select id="pbDocSelect" size="8">${options || '<option disabled>没有匹配的文档</option>'}</select>
    <div class="row">
      <span class="cnt">共 ${allDocs.length} 个文档${f ? `，匹配 ${matched.length} 个` : ''}</span>
      <button class="go" id="pbDoExtract"${matched.length ? '' : ' disabled'}>开始抽取</button>
      <button class="cancel" id="pbPickCancel">取消</button>
    </div>
    <div class="pb-err" id="pbPickErr" hidden></div>
  </div>`;
}

/* SOP 按来源文档分组：同一份手册抽出的几个 SOP 挨在一起，手工建的单独一组 */
async function pbGet(id) {
  const r = await fetch('/api/playbooks/' + id);
  return r.ok ? r.json() : null;
}

/* SOP 页里的改动（保存、启停、删除、抽取）都回到 SOP 页重画；别的页只刷新导航徽标 */
async function loadPlaybooks() {
  if (page === 'sop') return renderManage();
  refreshBadges();
}

/* ▶ 执行：把「按 SOP 执行」的问题填进对话框并发送。本质还是一次提问，Agent 照 SOP 调工具；
   发送时带上 SOP 的 id，图谱里这一轮才记得清是按哪个 SOP 跑的。有要填的参数时停在输入框里让人补上。 */
function runPlaybook(p) {
  const blanks = [...new Set(p.steps.flatMap(s => Object.entries(s.args || {}).filter(([, v]) => !v).map(([k]) => k)))];
  const prefix = `执行 SOP《${p.name}》`;
  go('chat');
  if (convId) newConv();
  $('question').value = prefix + (blanks.length ? `（${blanks.join('、')}：）` : '');
  pendingPlaybook = {id: p.id, name: p.name, prefix};
  autosize();
  if (blanks.length) {
    $('question').focus();
    $('question').setSelectionRange($('question').value.length - 1, $('question').value.length - 1);
    toast(`这个 SOP 需要您提供：${blanks.join('、')}。补在括号里再发送。`, '', 6000);
    return;
  }
  ask();
}
// 工作台、欢迎页上 SOP 类的示例带着 SOP：取它的步骤（看有没有要人补的参数），照「▶ 执行」那样跑
async function runPlaybookById(id) {
  const r = await fetch('/api/playbooks/' + encodeURIComponent(id)).catch(() => null);
  if (!r || !r.ok) { toast('这个 SOP 已经不在了，刷新页面看看', 'err'); return; }
  runPlaybook(await r.json());
}
$('pbPanel').addEventListener('click', async e => {
  const id = t => e.target.closest(`[data-${t}]`)?.dataset[t];

  if (e.target.id === 'pbNew') { pbPicking = false; pbEditing = {steps: []}; return loadPlaybooks(); }

  if (e.target.id === 'pbFromDoc') {
    if (!allDocs.length) return toast('还没有文档，请先上传', 'err');
    pbEditing = null; pbDocFilter = ''; pbPicking = true;
    return loadPlaybooks();
  }

  if (e.target.id === 'pbPickCancel') { pbPicking = false; return loadPlaybooks(); }

  if (e.target.id === 'pbDoExtract') {
    const doc = $('pbDocSelect').value;
    const err = $('pbPickErr');
    err.hidden = true;
    if (!doc) { err.textContent = '请先选择一个文档'; err.hidden = false; return; }
    const btn = e.target;
    btn.disabled = true;
    btn.textContent = '抽取中…';
    try {
      const r = await fetch('/api/playbooks/extract', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({source: doc})});
      const d = await r.json();
      if (!r.ok) throw new Error(Array.isArray(d.detail)
        ? d.detail.map(x => x.msg).join('；') : d.detail);
      pbPicking = false;
      await loadPlaybooks();
      loadDocs();
      toast(d.extracted.length
        ? `从《${doc}》抽取出 ${d.extracted.length} 个 SOP，已默认停用。请核对每步的工具、检查点和文档原句，无误后再启用。`
          + (d.note ? `\n${d.note}` : '')
        : `《${doc}》没有抽出 SOP。原因：${d.note || '未知'}`, d.extracted.length ? 'ok' : 'err', 8000);
    } catch (ex) {
      btn.disabled = false;
      btn.textContent = '开始抽取';
      err.textContent = '抽取失败：' + ex.message;
      err.hidden = false;
    }
    return;
  }

  if (e.target.id === 'pbCancel') { pbEditing = null; return loadPlaybooks(); }

  if (e.target.id === 'pbSave') {
    const err = $('pbErr');
    err.hidden = true;
    let steps;
    try { steps = pbParseSteps($('pbSteps').value); }
    catch (ex) { err.textContent = ex.message; err.hidden = false; return; }
    const body = {name: $('pbName').value.trim(), trigger: $('pbTrigger').value.trim(),
                  steps, enabled: true};
    const editId = e.target.closest('.pb-edit').dataset.id;
    const r = await fetch('/api/playbooks' + (editId ? '/' + editId : ''),
      {method: editId ? 'PUT' : 'POST', headers: {'Content-Type': 'application/json'},
       body: JSON.stringify(body)});
    if (!r.ok) {
      const d = await r.json().catch(() => ({detail: '服务器错误 ' + r.status}));
      err.textContent = Array.isArray(d.detail)
        ? d.detail.map(x => x.msg).join('；') : d.detail;
      err.hidden = false;
      return;
    }
    pbEditing = null;
    loadPlaybooks(); loadDocs();
    return;
  }

  const editId = id('edit');
  if (editId) {
    pbPicking = false;
    pbEditing = (await pbGet(editId)) || {steps: []};
    return loadPlaybooks();
  }

  const delId = id('del');
  if (delId) {
    if (!confirm('确定删除这个 SOP？')) return;
    await fetch('/api/playbooks/' + delId, {method: 'DELETE'});
    if (mItem === delId) mItem = null;
    return loadPlaybooks().then(loadDocs);
  }

  const runId = id('run');
  if (runId) {
    const p = await pbGet(runId);
    if (p) runPlaybook(p);
    return;
  }
  const toggleId = id('toggle');
  if (toggleId) {
    const p = await pbGet(toggleId);
    if (!p) return;
    await fetch('/api/playbooks/' + toggleId, {
      method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: p.name, trigger: p.trigger, steps: p.steps,
                            enabled: !p.enabled})});
    return loadPlaybooks().then(loadDocs);
  }
});

/* ---- 工具面板 -------------------------------------------------------
   页面能做的事是有意划清的：
     启停、改描述 -> 直接生效，因为它们都不改变实际执行的命令；
     新增工具     -> 只能提交申请，必须有人在宿主机上批准。
   命令模板只在宿主机那份手写配置里定义，这个界面碰不到。            */
let tlEditing = null, tlProposing = false, tlProposeKind = 'command', tlSearch = '';
let tlScripts = [], tlScriptSel = '', tlScriptDir = '';
// 申请表单用：工具服务跑在什么系统上（默认勾它）、管理员建好的连接（只有名字和地址模板，没有凭据）
let tlHost = {}, tlConns = {};
// 主机清单（配了 hosts 才有）：命令型工具逐台显示能不能跑；申请命令工具时可以填适用分组
let tlHosts = {configured: false};

/* MCP 工具的只读依据：server 自己声明的，还是管理员批准时确认的。两者都没有的不能执行。 */
const TL_RO = {declared: ['ok', '只读 · server 声明'], attested: ['ok', '只读 · 管理员确认'], none: ['warn', '未确认只读']};
const TL_OS = {linux: 'Linux', darwin: 'macOS', windows: 'Windows'};
const TL_CONN_TYPE = {http: 'HTTP', postgres: 'PostgreSQL', mysql: 'MySQL', sqlite: 'SQLite'};
const TL_DB = ['postgres', 'mysql', 'sqlite'];
/* 连接：只显示名字、类型、地址（字面量或 ${名字}），永远没有凭据的值 */
function connectionsHtml(conns) {
  const list = Object.entries(conns || {});
  if (!list.length) return '';
  return `<div class="tl-servers">连接：${list.map(([name, c]) =>
    `<b title="${esc(c.label || '')}">${esc(name)}</b> ${esc(TL_CONN_TYPE[c.type] || c.type || 'HTTP')} · <code>${esc(c.base || '')}</code>`
    + (c.external ? ` <span class="tl-ext" title="${esc(c.external_why || '')}：用它的工具，参数会发到组织外面">外部</span>` : '')
    + (c.driver ? ` <span class="off" title="${esc(c.driver)}">缺驱动</span>` : '')).join('；')}</div>`;
}
/* 一个命令型工具在各主机上：ok 能跑，unknown 还不确定（没检查过、暂时连不上），no 不能跑。不适用的主机不列 */
const TL_HOST_STATE = {ok: ['ok', '✓'], unknown: ['warn', '?'], no: ['bad', '✗']};
function tlHostLine(t) {
  const rows = Object.entries(t.hosts || {}).filter(([, h]) => !(h.state === 'no' && /^不适用|没有开放这个工具/.test(h.reason || '')));
  if (!rows.length) return '';
  return `<div class="tl-params tl-hostline"><span>主机：${rows.map(([name, h]) => {
    const [cls, mark] = TL_HOST_STATE[h.state] || TL_HOST_STATE.unknown;
    const how = (tlHosts.list || {})[name] || {};
    const direct = how.mode === 'direct' ? '（直连 · 只读靠账号权限）' : '';
    return `<span class="tl-hs ${cls}" title="${esc((h.reason || '能跑') + direct)}">${esc(name)}${direct ? '（直连）' : ''} ${mark}</span>`;
  }).join(' ')}</span></div>`;
}
/* 主机清单：管理页分组栏、工具抽屉顶部各列一次。直连模式标明「只读靠账号权限」 */
function hostsHtml(hosts) {
  const list = Object.entries((hosts || {}).list || {});
  if (!list.length) return '';
  return `<div class="tl-servers">主机（不填 target 时用 <b>${esc(hosts.default || '—')}</b>）：${list.map(([name, h]) => {
    if (h.via === 'local') return `<b>${esc(name)}</b> 本机`;
    const st = h.status;
    const state = !st ? '<span class="off">还没检查</span>'
      : st.reachable && !st.error ? '在线' : `<span class="off">${esc(st.error || '连不上')}</span>`;
    const mode = h.mode === 'direct' ? '直连 · <span class="off">只读靠账号权限</span>' : '受控';
    return `<b title="${esc(h.user + '@' + h.address + ':' + h.port)}">${esc(name)}</b> ${mode} · ${state}`;
  }).join('；')}</div>`;
}
/* 不能用的原因：系统不符是「不适用于这台机器」，不是「缺命令」。老工具服务不回 reason，按原来的说法兜底。 */
function tlWhyNot(t) {
  if (t.applicable === false) return t.reason || '不适用于这台机器';
  if (t.type === 'mcp') return t.reason || 'MCP 工具暂不可用';
  if (t.type === 'sql') return t.reason || '数据库驱动不可用';
  return t.reason || `本机没有 ${t.binary}，该工具不可用`;
}
function tlParamHint(p) {
  if (p.type === 'json') return '（结构化）';
  if (p.type === 'enum' && (p.enum || []).length) return '（' + p.enum.map(esc).join(' / ') + '）';
  if (p.type === 'bool') return '（是/否）';
  return '';
}

      ${t.external ? `<span class="src tl-ext" title="${esc(t.external_why || '')}：调用时参数会发到组织外面，按出网规则检查；返回标成外部资料">外部</span>` : ''}

/* 申请表单里的参数：命令 / 地址里每出现一个 {xxx}，就对应一行类型设置。
   类型只能从宿主机预置的几种校验里选——页面不能自带正则，一个 ".*" 就能把白名单废掉。 */
const TL_PARAM_TYPES = [
  ['name', '名称（容器名、文件名：字母数字 . _ -）'],
  ['k8s_name', 'K8s 名（小写字母数字 . -，如命名空间、Pod 名）'],
  ['resource', '资源类型（如 pod、svc、ingress）'],
  ['date', '日期（YYYY-MM-DD）'],
  ['int', '整数'],
];
let tlParamState = {};
/* 由模型填的参数：命令、地址里是 {参数名}；SQL 里是 :参数名（引号里的不算，:: 是类型转换） */
function tlPlaceholders(text, sql) {
  if (!sql) return [...new Set([...(text || '').matchAll(/\{([a-z][a-z0-9_]*)\}/g)].map(m => m[1]))];
  const bare = (text || '').replace(/'[^']*'|"[^"]*"|`[^`]*`/g, ' ');
  return [...new Set([...bare.matchAll(/(^|[^:]):([a-z_][a-z0-9_]*)/g)].map(m => m[2]))];
}

    const st = tlParamState[n] || (tlParamState[n] = {type: 'name', required: true, def: '', desc: ''});
    return `<div class="tl-param" data-tlparam="${esc(n)}">
      <code>${sql ? ':' + esc(n) : '{' + esc(n) + '}'}</code>
      <select data-pf="type">${TL_PARAM_TYPES.map(([v, t]) => `<option value="${v}" ${st.type === v ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
      <label><input type="checkbox" data-pf="required" ${st.required ? 'checked' : ''}> 必填</label>

function tlParamsPayload(text, sql) {
  const out = {};
  for (const n of tlPlaceholders(text, sql)) {
    const st = tlParamState[n] || {type: 'name', required: true, def: '', desc: ''};
    const spec = {desc: st.desc, required: !!st.required};
    if (st.type === 'int') { spec.type = 'int'; if (st.def.trim()) spec.default = Number(st.def); }
    else { spec.type = 'str'; spec.pattern = st.type; if (!st.required) spec.default = st.def; }

}
const TL_URL_HINT = {full: '接口地址，如 https://api.example.com/v1/status?city={city}（只允许 GET）',
                     path: '路径，如 /api/v1/query?query={q}（拼在连接的地址后面，只允许 GET）'};
/* 地址里的查询串拆成 query 映射：工具服务要求查询参数单独写，值要么是固定值，要么整个是 {参数名} */
function tlSplitUrl(raw) {
  const at = raw.indexOf('?');
  if (at < 0) return {url: raw, query: {}};
  const query = {};
  for (const part of raw.slice(at + 1).split('&').filter(Boolean)) {
    const eq = part.indexOf('=');
    const key = eq < 0 ? part : part.slice(0, eq), value = eq < 0 ? '' : part.slice(eq + 1);
    try { query[decodeURIComponent(key)] = decodeURIComponent(value); } catch { query[key] = value; }
  }
  return {url: raw.slice(0, at), query};
}
/* 待审条目两种写法都有：新写法 impl: {type, …}，老写法 binary/argv、script、http。统一成一句给人读的话 */
function tlPendingWhat(t) {
  const im = t.impl || {}, http = im.type === 'http' ? im : (t.http || {});
  const kind = im.type || (t.script ? 'script' : t.http ? 'http' : 'command');
  const os = [].concat(im.os || t.os || []).map(o => TL_OS[o] || o).join(' / ');
  const groups = [].concat(im.groups || t.groups || []).join(' / ');
  const what = kind === 'script' ? '脚本 ' + (im.script || t.script)
             : kind === 'http' ? 'GET ' + (http.conn ? `[连接 ${http.conn}] ` : '') + (http.url || '')
               + (Object.keys(http.query || {}).length ? '?' + Object.entries(http.query).map(([k, v]) => `${k}=${v}`).join('&') : '')
             : kind === 'sql' ? `SQL [连接 ${im.conn || ''}] ${im.query || ''}`
             : (im.argv || t.argv || []).join(' ');

async function tlSend(path, body) {
  const r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'},
                              body: JSON.stringify(body)});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || r.status);
  return d;
}

$('tlPanel').addEventListener('click', async e => {
  const pick = key => e.target.closest(`[data-${key}]`)?.dataset[key];

  if (e.target.id === 'tlNew') {
    tlEditing = null; tlProposing = true; tlProposeKind = 'command'; tlParamState = {}; return loadTools();
  }
  if (e.target.id === 'tlCancelPropose') { tlProposing = false; return loadTools(); }

  const kind = pick('tlkind');
  if (kind && kind !== tlProposeKind) { tlProposeKind = kind; return loadTools(); }

  const edit = pick('tledit');
  if (edit) { tlEditing = tlEditing === edit ? null : edit; return loadTools(); }

  // 💬 用它提问：把「用 xx 查一下（参数：）」填进对话框，用户补上参数后发送
  const use = pick('tluse');
  if (use) {
    const hit = mCache['tl:' + use];
    const t = hit ? hit.t : null;
    const label = t?.label || use;
    const req = Object.entries(t?.params || {}).filter(([, p]) => p.required).map(([k, p]) => `${p.desc || k}：`);
    const text = `用「${label}」查一下` + (req.length ? `（${req.join('；')}）` : '');
    go('chat');
    $('question').value = text; autosize(); $('question').focus();
    const v = $('question').value; $('question').setSelectionRange(req.length ? v.length - 1 : v.length, req.length ? v.length - 1 : v.length);
    if (req.length) toast(`这个工具需要：${req.join(' ')}。补在括号里再发送。`, '', 5000);
    return;
  }

  const toggle = pick('tltoggle');
  if (toggle) {
    const was = e.target.textContent.trim() === '停用';
    try { await tlSend('/api/tools/override', {name: toggle, enabled: !was}); }
    catch (err) { toast('操作失败：' + err.message, 'err'); }
    return loadTools();
  }

  const save = pick('tlsave');
  if (save) {
    const desc = $('tlDesc').value.trim();
    if (!desc) return toast('说明不能为空', 'err');
    try {
      await tlSend('/api/tools/override',
                   {name: save, desc, label: $('tlLabel').value.trim()});
      tlEditing = null;
    } catch (err) { toast('保存失败：' + err.message, 'err'); }
    return loadTools();
  }

  const reset = pick('tlreset');
  if (reset) {
    try { await tlSend('/api/tools/override', {name: reset, reset: true}); tlEditing = null; }
    catch (err) { toast('恢复失败：' + err.message, 'err'); }
    return loadTools();
  }

  if (e.target.id === 'tlDoPropose' || e.target.id === 'tlDoProposeApprove') {
    const err = $('tlProposeErr');

    err.hidden = true;
    let payload;
    try { payload = tlProposalPayload(); } catch (ex) { return fail(ex.message); }
    if (e.target.id === 'tlDoPropose') {
      try {
        const d = await tlSend('/api/tools/propose', payload);
        tlProposing = false;
        toast(`申请已提交（编号 ${d.pending.id}）。批准之后才能用：在「待审批」里看完整内容再批。`, 'ok', 7000);
        openPending(d.pending.id);
      } catch (e2) { fail('提交失败：' + e2.message); }
      return;
    }
    // 提交并立即批准：同一个人申请、同一个人审批，不用跑两趟。工具服务先核对口令，对了才提交并批准；
    // 口令不对什么都不提交。批准没写成时申请留在待审（错误里带着它的编号），关掉对话框就跳过去
    const script = tlProposeKind === 'script' ? tlScripts.find(s => s.name === payload.script) : null;
    let queued = null;
    askPassphrase({
      title: `提交并批准「${payload.label || payload.name}」`,
      summary: proposalSummary(payload, script),
      confirm: '提交并批准',
      run: passphrase => postJson('/api/tools/propose-approve', {tool: payload, passphrase, script_sha256: script?.sha256 || ''})
        .catch(err => { if (err.pending) queued = err.pending; throw err; }),
      done: result => { tlProposing = false; apResults[result.id] = result; openPending(result.id); refreshBadges(); },
      cancel: () => {
        if (!queued) return;
        tlProposing = false;
        toast(`申请已提交（编号 ${queued}），还没有批准：在「待审批」里看原因再批`, '', 7000);
        openPending(queued); refreshBadges();
      },
