/* ---------- Playbooks ---------- */
let pbTools = {}, pbEditing = null, pbPicking = false, pbDocFilter = '', pbSearch = '';

/* ---------- 大列表：分组懒加载 + 服务端分页 ----------
   工具和 SOP 会涨到几千条。面板默认只画分组（名字 + 数量，全部折叠），
   点开一组才向服务端要这一组的第一页（30 条），再点「加载更多」翻页；
   搜索也在服务端做，结果同样分页。哪些组是展开的记在浏览器里。 */
const PAGE = 30;
const LAZY = {
  tl: {url: '/api/tools', key: 'group', items: d => Object.entries(d.tools || {}).map(([n, t]) => tlCard(n, t)).join(''),
       rows: d => Object.entries(d.tools || {}).map(([n, t]) => tlRow(n, t)).join(''),
       count: d => Object.keys(d.tools || {}).length, label: '工具'},
  pb: {url: '/api/playbooks', key: 'source', items: d => (d.playbooks || []).map(pbCard).join(''),
       rows: d => (d.playbooks || []).map(pbRow).join(''),
       count: d => (d.playbooks || []).length, label: 'SOP'},
};
// 分组的展开状态只在当前页面内记住（刷新归零），不然像是缓存没清
const opened = new Set();
function searchBox(id, value, placeholder) {
  return `<div class="pb-search"><input type="search" id="${id}" data-search-box
            placeholder="${placeholder}" value="${esc(value)}" autocomplete="off">
          <span class="n" id="${id}N"></span></div>`;
}
function groupHtml(panel, g) {
  const key = panel + ':' + g.name;
  return `<details class="grp" data-panel="${panel}" data-grp="${esc(key)}" data-name="${esc(g.name)}" ${opened.has(key) ? 'open' : ''}>
    <summary><span class="chev">▶</span><span class="gl">${esc(g.name)}</span>
      <span class="gc"><b>${g.live}</b> / ${g.total}</span></summary>
    <div class="body" data-loaded="0"></div></details>`;
}
function groupsHtml(panel, groups) {
  return `<div class="groups">${groups.map(g => groupHtml(panel, g)).join('')}</div><div class="results" hidden></div>`;
}
async function fetchPage(panel, params, offset) {
  const cfg = LAZY[panel];
  const qs = new URLSearchParams({...params, offset, limit: PAGE});
  return (await fetch(`${cfg.url}?${qs}`)).json();
}
function moreHtml(panel, params, next, total, render = 'items') {
  const left = total - next;
  return left > 0 ? `<button class="more" data-more="${panel}" data-render="${render}" data-params='${esc(JSON.stringify(params))}' data-next="${next}">加载更多（还有 ${left} 条）</button>` : '';
}
async function loadGroup(el) {
  const panel = el.dataset.panel, body = el.querySelector('.body');
  if (body.dataset.loaded === '1') return;
  body.dataset.loaded = '1';
  body.innerHTML = '<div class="pb-nomatch">加载中…</div>';
  const params = {[LAZY[panel].key]: el.dataset.name};
  const d = await fetchPage(panel, params, 0);
  body.innerHTML = LAZY[panel].items(d) + moreHtml(panel, params, LAZY[panel].count(d), d.total);
}
async function loadSearch(panel, q) {
  const root = $(panel + 'Panel'), results = root.querySelector('.results'), groups = root.querySelector('.groups');
  const n = $(panel + 'SearchN');
  if (!q.trim()) { results.hidden = true; groups.hidden = false; if (n) n.textContent = ''; return; }
  groups.hidden = true; results.hidden = false;
  results.innerHTML = '<div class="pb-nomatch">搜索中…</div>';
  const d = await fetchPage(panel, {q}, 0);
  if (root.querySelector('[data-search-box]')?.value !== q) return;  // 输入已经变了，丢掉这次结果
  if (n) n.textContent = `匹配 ${d.total} 条`;
  results.innerHTML = (d.total ? LAZY[panel].items(d) : `<div class="pb-nomatch">没有包含「${esc(q.trim())}」的${LAZY[panel].label}</div>`)
                    + moreHtml(panel, {q}, LAZY[panel].count(d), d.total);
}
document.addEventListener('toggle', e => {
  const g = e.target.closest?.('.grp'); if (!g) return;
  if (g.open) { opened.add(g.dataset.grp); if (LAZY[g.dataset.panel]) loadGroup(g); } else opened.delete(g.dataset.grp);
}, true);
document.addEventListener('click', async e => {
  const btn = e.target.closest('[data-more]'); if (!btn) return;
  const panel = btn.dataset.more, params = JSON.parse(btn.dataset.params), next = +btn.dataset.next;
  const render = btn.dataset.render || 'items';
  btn.disabled = true; btn.textContent = '加载中…';
  const d = await fetchPage(panel, params, next);
  btn.insertAdjacentHTML('beforebegin', LAZY[panel][render](d));
  btn.outerHTML = moreHtml(panel, params, next + LAZY[panel].count(d), d.total, render);
});
/* 面板重绘后把之前展开的组重新装回第一页；搜索框有字就重跑搜索 */
function restorePanel(panel, q) {
  const root = $(panel + 'Panel');
  root.querySelectorAll('.grp[open]').forEach(loadGroup);
  if (q && q.trim()) loadSearch(panel, q);
}
let searchTimer;
function onSearchInput(panel, value) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadSearch(panel, value), 250);
}
function searchable(...parts) {
  return esc(parts.flat().filter(Boolean).join(' ').toLowerCase());
}

function pbStepsText(steps) {
  // 一行一步：工具 | 参数JSON | 检查点 | 文档原句（可空）
  return steps.map(s => [s.tool, JSON.stringify(s.args || {}), s.checkpoint || '', s.evidence || ''].join(' | ')).join('\n');
}
function pbParseSteps(text) {
  const steps = [];
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line) continue;
    const parts = line.split('|');
    const tool = (parts[0] || '').trim();
    if (!tool) continue;
    let args = {};
    const argText = (parts[1] || '').trim();
    if (argText) {
      try { args = JSON.parse(argText); }
      catch { throw new Error(`参数不是合法 JSON：${argText}`); }
      if (typeof args !== 'object' || Array.isArray(args)) throw new Error('参数必须是 JSON 对象');
    }
    steps.push({tool, args, checkpoint: (parts[2] || '').trim(), evidence: parts.slice(3).join('|').trim()});
  }
  if (!steps.length) throw new Error('至少需要一个步骤');
  return steps;
}

function pbCard(p) {
  const bad = (p.missing_tools || []).length;
  const steps = p.steps.map((s, i) => {
    const args = Object.entries(s.args || {}).filter(([, v]) => v).map(([k, v]) => `${k}=${v}`).join(' ');
    const ev = s.evidence ? `<span class="ev ${s.evidence.startsWith('⚠') ? 'bad' : ''}" title="文档原句">“${esc(s.evidence)}”</span>` : '';
    return `<div class="pb-step"><span class="i">${i + 1}</span>
      <span class="tl" title="${esc(s.tool)}">${esc(toolLabel(s.tool))}</span>
      <span class="ck">${esc(args ? args + ' · ' : '')}${esc(s.checkpoint)}</span>${ev}</div>`;
  }).join('');
  const live = p.enabled && !bad;
  return `<div class="pb${p.enabled ? '' : ' off'}${bad ? ' bad' : ''}" data-id="${p.id}"
       data-search="${searchable(p.name, p.source, p.trigger, p.steps.map(s => [s.tool, s.checkpoint, s.evidence]))}">
    <div class="pb-top tl-top">
      <span class="nm" title="${esc(p.name)}">${esc(p.name)}</span>
      <span class="tl-acts">${live ? `<button class="run" data-run="${p.id}" title="按这个 SOP 的步骤调用工具并给出结论">▶ 执行</button>
        <button class="now" data-runnow="${p.id}" title="在后台按这个 SOP 跑一次，不进对话；结果在「执行记录」里">⏱ 立即执行一次</button>` : ''}
      <button data-toggle="${p.id}">${p.enabled ? '已启用' : '已停用'}</button>
      <button data-edit="${p.id}">编辑</button>
      <button data-del="${p.id}">删除</button></span>
    </div>
    ${bad ? `<div class="pb-warn">⚠ 引用了当前不可用的工具：${esc(p.missing_tools.join('、'))}，该 SOP 不会生效</div>` : ''}
    ${p.id ? pbRunsHtml(p) : ''}
    <div class="pb-body">
      ${p.trigger ? `<div class="pb-trig">适用：${esc(p.trigger)}</div>` : ''}
      ${steps}
    </div></div>`;
}

function pbEditor(p) {

      <ol>

/* SOP 页里的改动（保存、启停、删除、抽取）都回到 SOP 页重画；别的页只刷新导航徽标 */

}

/* ▶ 执行：把「按 SOP 执行」的问题填进对话框并发送。本质还是一次提问，Agent 照 SOP 调工具；
   发送时带上 SOP 的 id，图谱里这一轮才记得清是按哪个 SOP 跑的。有要填的参数时停在输入框里让人补上。 */
function runPlaybook(p) {
  const blanks = [...new Set(p.steps.flatMap(s => Object.entries(s.args || {}).filter(([, v]) => !v).map(([k]) => k)))];
  const prefix = `执行 SOP《${p.name}》`;
  go('chat');
  if (convId) newConv();
  $('question').value = prefix + (blanks.length ? `（${blanks.join('、')}：）` : '');
  pendingPlaybook = {id: p.id, name: p.name, prefix};
  autosize();
  if (blanks.length) {
    $('question').focus();
    $('question').setSelectionRange($('question').value.length - 1, $('question').value.length - 1);
    toast(`这个 SOP 需要您提供：${blanks.join('、')}。补在括号里再发送。`, '', 6000);
    return;
  }
  ask();
}
// 工作台、欢迎页上 SOP 类的示例带着 SOP：取它的步骤（看有没有要人补的参数），照「▶ 执行」那样跑
async function runPlaybookById(id) {
  const r = await fetch('/api/playbooks/' + encodeURIComponent(id)).catch(() => null);
  if (!r || !r.ok) { toast('这个 SOP 已经不在了，刷新页面看看', 'err'); return; }
  runPlaybook(await r.json());
}
$('pbPanel').addEventListener('click', async e => {
  const id = t => e.target.closest(`[data-${t}]`)?.dataset[t];

  if (e.target.id === 'pbNew') { pbPicking = false; pbEditing = {steps: []}; return loadPlaybooks(); }

  if (e.target.id === 'pbFromDoc') {
    if (!allDocs.length) return toast('还没有文档，请先上传', 'err');
    pbEditing = null; pbDocFilter = ''; pbPicking = true;
    return loadPlaybooks();
  }

  if (e.target.id === 'pbPickCancel') { pbPicking = false; return loadPlaybooks(); }

  if (e.target.id === 'pbDoExtract') {
    const doc = $('pbDocSelect').value;
    const err = $('pbPickErr');
    err.hidden = true;
    if (!doc) { err.textContent = '请先选择一个文档'; err.hidden = false; return; }
    const btn = e.target;
    btn.disabled = true;
    btn.textContent = '抽取中…';
    try {
      const r = await fetch('/api/playbooks/extract', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({source: doc})});
      const d = await r.json();
      if (!r.ok) throw new Error(Array.isArray(d.detail)
        ? d.detail.map(x => x.msg).join('；') : d.detail);
      pbPicking = false;
      await loadPlaybooks();
      loadDocs();
      toast(d.extracted.length
        ? `从《${doc}》抽取出 ${d.extracted.length} 个 SOP，已默认停用。请核对每步的工具、检查点和文档原句，无误后再启用。`
          + (d.note ? `\n${d.note}` : '')
        : `《${doc}》没有抽出 SOP。原因：${d.note || '未知'}`, d.extracted.length ? 'ok' : 'err', 8000);
    } catch (ex) {
      btn.disabled = false;
      btn.textContent = '开始抽取';
      err.textContent = '抽取失败：' + ex.message;
      err.hidden = false;
    }
    return;
  }

  if (e.target.id === 'pbCancel') { pbEditing = null; return loadPlaybooks(); }

  if (e.target.id === 'pbSave') {
    const err = $('pbErr');
    err.hidden = true;
    let steps;
    try { steps = pbParseSteps($('pbSteps').value); }
    catch (ex) { err.textContent = ex.message; err.hidden = false; return; }
    const body = {name: $('pbName').value.trim(), trigger: $('pbTrigger').value.trim(),
                  steps, enabled: true};
    const editId = e.target.closest('.pb-edit').dataset.id;
    const r = await fetch('/api/playbooks' + (editId ? '/' + editId : ''),
      {method: editId ? 'PUT' : 'POST', headers: {'Content-Type': 'application/json'},
       body: JSON.stringify(body)});
    if (!r.ok) {
      const d = await r.json().catch(() => ({detail: '服务器错误 ' + r.status}));
      err.textContent = Array.isArray(d.detail)
        ? d.detail.map(x => x.msg).join('；') : d.detail;
      err.hidden = false;
      return;
    }
    pbEditing = null;
    loadPlaybooks(); loadDocs();
    return;
  }

  const editId = id('edit');
  if (editId) {
    pbPicking = false;
    pbEditing = (await pbGet(editId)) || {steps: []};
    return loadPlaybooks();
  }

  const delId = id('del');
  if (delId) {
    if (!confirm('确定删除这个 SOP？')) return;
    await fetch('/api/playbooks/' + delId, {method: 'DELETE'});
    if (mItem === delId) mItem = null;
    return loadPlaybooks().then(loadDocs);
  }

  const runId = id('run');
  if (runId) {
    const p = await pbGet(runId);
    if (p) runPlaybook(p);
    return;
  }
  const nowId = id('runnow');
  if (nowId) return runNowFlow(nowId);
  const runsId = id('goruns');
  if (runsId) { runFilter = {sop: runsId, trigger: ''}; return go('sop', {tab: 'runs', item: null}); }
  const autoId = id('goauto');
  if (autoId) { autoSop = autoId; autoForm = null; return go('sop', {tab: 'auto', item: null}); }
  const toggleId = id('toggle');
  if (toggleId) {
    const p = await pbGet(toggleId);
    if (!p) return;
    await fetch('/api/playbooks/' + toggleId, {
      method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: p.name, trigger: p.trigger, steps: p.steps,
                            enabled: !p.enabled})});
    return loadPlaybooks().then(loadDocs);
  }
});

const TL_RO = {declared: ['ok', '只读 · server 声明'], attested: ['ok', '只读 · 管理员确认'], none: ['warn', '未确认只读']};

/* 连接：只显示名字、类型、地址（字面量或 ${名字}），永远没有凭据的值 */
function connectionsHtml(conns) {
  const list = Object.entries(conns || {});

/* 申请表单里的参数：命令 / 地址里每出现一个 {xxx}，就对应一行类型设置。
   类型只能从宿主机预置的几种校验里选——页面不能自带正则，一个 ".*" 就能把白名单废掉。 */
const TL_PARAM_TYPES = [
  ['name', '名称（容器名、文件名：字母数字 . _ -）'],
  ['k8s_name', 'K8s 名（小写字母数字 . -，如命名空间、Pod 名）'],
  ['resource', '资源类型（如 pod、svc、ingress）'],
  ['date', '日期（YYYY-MM-DD）'],
  ['int', '整数'],

function tlPlaceholders(text, sql) {
  if (!sql) return [...new Set([...(text || '').matchAll(/\{([a-z][a-z0-9_]*)\}/g)].map(m => m[1]))];
  const bare = (text || '').replace(/'[^']*'|"[^"]*"|`[^`]*`/g, ' ');
  return [...new Set([...bare.matchAll(/(^|[^:]):([a-z_][a-z0-9_]*)/g)].map(m => m[2]))];

  const names = tlPlaceholders(text, sql);

  return `<div class="tl-pform"><div class="tl-note" style="padding:0 0 4px">参数（模型填值，宿主机按类型校验）</div>` + names.map(n => {
    const st = tlParamState[n] || (tlParamState[n] = {type: 'name', required: true, def: '', desc: ''});
    return `<div class="tl-param" data-tlparam="${esc(n)}">
      <code>${sql ? ':' + esc(n) : '{' + esc(n) + '}'}</code>
      <select data-pf="type">${TL_PARAM_TYPES.map(([v, t]) => `<option value="${v}" ${st.type === v ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
      <label><input type="checkbox" data-pf="required" ${st.required ? 'checked' : ''}> 必填</label>
      <input data-pf="def" placeholder="默认值（非必填时要给）" value="${esc(st.def)}" maxlength="60" ${st.required ? 'disabled' : ''}>
      <input data-pf="desc" placeholder="给模型看的说明，如：命名空间" value="${esc(st.desc)}" maxlength="120">
    </div>`;
  }).join('') + `</div>`;
}
function tlParamsPayload(text, sql) {
  const out = {};
  for (const n of tlPlaceholders(text, sql)) {
    const st = tlParamState[n] || {type: 'name', required: true, def: '', desc: ''};
    const spec = {desc: st.desc, required: !!st.required};
    if (st.type === 'int') { spec.type = 'int'; if (st.def.trim()) spec.default = Number(st.def); }
    else { spec.type = 'str'; spec.pattern = st.type; if (!st.required) spec.default = st.def; }

const TL_URL_HINT = {full: '接口地址，如 https://api.example.com/v1/status?city={city}（只允许 GET）',

function tlSplitUrl(raw) {
  const at = raw.indexOf('?');
  if (at < 0) return {url: raw, query: {}};
  const query = {};

    const eq = part.indexOf('=');

  const what = kind === 'script' ? '脚本 ' + (im.script || t.script)

               + (Object.keys(http.query || {}).length ? '?' + Object.entries(http.query).map(([k, v]) => `${k}=${v}`).join('&') : '')

/* 「检查一下」：对表单里的草稿做风险提示和自动检查（工具服务只试探、不执行），打开了模型预审时再排一份预审。
   不入队、什么都不写；限频。结果显示在表单下面，模型预审生成中就每 3 秒取一次。 */
let tlChecked = null, tlDraftTimer = null, tlCheckFailed = null;
async function tlDraftCheck(payload, btn) {
  const out = $('tlCheckOut');
  if (!out) return null;
  out.hidden = false;
  out.innerHTML = '<div class="pc-verdict checking">⏳ 检查中…<small>工具服务在试探，不执行申请的内容</small></div>';
  if (btn) btn.disabled = true;
  tlCheckFailed = null;
  try {
    const d = await postJson('/api/tools/check', payload);
    tlChecked = {sig: JSON.stringify(payload), result: d};
    out.innerHTML = tlCheckHtml(d);
    tlPollDraft(d.prereview);
    return d;
  } catch (err) {
    tlChecked = null; tlCheckFailed = err;
    out.innerHTML = `<div class="pb-err">检查没做成：${esc(err.message)}</div>`;
    return null;
  } finally { if (btn) btn.disabled = false; }
}
function tlCheckHtml(c) {
  const d = c.detail || {};
  const risks = (d.risks || []).length ? `<div class="risks">${d.risks.map(riskHtml).join('')}</div>`
    : '<div class="note" style="margin:0">没有检测到风险。自动检测只是辅助。</div>';
  return `<div><h5>风险提示（规则检测）</h5>${risks}</div>
    <div><h5>自动检查（只试探，不执行）</h5>${precheckHtml(d.precheck, d.invalid, true)}</div>
    ${c.prereview ? `<div id="tlCheckMr" data-key="${esc(c.prereview.key || '')}"><h5>${PRE_DISCLAIMER}</h5>${prereviewHtml(c.prereview)}</div>` : ''}
    <div class="tl-note" style="padding:0">只是检查，没有提交。改了表单要再点一次「检查一下」。</div>`;
}
// 「提交并立即批准」的口令框上方：这份草稿的自动检查（和模型预审），看过再输口令
function dlgCheckHtml(c) {
  if (!c) return '<div style="margin-top:8px">自动检查没做成（原因在表单下面），仍然可以提交并批准。</div>';
  const d = c.detail || {};
  return `<div style="margin-top:10px"><b>输口令之前，先看看自动检查</b>（只试探，不执行）${precheckHtml(d.precheck, d.invalid, true)}
    ${c.prereview ? `<div id="dlgMr" data-key="${esc(c.prereview.key || '')}" style="margin-top:8px"><b>${PRE_DISCLAIMER}</b>${prereviewHtml(c.prereview)}</div>` : ''}</div>`;
}
function tlPollDraft(r) {
  clearTimeout(tlDraftTimer);
  if (!r || !r.key || !PRE_BUSY.includes(r.status)) return;
  tlDraftTimer = setTimeout(async () => {
    const next = await fetch(`/api/tools/prereview/${encodeURIComponent(r.key)}`).then(x => x.ok ? x.json() : null).catch(() => null);
    if (!next) return;
    if (tlChecked?.result.prereview?.key === next.key) tlChecked.result.prereview = next;
    const box = $('tlCheckMr');
    if (box && box.dataset.key === next.key) box.innerHTML = `<h5>${PRE_DISCLAIMER}</h5>${prereviewHtml(next)}`;
    const dlg = $('dlgMr');
    if (dlg && dlg.dataset.key === next.key) dlg.innerHTML = `<b>${PRE_DISCLAIMER}</b>${prereviewHtml(next)}`;
    tlPollDraft(next);
  }, 3000);
}

function tlApplyPrefill() {

    $('tlPanel').querySelectorAll('[data-tlos]').forEach(box => { box.checked = (d.os || []).includes(box.dataset.tlos); });
    set('tlNewGroups', (d.groups || []).join(', '));
    text = $('tlNewCmd')?.value || '';
  } else if (tlProposeKind === 'http') {
    const http = d.http || {}, query = Object.entries(http.query || {}).map(([k, v]) => `${k}=${v}`).join('&');
    set('tlNewConn', http.conn || '');
    set('tlNewUrl', (http.url || '') + (query ? '?' + query : ''));
    text = $('tlNewUrl')?.value || '';
  } else if (tlProposeKind === 'sql') {
    const im = d.impl || {};
    set('tlNewConn', im.conn); set('tlNewSql', im.query); set('tlNewRows', im.max_rows);
    text = im.query || ''; sql = true;

/* 申请表单 → 发给 /api/tools/propose 的内容。按实现类型分栏填写，发出去的是老写法（新老工具服务都认）；
   SQL 只有新写法 impl = {type: sql, conn, query, max_rows}。填得不对就抛错，错误文字直接给人看。 */
function tlProposalPayload() {
  const base = {name: $('tlNewName').value.trim(), label: $('tlNewLabel').value.trim(),
                desc: $('tlNewDesc').value.trim(), params: {}};
  if (tlProposeKind === 'script') {
    const script = $('tlNewScript') ? $('tlNewScript').value : '';
    if (!script) throw new Error('请先选择一个脚本');
    return {...base, script};
  }
  if (tlProposeKind === 'http') {
    const conn = $('tlNewConn') ? $('tlNewConn').value : '';
    const raw = $('tlNewUrl').value.trim();
    if (conn && !raw.startsWith('/')) throw new Error('选了连接时，地址只填路径，以 / 开头（主机名和凭据都在连接里）');
    if (!conn && !/^https?:\/\//.test(raw)) throw new Error('接口地址要以 http:// 或 https:// 开头');
    const {url, query} = tlSplitUrl(raw);
    return {...base, http: {url, ...(Object.keys(query).length ? {query} : {}), ...(conn ? {conn} : {})},
            params: tlParamsPayload(raw)};
  }
  if (tlProposeKind === 'sql') {
    const conn = $('tlNewConn') ? $('tlNewConn').value : '';
    const query = $('tlNewSql').value.trim();
    if (!conn) throw new Error('请先选一个数据库连接');
    if (!/^(select|with)\b/i.test(query)) throw new Error('查询只能是一条 SELECT 或 WITH');
    const rows = Math.min(1000, Math.max(1, parseInt($('tlNewRows').value, 10) || 100));
    return {...base, impl: {type: 'sql', conn, query, max_rows: rows}, params: tlParamsPayload(query, true)};
  }
  const cmd = $('tlNewCmd').value.trim();
  const parts = cmd.split(/\s+/).filter(Boolean);
  if (!parts.length) throw new Error('请填写完整命令');
  const os = [...$('tlPanel').querySelectorAll('[data-tlos]:checked')].map(box => box.dataset.tlos);
  const groups = ($('tlNewGroups') ? $('tlNewGroups').value : '').split(/[\s,，、]+/).filter(Boolean);
  return {...base, binary: parts[0], argv: parts, ...(os.length ? {os} : {}), ...(groups.length ? {groups} : {}),
          params: tlParamsPayload(cmd)};
}
$('tlPanel').addEventListener('change', e => {

  if (!pf || !row) return;
  const st = (tlParamState[row.dataset.tlparam] ||= {type: 'name', required: true, def: '', desc: ''});
  if (pf === 'required') { st.required = e.target.checked; const d = row.querySelector('[data-pf="def"]'); if (d) d.disabled = st.required; }
  else st[pf] = e.target.value;
});

async function ask() {
  const q = $('question').value.trim();
  if (!q || $('askBtn').disabled) return;
  const book = pendingPlaybook && q.startsWith(pendingPlaybook.prefix) ? pendingPlaybook : null;
  const playbookId = book ? book.id : undefined;
  pendingPlaybook = null;
  $('question').value = ''; autosize();
  if ($('thread').querySelector('.welcome')) $('thread').innerHTML = '';
  addUser(q);
  const bot = addBot('<div class="status"></div><div class="answer"></div>');
  // 这一轮的回答模式：发出去的就是页面上显示的（智能模式不可用时一律是知识库模式）
  const mode = sendMode();
  bot.dataset.mode = mode;
  if (book) { bot.dataset.playbook = book.name || ''; bot.dataset.playbookId = book.id; }
  paintRun(bot);
  const card = bot.querySelector('.card'), ans = bot.querySelector('.answer');
  // 等待态按服务端的阶段事件换文案，并跟着走秒；status 被 delta 分支移除后（模型先说一句再调工具）要能补回来
  const t0 = performance.now(); let tFirst = 0;
  const tick = () => ((performance.now() - t0) / 1000).toFixed(1) + ' s';
  const setStatus = html => {
    let st = card.querySelector('.status');
    if (!st) { st = document.createElement('div'); st.className = 'status'; card.insertBefore(st, ans); }
    st.innerHTML = `<span class="spin"></span><span class="txt">${html}</span><span class="tick">${tick()}</span>`;
  };
  const clearStatus = () => card.querySelector('.status')?.remove();
  const ticker = setInterval(() => { const el = card.querySelector('.status .tick'); if (el) el.textContent = tick(); }, 200);
  // 智能模式不预检索：查不查知识库由模型决定
  setStatus(mode === 'smart' ? '模型正在判断要查什么…' : '正在检索知识库…');
  toBottom();
  $('askBtn').disabled = true;
  let text = '', pending = false, finished = false, candidates = 0, answered = false;
  const wasNew = !convId;
  const webSrc = [];
  // 渲染推迟到下一帧；流结束后才执行的那一帧不能再把光标加回去。
  const paint = () => { pending = false; if (finished) return; const stick = nearBottom(); ans.innerHTML = md(text); ans.classList.add('cursor'); if (stick) toBottom(); };
  try {
    const r = await fetch('/api/ask', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                       body: JSON.stringify({question: q, conversation_id: convId, web: webOn,
                                                             model: modelPick || undefined,
                                                             playbook_id: playbookId, answer_mode: mode})});
    if (r.status === 503) { const d = await r.json().catch(() => ({})); throw new Error((d.detail || '服务未就绪') + '（去「设置」配置模型）'); }
    // 409：服务端刚关了智能模式（或缺它要的开关）。重新取设置，tab 跟着变灰，不悄悄换成知识库模式重答
    if (r.status === 409) { const d = await r.json().catch(() => ({})); loadDocs(); throw new Error(d.detail || '智能模式不可用'); }
    if (!r.ok) { const d = await r.json().catch(() => ({detail: r.status})); throw new Error(d.detail); }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream: true}); let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const msg = JSON.parse(buf.slice(0, nl)); buf = buf.slice(nl + 1);
        if (msg.conversation) {
          convId = msg.conversation.id;
          if (msg.model) bot.dataset.model = msg.model;
          if (msg.execution_id) bot.dataset.exec = msg.execution_id;
          if (msg.answer_mode && msg.answer_mode !== bot.dataset.mode) { bot.dataset.mode = msg.answer_mode; paintRun(bot); }
        } else if (msg.stage) {
          setStatus(msg.stage === 'rewrite' ? '正在结合上文理解问题…'
                  : msg.stage === 'retrieve' ? '正在检索知识库（向量 + 关键词）…'
                  : msg.stage === 'rerank' ? '找到候选片段，正在重排…'
                  : msg.stage === 'think' ? (candidates ? `检索到 ${candidates} 个候选片段，模型正在判断相关性并组织回答…` : '模型思考中…')
                  : '处理中…');
        } else if (msg.thinking) {
          // 思考型模型出正文前的推理片段数：数字在涨就说明模型在动
          setStatus(`模型思考中（已推理 ${msg.thinking} 步）…`);
        } else if (msg.sources) {
          bot.dataset.retr = ((performance.now() - t0) / 1000).toFixed(1);
          candidates = msg.sources.length;
          bot.querySelector('.sources').innerHTML = sourcesHtml(msg.sources);
          arrangeSources(bot, '', false);
        } else if (msg.tool_call) {
          const cat = stepCategory(msg.tool_call), tool = msg.tool_call.tool;
          setStatus(cat === 'web' ? (tool === 'web_fetch' ? '正在读取网页正文…' : '知识库里没有足够信息，正在上网搜索…')
                  : cat === 'knowledge' ? (tool === 'kb_read' ? '正在读知识库原文的前后文…'
                                         : tool === 'kb_catalog' ? '正在查看知识库目录…' : '正在检索知识库…')
                  : cat === 'internal' ? '正在更新待办清单…'
                  : cat === 'compute' ? '正在沙箱里运行计算…'
                  : `正在查询：${esc(tool)}…`);
          bot.querySelector('.steps').insertAdjacentHTML('beforeend', stepHtml(msg.tool_call, true));
          paintRun(bot);
          if (nearBottom()) toBottom();
        } else if (msg.web_sources) {
          webSrc.push(...msg.web_sources);
          bot.querySelector('.sources').insertAdjacentHTML('beforeend', sourcesHtml(msg.web_sources));
          arrangeSources(bot, '', false);
        } else if (msg.kb_sources) {
          // 模型补查 / 读前后文拿到的片段：编号接着往下编，和联网结果一样追加卡片
          bot.querySelector('.sources').insertAdjacentHTML('beforeend', sourcesHtml(msg.kb_sources));
          arrangeSources(bot, '', false);
        } else if (msg.plan) {
          showPlan(bot, msg.plan);
          if (nearBottom()) toBottom();
        } else if (msg.tool_result) {
          const steps = bot.querySelectorAll('.step.running');
          const step = steps[steps.length - 1];
          if (step) {
            step.classList.remove('running');
            step.querySelector('.n').textContent = `${msg.tool_result.lines} 行`;
            step.querySelector('.ret').textContent = msg.tool_result.preview;
            if (msg.tool_result.chars > (msg.tool_result.preview || '').length)
              step.querySelector('.out').insertAdjacentHTML('beforeend',
                `<div class="trunc">仅显示前 ${msg.tool_result.preview.length} 字，共 ${msg.tool_result.chars} 字 / ${msg.tool_result.lines} 行</div>`);
          }
          setStatus('工具已返回，模型正在分析…');
          if (nearBottom()) toBottom();
        } else if (msg.delta) {
          clearStatus();
          text += msg.delta;
          if (msg.delta.trim()) answered = true;
          if (!tFirst) tFirst = performance.now();
          if (!pending) { pending = true; requestAnimationFrame(paint); }
        } else if (msg.error) {
          // 检索一失败流就结束了，转圈要立刻停，错误随正文一起画出来
          clearStatus();
          text += `\n\n⚠️ ${msg.error}`;
        }
      }
    }
    finished = true;
    clearStatus();
    ans.innerHTML = md(text || '（没有返回内容）');
  } catch (e) {
    finished = true;
    clearStatus();
    ans.innerHTML = md(text) + `<p class="error">请求失败：${esc(e.message)}</p>`;
  } finally {
    finished = true;
    clearInterval(ticker);
    ans.classList.remove('cursor');
    // 新对话这一轮没答出任何东西：服务端已把它删掉，这边也忘掉它的 id，下一问重新开
    if (wasNew && !answered) convId = null;
    arrangeSources(bot, text, true);
    bot.dataset.took = ((performance.now() - t0) / 1000).toFixed(1);
    if (tFirst) bot.dataset.first = ((tFirst - t0) / 1000).toFixed(1);
    addTools(bot, text, q, webSrc);
    paintRun(bot);
    $('askBtn').disabled = false; $('question').focus();
    loadConvs();
    // 自由排查（没带 SOP）用了 ≥2 次数据类工具：服务端可能在后台长出一个 SOP 提议，退避轮询取回
    if (sopGrowth && !playbookId && bot.dataset.exec && bot.querySelectorAll('.step[data-cat="data"]').length >= 2) pollProposal(bot);
  }
}

/* ---------- 页面切换 ----------

function urlFor() {
  const qs = new URLSearchParams();
  if (page === 'tools' && tlTab !== 'all') qs.set('tab', tlTab);
  if (page === 'sop' && pbTab !== 'all') qs.set('tab', pbTab);
  if (page === 'docs' && docTab !== 'all') qs.set('tab', docTab);
  if (page === 'sop' && pbTab === 'runs' && runFilter.sop) qs.set('sop', runFilter.sop);
  if (page === 'sop' && pbTab === 'auto' && autoSop) qs.set('sop', autoSop);
  if (['tools', 'sop', 'docs'].includes(page) && mItem) qs.set('item', mItem);
  if (page === 'chat' && convId) qs.set('c', convId);
  return PAGES[page][0] + (qs.toString() ? '?' + qs : '');
}
function syncUrl(push) {

}
function go(name, opts = {}) {

/* 当前地址 → 页面。兼容老地址：/manage（#settings、#access，或上次的页签）、
   /?q=…&pb=…&send=1（老管理页「▶ 执行」「用它提问」跳过来的） */
function route() {
  const path = location.pathname.replace(/\/+$/, '') || '/';
  const qs = new URLSearchParams(location.search);
  if (path === '/manage') {
    const want = location.hash.slice(1) || localStorage.getItem('kb-mtab') || 'tools';
    history.replaceState(null, '', PAGES[['tools', 'sop', 'docs', 'access', 'settings'].includes(want) ? want : 'tools'][0]);
    return route();
  }
  if (path === '/' && qs.get('q')) {
    const text = qs.get('q');
    history.replaceState(null, '', '/chat');
    go('chat', {push: false});
    $('question').value = text; autosize();
    if (qs.get('pb')) pendingPlaybook = {id: qs.get('pb'), name: (text.match(/《(.+?)》/) || [])[1] || '', prefix: text.split('（')[0]};
    if (qs.get('send')) ask();
    else $('question').setSelectionRange(text.length - 1, text.length - 1);
    return;
  }
  const name = Object.keys(PAGES).find(k => PAGES[k][0] === path) || 'home';
  if (name === 'tools') tlTab = ['pending', 'infra'].includes(qs.get('tab')) ? qs.get('tab') : 'all';
  if (name === 'sop') {
    pbTab = ['proposals', 'runs', 'auto'].includes(qs.get('tab')) ? qs.get('tab') : 'all';
    if (pbTab === 'runs') runFilter = {sop: qs.get('sop') || '', trigger: ''};
    if (pbTab === 'auto') autoSop = qs.get('sop') || '';
  }
  if (name === 'docs') docTab = qs.get('tab') === 'gaps' ? 'gaps' : 'all';
  go(name, {push: false, item: qs.get('item') || null});
  if (name === 'chat' && qs.get('c') && qs.get('c') !== convId) openConv(qs.get('c'));
}

/* ---------- 工作台 ----------

const KIND_LABEL = {command: '命令型', script: '脚本型', http: '接口型', sql: 'SQL', mcp: 'MCP'};
function ago(t) {
  if (!t) return '';
  const d = new Date(String(t).includes('T') || String(t).endsWith('Z') ? t : String(t).replace(' ', 'T'));
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 60) return '刚刚';
  if (s < 3600) return `${Math.floor(s / 60)} 分钟前`;
  if (s < 86400 && new Date().getDate() === d.getDate()) return `今天 ${d.toTimeString().slice(0, 5)}`;
  return d.toLocaleString('zh-CN', {month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'});
}
function sourcePills(t) {
  const s = t.sources || {}, h = t.hosts || {}, mcp = s.mcp || {};
  const pill = (on, text, title) => `<span class="pill ${on ? 'ok' : 'off'}" title="${esc(title)}">${on ? '✓' : '–'} ${text}</span>`;
  return [
    h.configured ? `<span class="pill ${h.offline.length ? 'warn' : 'ok'}" title="主机清单：${h.offline.length ? esc(h.offline.map(x => x.name).join('、')) + ' 离线' : '全部在线'}">🖥 ${h.online}/${h.total} 主机在线</span>`
                 : pill(false, '远程主机', '没有配置主机清单'),
    pill(s.k8s, 'K8s', s.k8s ? `${s.k8s} 个 Kubernetes 工具` : '没有 Kubernetes 工具'),
    pill(s.sql, `SQL${s.sql ? ' ' + s.sql : ''}`, s.sql ? `${s.sql} 个数据库连接` : '没有数据库连接'),
    pill(mcp.servers, `MCP${mcp.servers ? ` ${mcp.online}/${mcp.servers}` : ''}`, mcp.servers ? `${mcp.online} 个 MCP server 在线，共 ${mcp.servers} 个` : '没有 MCP server'),
    pill(s.sandbox, '计算沙箱', s.sandbox ? 'python_exec 已打开' : '没有打开计算沙箱'),
    pill(s.web, '联网', s.web ? '联网搜索已配置' : '没有配置联网搜索'),
  ].join('');

/* ---------- 工具 / SOP / 文档：分组 → 列表 → 详情 ----------
   分组和列表由服务端分页接口喂数据（文档全在本地，客户端分组分页）；
   详情区里放的是 tlPanel / pbPanel 这两个元素本身，改名/启停/编辑/保存 的事件处理挂在它们身上。
   工具页的「待审批」、SOP 页的「待确认提议」是没有分组栏的 列表 → 详情；「主机与数据源」、设置、对外接入是单栏。 */
const TAB = {
  tools: {panel: 'tl', title: '工具', unit: '个可用', key: 'group', newLabel: '＋ 申请新工具'},
  sop:   {panel: 'pb', title: 'SOP', unit: '个生效', key: 'source', newLabel: '＋ 新建'},
  docs:  {title: '文档', unit: '个文档'},
  settings: {title: '设置'},
  access: {title: '对外接入'},
};
const PAGE_TABS = ['settings', 'access'];
function tlRow(name, t) {
  const st = t.enabled && t.runnable ? ['ok', '可用'] : t.applicable === false ? ['', t.hosts ? '没有适用的主机' : '不适用于这台机器']
           : !t.runnable ? ['bad', '不可运行'] : ['', '已停用'];
  mCache['tl:' + name] = {name, t};
  return `<div class="mrow ${mItem === name ? 'on' : ''}" data-mitem="${esc(name)}">
    <div class="t">${esc(t.label || name)}${t.label ? `<code>${esc(name)}</code>` : ''}</div>
    <div class="s">${esc(t.desc)}</div><span class="st ${st[0]}">${st[1]}</span></div>`;
}
function pbRow(p) {

  const st = p.enabled && !bad ? ['ok', '生效'] : bad ? ['bad', '工具缺失'] : ['', '已停用'];
  const last = (runSummary[p.id] || {}).last;

    <div class="t">${esc(p.name)}</div>
    <div class="s">${last ? `${(LEVEL[last.level] || LEVEL.unknown)[1]} ` : ''}${p.steps.length} 步 · ${esc(p.steps.map(s => toolLabel(s.tool)).join(' → '))}${p.trigger ? ' · ' + esc(p.trigger) : ''}</div>
    <span class="st ${st[0]}">${st[1]}</span></div>`;

function docRow(d) {

function mgHtml(name, live, total, special) {

const BACK = '<button class="md-back" data-back>← 返回列表</button>';

async function renderManage() {
  const cfg = TAB[mTab];
  const formPage = PAGE_TABS.includes(mTab) || (mTab === 'tools' && tlTab === 'infra') || (mTab === 'sop' && pbTab === 'auto')
                 || (mTab === 'docs' && docTab === 'gaps');
  const flat = (mTab === 'tools' && tlTab === 'pending') || (mTab === 'sop' && ['proposals', 'runs'].includes(pbTab));
  document.body.classList.toggle('settings', formPage);
  document.body.classList.toggle('nogroups', flat);
  $('msettings').hidden = !formPage;
  paintTop();
  if (mTab === 'settings') return renderSettings();
  if (mTab === 'access') return renderAccess();
  if (mTab === 'tools' && tlTab === 'infra') return renderInfra();
  if (mTab === 'tools' && tlTab === 'pending') return renderPending();
  if (mTab === 'sop' && pbTab === 'proposals') return renderProposals();
  if (mTab === 'sop' && pbTab === 'runs') return renderRuns();
  if (mTab === 'sop' && pbTab === 'auto') return renderAuto();
  if (mTab === 'docs' && docTab === 'gaps') return renderGaps();

  // 1. 分组栏
  let groups, live, count;
  if (mTab === 'docs') {
    const by = {};
    for (const d of allDocs) { const k = d.category || '未分类'; by[k] = (by[k] || 0) + 1; }
    groups = Object.entries(by).sort((a, b) => b[1] - a[1]).map(([name, total]) => ({name, total}));
    count = allDocs.length; live = null;
  } else {
    const [d] = await Promise.all([fetch(LAZY[cfg.panel].url).then(r => r.json()), mTab === 'sop' ? loadRunSummary() : null]);
    groups = d.groups || []; live = d.live || 0; count = d.count || 0;
    if (mTab === 'sop') { pbTools = d.tools || {}; pbOrigins = d.origins || null; paintTop(); }
    if (mTab === 'tools') { tlHost = d.host || {}; tlConns = d.connections || {}; tlHosts = d.hosts || {configured: false}; tlPrereview = !!d.prereview; }
    if (d.error) toast('工具接口不可用：' + d.error, 'err');
  }
  // 从工作台、对话里点过来的条目：先选中它所在的组
  const hit = mItem && (mCache[(mTab === 'tools' ? 'tl:' : mTab === 'sop' ? 'pb:' : 'doc:') + mItem]);
  if (hit && !mGroup) mGroup = mTab === 'tools' ? hit.t.group : mTab === 'sop' ? (hit.source || null) : (hit.category || '未分类');
  if (!groups.some(g => g.name === mGroup)) mGroup = groups[0]?.name || null;
  $('mgroups').innerHTML = `<div class="mg-head">${mTab === 'docs' ? '分类' : mTab === 'tools' ? '分组' : '来源文档'}</div>`
    + groups.map(g => mgHtml(g.name, g.live, g.total)).join('')
    + (mTab === 'tools' ? `<div class="mg-head" style="margin-top:10px">数据从哪里来</div>
        <div class="mg" data-infra><span class="n">主机、连接、MCP server</span><span class="c">→</span></div>` : '')
    + (!groups.length ? '<div class="empty">空</div>' : '');

  // 2. 列表栏：工具栏 + 行（总数在顶栏，这里只写这一组有几个）
  const inGroup = groups.find(g => g.name === mGroup);
  const stat = inGroup ? (inGroup.live == null ? `${inGroup.total} 个` : `${inGroup.live} / ${inGroup.total} ${cfg.unit.slice(1)}`) : '';
  $('mtool').innerHTML =
    `<span class="ttl">${esc(mSearch ? '搜索结果' : mGroup || cfg.title)}<small>${stat}</small></span>
     <input type="search" id="mSearch" placeholder="搜索${cfg.title}…" value="${esc(mSearch)}" autocomplete="off">
     ${mTab === 'docs' ? '<input id="newCat" class="cat" list="catList" placeholder="上传到哪个分类（留空自动识别）" maxlength="12"><button class="act" id="mUpload">＋ 上传文档</button>'
       : mTab === 'sop' ? '<button class="act ghost" id="mNewSop">＋ 新建</button><button class="act" id="mExtract">从文档抽取</button>'
       : `<button class="act" id="mNewTool">${cfg.newLabel}</button>`}`;
  const rows = $('mrows');
  if (mTab === 'docs') {
    const f = mSearch.trim().toLowerCase();
    const list = allDocs.filter(d => f ? (d.source.toLowerCase().includes(f) || (d.category || '').toLowerCase().includes(f))
                                     : (d.category || '未分类') === mGroup);
    rows.innerHTML = (list.length ? list.slice(0, PAGE).map(docRow).join('')
        + (list.length > PAGE ? `<button class="more" data-docmore="${PAGE}">加载更多（还有 ${list.length - PAGE} 条）</button>` : '')
      : '<div class="empty">没有文档。把文件拖进页面任何地方就能上传。</div>')
      + '<div class="tl-note" style="padding:10px 16px">单个 ≤ 50MB · 同名覆盖 · 图片自动识别 · PDF / Word / PPT / TXT / MD</div>';
    rows._docList = list;
    if (mSearch) $('mtool').querySelector('small').textContent = `匹配 ${list.length} 条`;
  } else {
    const params = mSearch.trim() ? {q: mSearch} : mGroup ? {[cfg.key]: mGroup} : null;
    if (!params) rows.innerHTML = `<div class="empty">${mTab === 'sop' ? '还没有 SOP。点「从文档抽取」，从排查手册、巡检规范里整理出操作步骤。' : '还没有可用工具。配置 OPS_URL 后，Agent 就能查询真实数据。'}</div>`;
    else {
      rows.innerHTML = '<div class="empty">加载中…</div>';
      const d = await fetchPage(cfg.panel, params, 0);
      rows.innerHTML = (d.total ? LAZY[cfg.panel].rows(d) : `<div class="empty">没有匹配的${cfg.title}</div>`)
                     + moreHtml(cfg.panel, params, LAZY[cfg.panel].count(d), d.total, 'rows');
      if (mSearch) $('mtool').querySelector('small').textContent = `匹配 ${d.total} 条`;
    }
  }

  // 3. 详情栏
  renderDetail();
  const box = $('mSearch');
  if (document.activeElement?.id !== 'mSearch' && mSearchFocus) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
  mSearchFocus = false;
}
let mSearchFocus = false;

async function renderDetail() {
  const det = $('mdetail');
  for (const id of ['tlPanel', 'pbPanel']) if ($(id).parentElement !== det) { document.body.appendChild($(id)); $(id).hidden = true; }
  const mount = id => { det.querySelectorAll(':scope > *:not(.pb-panel)').forEach(x => x.remove()); det.prepend($(id)); det.insertAdjacentHTML('afterbegin', BACK); $(id).hidden = false; return $(id); };
  const empty = text => { det.querySelectorAll(':scope > .pb-panel').forEach(p => p.hidden = true); det.insertAdjacentHTML('beforeend', `<div class="md-empty">${text}</div>`); };
  det.querySelectorAll(':scope > :not(.pb-panel)').forEach(x => x.remove());

  if (mTab === 'tools') {
    const p = mount('tlPanel');
    if (tlProposing) {
      if (tlProposeKind === 'script') { const s = await (await fetch('/api/tools/scripts')).json().catch(() => ({})); tlScripts = s.scripts || []; tlScriptDir = s.directory || ''; }
      p.innerHTML = tlProposeForm(); tlApplyPrefill(); $('tlNewName')?.focus(); return;
    }
    const hit = mCache['tl:' + mItem];
    if (!hit) { p.hidden = true; return empty('从左侧选择一个工具<br>查看命令、参数，或改名、改说明、启停'); }
    p.innerHTML = tlCard(hit.name, hit.t);
    if (tlEditing) { const box = $('tlLabel') || $('tlDesc'); box?.focus(); }
  } else if (mTab === 'sop') {
    const p = mount('pbPanel');
    if (pbPicking) { p.innerHTML = pbPicker(); $('pbDocFilter')?.focus(); return; }
    if (pbEditing !== null) { p.innerHTML = pbEditor(pbEditing); return; }
    const hit = mCache['pb:' + mItem];
    if (!hit) { p.hidden = true; return empty('从左侧选择一个 SOP<br>查看步骤与文档原句，或执行、编辑、启停'); }
    p.innerHTML = pbCard(hit);
  } else {
    det.querySelectorAll(':scope > .pb-panel').forEach(p => p.hidden = true);
    const d = mCache['doc:' + mItem] || allDocs.find(x => x.source === mItem);
    if (!d) return empty('从左侧选择一个文档<br>查看信息、改分类、下载、删除，或从它抽取 SOP');
    const ext = d.source.split('.').pop().toLowerCase(); const [label, color] = TYPE[ext] || ['FILE', '#64748b'];
    det.insertAdjacentHTML('beforeend', `${BACK}<div class="md-doc">
      <div class="hd"><div class="ico" style="background:${color}">${label}</div><div class="nm">${esc(d.source)}</div></div>
      <dl><dt>分类</dt><dd>${esc(d.category || '未分类')}</dd><dt>片段数</dt><dd>${d.chunks}</dd><dt>类型</dt><dd>${esc(ext.toUpperCase())}</dd></dl>
      <div class="acts">
        <button class="pri" data-mextract="${esc(d.source)}">从此文档抽取 SOP</button>
        <button class="tag" data-cat="${esc(d.source)}" data-now="${esc(d.category || '未分类')}">改分类</button>
        <button class="download" data-name="${esc(d.source)}">下载原文件</button>
        <button class="del danger" data-name="${esc(d.source)}">删除</button>
      </div>
      <div class="sub">由它抽取的 SOP</div><div id="mDocSops"><span class="m" style="color:var(--muted);font-size:12px">加载中…</span></div></div>`);
    const r = await fetchPage('pb', {source: d.source}, 0).catch(() => ({playbooks: []}));
    const box = $('mDocSops'); if (!box) return;

      : '<div style="color:var(--muted);font-size:12.5px">还没有。点上面「从此文档抽取 SOP」试试——文档要写成按步骤查看、核对的形式。</div>';
  }
}

/* ---------- 待审批：申请的完整内容、风险提示，批准要输审批口令 ----------
   审批口令不是网页登录密码：只存哈希，由工具服务核对（应用只转交，不保存、不记录）。还没设时页面上直接设，

  return `<div class="ap">

/* 口令对话框：输错留在框里重输（还能试几次由工具服务回），锁定、脚本被改这类错误按钮变灰。
   口令只在这次请求里用，发出去就清空输入框；不进 localStorage，不进地址栏。 */
let dlgCancel = null;
function closeDialog(cancelled) {
  const wrap = document.querySelector('.dlg-scrim'); if (!wrap) return;
  wrap.querySelectorAll('input[type=password]').forEach(x => { x.value = ''; });
  wrap.remove();
  const cb = dlgCancel; dlgCancel = null;
  if (cancelled && cb) cb();
}
function askPassphrase({title, summary, confirm, run, done, cancel}) {
  closeDialog();
  const ap = approvalInfo();
  const wrap = document.createElement('div');
  wrap.className = 'dlg-scrim';
  wrap.innerHTML = `<form class="dlg" autocomplete="off">
    <h3>🔐 ${esc(title)}</h3><div class="sum">${summary || ''}</div>
    <label class="pw">审批口令<input type="password" id="dlgPass" autocomplete="off" spellcheck="false">
      <span class="hint">不是网页登录密码。审批口令在「设置 → 审批口令」里设置和修改（忘了只能在宿主机上重设），只存哈希，由工具服务核对；连续输错 ${ap.max_failures || 5} 次，页面审批锁定 ${ap.lock_minutes || 15} 分钟。</span></label>
    ${plainHint()}
    <div class="err" id="dlgErr"></div>
    <div class="row"><button type="button" class="btn" data-dlgcancel>取消</button><button type="submit" class="btn warn" id="dlgOk">${esc(confirm || '确定')}</button></div></form>`;
  document.body.appendChild(wrap);
  dlgCancel = cancel || null;
  const input = $('dlgPass'), ok = $('dlgOk');
  setTimeout(() => input.focus(), 30);
  wrap.addEventListener('mousedown', e => { if (e.target === wrap) closeDialog(true); });
  wrap.querySelector('[data-dlgcancel]').onclick = () => closeDialog(true);
  wrap.querySelector('form').addEventListener('submit', async e => {
    e.preventDefault();
    const pass = input.value;
    if (!pass) { input.focus(); return; }
    input.value = '';
    ok.disabled = true; ok.textContent = '核对中…'; $('dlgErr').textContent = '';
    try {
      const result = await run(pass);
      dlgCancel = null; wrap.remove();
      if (done) done(result);
    } catch (err) {
      $('dlgErr').textContent = err.message;
      ok.textContent = confirm || '确定';
      // 锁定、没设口令、脚本被改过，或者申请已经入队（再点只会撞上同名申请）：按钮变灰，关掉对话框再处理
      ok.disabled = err.status === 423 || err.status === 409 || !!err.pending;
      input.focus();
      if (err.status === 423 || err.status === 409) refreshApproval();
    }
  });
}
async function refreshApproval() {
  const r = await fetch('/api/tools/approval').catch(() => null);
  if (r && r.ok) apState.approval = await r.json();
}
async function postJson(path, body) {
  const r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    const err = new Error(typeof d.detail === 'string' ? d.detail : `请求失败（${r.status}）`);
    err.status = r.status;
    err.pending = d.pending || null;
    err.data = d;
    throw err;
  }
  return d;
}
const approveRequest = (id, body) => postJson(`/api/tools/pending/${encodeURIComponent(id)}/approve`, body)
  .then(d => ({...d, id}));
function approveFlow(id) {
  const it = apState.pending.find(x => x.id === id); if (!it) return;
  const d = it.detail || {}, t = it.tool || {};
  const attest = !!$('apAttest')?.checked;
  if (d.kind === 'mcp' && !d.mcp.readonly_declared && !attest) {
    toast('这个 MCP 工具没有只读声明：先勾选「我确认这个工具只读」', 'err');
    const box = $('apAttest')?.closest('.attest'); if (box) flash(box);
    return;
  }
  askPassphrase({
    title: `批准「${t.label || t.name}」`, summary: approveSummary(d), confirm: '批准',
    run: passphrase => approveRequest(id, {passphrase, attest_readonly: attest, script_sha256: d.script?.sha256 || ''}),
    done: result => { apResults[id] = result; mItem = id; toast(`已批准：${t.label || t.name}`, 'ok'); renderManage(); refreshBadges(); },
  });
}
async function rejectFlow(id) {
  const it = apState.pending.find(x => x.id === id); if (!it) return;
  if (!confirm(`拒绝「${it.tool?.label || it.tool?.name}」？申请会被删掉，不会写进配置。`)) return;
  try { await postJson(`/api/tools/pending/${encodeURIComponent(id)}/reject`); toast('已拒绝', 'ok'); apMine.delete(id); }
  catch (err) { toast('拒绝失败：' + err.message, 'err'); }
  mItem = null; renderManage(); refreshBadges();
}
function trustFlow(script) {
  const s = apState.held.find(x => x.script === script); if (!s) return;
  askPassphrase({
    title: `重新确认脚本 ${script}`, confirm: '确认',
    summary: `确认的是此刻的内容（sha256 ${esc(s.sha256.slice(0, 16))}…）；引用它的工具「${esc(s.label || s.tool)}」恢复可用。`,
    run: passphrase => postJson(`/api/tools/scripts/${encodeURIComponent(script)}/trust`, {passphrase, sha256: s.sha256}),
    done: () => { toast(`已重新确认 ${script}`, 'ok'); mItem = null; renderManage(); refreshBadges(); },
  });
}

/* ---------- 审批口令：在页面上设置、修改 ----------
   还没设 → 新口令输两遍就设上；已经设了 → 要旧口令（和批准共用输错计数、锁定）；忘了只能在宿主机上重设，页面上没有找回。
   设置页、「主机与数据源」的卡片里是同一个表单，「待审批」里的「现在设置」把它放进对话框。
   口令只在这次请求里用：提交就清空输入框，不进 localStorage、不进地址栏（输入框没有 name，表单不会自己提交出去）。 */
const LOCAL_HOSTS = ['127.0.0.1', 'localhost', '::1', '[::1]'];
function plainHint() {
  return LOCAL_HOSTS.includes(location.hostname) ? ''
    : `<div class="plain">⚠ 当前是明文连接（${esc(location.host)}），口令会以明文经过网络。经 SSH 隧道、从本机地址（127.0.0.1）打开更安全。</div>`;
}
// 设置时间：带时区的按浏览器的时区显示；今年的只写月日和时分
function setAtText(t) {
  const d = new Date(String(t || '').replace(' ', 'T'));
  if (!t || isNaN(d)) return String(t || '');
  const p = n => String(n).padStart(2, '0');
  const md = `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  return d.getFullYear() === new Date().getFullYear() ? md : `${d.getFullYear()}-${md}`;
}
// 「已设置：11-01 11:30，在页面上设置（来自 1.2.3.4）」：万一不是自己设的，一眼看得出来
function passWho(ap) {
  const when = setAtText(ap.set_at);
  const how = ap.set_by === 'page' ? `在页面上设置${ap.set_from ? `（来自 ${ap.set_from}）` : ''}`
    : ap.set_by === 'cli' ? '在宿主机上用命令行设置' : '';
  return esc(`已设置${when ? '：' + when : ''}${how ? '，' + how : ''}`);
}
function passFormHtml(ap, inDialog = false) {
  const change = !!ap.configured, off = ap.locked ? ' disabled' : '';
  const input = (key, label, auto, hint) => `<label><span>${label}</span><input type="password" data-pf="${key}" autocomplete="${auto}"
      spellcheck="false" autocapitalize="off"${off}>${hint ? `<i>${hint}</i>` : ''}</label>`;
  return `<form class="passform" method="post" data-passform="${change ? 'change' : 'set'}">
    ${change ? input('old', '旧口令', 'current-password', '') : ''}
    ${input('new', change ? '新口令' : '审批口令', 'new-password', `至少 ${ap.min_length || 12} 个字符，不能和网页登录密码相同`)}
    ${input('new2', '再输一遍', 'new-password', '')}
    ${plainHint()}<div class="err"></div>
    <div class="pf-row">${inDialog ? '<button type="button" class="btn" data-dlgcancel>取消</button>' : ''}<button type="submit" class="btn warn"${off}>${
      change ? '修改审批口令' : '设置审批口令'}</button></div></form>`;
}
/* 表单提交：先在页面上查（旧口令有没有输、新口令够不够长、两遍一样不一样），再交给应用转工具服务。
   done(消息)：成功是 done(null)；状态变了（刚被别人设上、锁定、口令文件出了问题、工具服务较旧）先刷新状态再 done(原因)。 */
function bindPassForm(root, done) {
  const form = root.querySelector('[data-passform]'); if (!form) return;
  const field = key => form.querySelector(`[data-pf="${key}"]`);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const old = field('old'), a = field('new'), b = field('new2'), err = form.querySelector('.err'), ok = form.querySelector('[type=submit]');
    const min = approvalInfo().min_length || 12;
    err.textContent = '';
    if (old && !old.value) { err.textContent = '先输旧口令'; return old.focus(); }
    if (a.value.length < min) { err.textContent = `新口令至少 ${min} 个字符`; return a.focus(); }
    if (a.value !== b.value) { a.value = ''; b.value = ''; err.textContent = '两次输入的新口令不一样，请重新输入'; return a.focus(); }
    const body = old ? {new: a.value, current: old.value} : {new: a.value};
    form.querySelectorAll('input[type=password]').forEach(x => { x.value = ''; });
    const label = ok.textContent;
    ok.disabled = true; ok.textContent = '提交中…';
    try {
      const r = await postJson('/api/tools/approval/passphrase', body);
      apState.approval = r.approval;
      if (overview) overview.approval = r.approval;
      toast(r.first ? '已设置审批口令' : '已修改审批口令', 'ok');
      done(null);
    } catch (error) {
      ok.disabled = false; ok.textContent = label;
      if ([409, 423, 500, 501, 502].includes(error.status)) { await refreshApproval(); return done(error.message); }
      err.textContent = error.message;
      (old || a).focus();
    }
  });
}
// 卡片：画进 box 并接上表单；msg 是上一次提交被拒的原因（状态变了、表单重画之后再显示）
function paintPass(box, msg) {
  if (!box) return;
  box.innerHTML = passCard(approvalInfo());
  bindPassForm(box, m => { paintPass(box, m); refreshBadges(); });
  if (!msg) return;
  const err = box.querySelector('.passform .err');
  if (err) err.textContent = msg; else toast(msg, 'err', 9000);
}
// 「待审批」里的「现在设置」：同一个表单放进对话框，设好后批准按钮就能用了
function openPassDialog() {
  closeDialog();
  const ap = approvalInfo();
  const wrap = document.createElement('div');
  wrap.className = 'dlg-scrim';
  wrap.innerHTML = `<div class="dlg"><h3>🔐 ${ap.configured ? '修改' : '设置'}审批口令</h3>
    <div class="sum">和网页登录密码不同：页面上批准工具、重新确认脚本时输入它。设好之后要改得输旧口令；忘了只能在宿主机上重设：
      <code>${esc(setCmd(ap))}</code></div>${passFormHtml(ap, true)}</div>`;
  document.body.appendChild(wrap);

  bindPassForm(wrap, msg => {

/* ---------- SOP 页「待确认提议」：从自由排查里长出来的 SOP，保存或忽略 ---------- */

/* 页面上的改动都在对话框里做。口令每次用完就清空输入框；输入的凭据留到对话框关掉（测试完接着保存不用重输）。
   都不进 localStorage、不进地址栏。要确认的列表（在用它的工具、target 会变的工具）和用户看到的不一样时，
   工具服务回 409 和新的列表（不消耗口令次数），对话框里换成新的、勾选框重新变成没勾。 */
function icDialog(title, body, actions) {
  closeDialog();
  const wrap = document.createElement('div');
  wrap.className = 'dlg-scrim';
  wrap.innerHTML = `<form class="dlg ic" autocomplete="off"><h3>${title}</h3>${body}<div class="err" id="dlgErr"></div><div class="row">${actions}</div></form>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('mousedown', e => { if (e.target === wrap) closeDialog(true); });
  wrap.querySelectorAll('[data-dlgcancel]').forEach(b => { b.onclick = () => closeDialog(true); });
  wrap.querySelector('form').addEventListener('submit', e => e.preventDefault());
  wrap.addEventListener('click', e => {
    const copy = e.target.closest('[data-iccopy]');
    if (!copy) return;
    const text = copy.parentElement.querySelector('pre').textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject(new Error('no clipboard')))
      .then(() => toast('已复制', 'ok'), () => toast('复制不了：手动选中复制', 'err'));
  });
  return wrap;
}
function icPassHtml() {
  const ap = approvalInfo();
  return `<label class="pw">审批口令<input type="password" data-icpass autocomplete="off" spellcheck="false" autocapitalize="off">
    <span class="hint">不是网页登录密码；和批准工具共用输错计数，连续输错 ${ap.max_failures || 5} 次，页面审批锁定 ${ap.lock_minutes || 15} 分钟。</span></label>${plainHint()}`;
}
function icTake(wrap, selector) {
  const input = wrap.querySelector(selector);
  const value = input ? input.value : '';
  if (input) input.value = '';
  return value;
}
function icPass(wrap, why) {
  const value = icTake(wrap, '[data-icpass]');
  if (!value) throw new Error(why || '要输审批口令');
  return value;
}
async function icRun(wrap, button, work) {
  const err = wrap.querySelector('#dlgErr');
  err.textContent = '';
  const buttons = [...wrap.querySelectorAll('.row button, .acts button')];
  buttons.forEach(b => { b.dataset.was = b.disabled ? '1' : ''; b.disabled = true; });
  const label = button.textContent;
  button.textContent = '处理中…';
  try {
    return await work();
  } catch (e) {
    err.textContent = e.message;
    if (e.status === 423 || e.status === 409) refreshApproval();
    if (e.data && wrap.icConflict) wrap.icConflict(e.data);
    return null;
  } finally {
    buttons.forEach(b => { b.disabled = b.dataset.was === '1'; });
    button.textContent = label;
  }
}
// 试探（测试、扫描、检查连通）的结果。名额紧时会还在排队：这里不会自动刷新，请人过一会儿再点
function icProbeHtml(p, again) {
  if (!p) return '';
  return p.state === 'done' ? precheckHtml(p) : `<div class="note">还在排队：工具服务这会儿要做的试探多，过一会儿再点「${esc(again)}」。</div>`;
}
const icProbeBox = (title, p, again) => p ? `<div class="icbox"><h4>${esc(title)}</h4>${icProbeHtml(p, again)}</div>` : '';
function icDoneDialog(title, message, extra) {
  icDialog(esc(title), `<div class="sum">${esc(message)}</div>${extra || ''}`, '<button type="button" class="btn pri" data-dlgcancel>好</button>');
}
const icField = (wrap, key) => wrap.querySelector(`[data-f="${key}"]`);
const icOpt = (value, label, current) => `<option value="${esc(value)}"${value === current ? ' selected' : ''}>${esc(label)}</option>`;
const IC_TICK = '<label class="chk"><input type="checkbox" data-f="confirm"><span>我知道这些工具会受影响</span></label>';
// 要确认的工具：放在 [data-confirm] 里，勾了才提交；409 回来新的列表时整块换掉（新的勾选框没勾）
function icConfirmHtml(users, sops, title) {
  return (users || []).length ? icUsersBox(users, sops, title) + IC_TICK : '';
}
// target 会变的工具：放在 [data-impact] 里，同上
function icImpactConfirm(list, title) {
  return (list || []).length ? icImpactHtml(list, title) + IC_TICK : '';
}
function icConfirmed(wrap, users) {
  if ((users || []).length && !(icField(wrap, 'confirm') || {}).checked) throw new Error('先勾选「我知道这些工具会受影响」');
  return users || [];
}
// 409：在用它的工具变了。换成新的列表，返回新的列表
function icNewUsers(wrap, data, title) {
  wrap.querySelector('[data-confirm]').innerHTML = icConfirmHtml(data.confirm, data.confirm_sops, title + '（变了，重新看一遍）');
  return data.confirm;
}

/* ---- 连接：HTTP 接口、PostgreSQL、MySQL ---- */
const IC_CONN_USERS = '在用这个连接的已批准工具：改了它们会受影响';
const IC_MCP_USERS = '这个 server 上已批准的工具：改了它们会受影响';
const IC_TLS = {postgres: [['prefer', 'prefer（有就用）'], ['require', 'require（必须加密）'], ['verify', 'verify（加密并校验证书）'], ['disable', 'disable（不加密）']],
                mysql: [['disable', 'disable（不加密）'], ['require', 'require（必须加密）'], ['verify', 'verify（加密并校验证书）']]};
function icConnDialog(name) {

  if (name && !x) return toast('页面上没有这个连接了，刷新看看', 'err');
  const f = x ? (x.fields || {}) : {type: 'postgres'}, edit = !!x, state = edit ? (x.secret || {}).state : '';
  const keep = edit && state === 'set';
  const secretHint = edit ? `现在：${(IC_SECRET[state] || IC_SECRET.missing)[1]}。${keep ? '留空就不改；' : ''}改了地址、端口、库名、账号或 TLS，原来存的会作废，要重新输入`
    : '只写不读：存好以后页面上只看得到「已设置」';
  const body = `<div class="sum">${edit ? '名字和类型改不了（要改就删掉再加一个）。' : ''}页面上加的连接只能用这里输入的凭据，引用不了服务器上的 <code>\${名字}</code>。
      sqlite、自定义 CA、令牌文件只能在服务器上配。</div>
    <div class="grid2">
      <label class="fld">类型<select data-f="type"${edit ? ' disabled' : ''}>${icOpt('postgres', 'PostgreSQL', f.type)}${icOpt('mysql', 'MySQL', f.type)}${icOpt('http', 'HTTP 接口', f.type)}</select></label>
      <label class="fld">名字<input data-f="name" value="${esc(f.name || '')}"${edit ? ' disabled' : ''} maxlength="31" placeholder="小写字母开头，比如 cmdb"></label>
    </div>
    <label class="fld">显示名<input data-f="label" value="${esc(f.label || '')}" maxlength="40" placeholder="可以不填"></label>
    <div data-kind="http">
      <label class="fld">地址<input data-f="base" value="${esc(f.base || '')}" placeholder="https://prom.example.internal:9090"></label>
      <div class="grid2">
        <label class="fld">凭据放在哪<select data-f="auth">${icOpt('none', '不带凭据', f.auth || 'none')}${icOpt('bearer', 'Bearer 令牌（Authorization）', f.auth)}${icOpt('header', '指定的请求头', f.auth)}</select></label>
        <label class="fld" data-show="header">请求头名<input data-f="auth_header" value="${esc(f.auth_header || '')}" placeholder="X-Api-Key"></label>
      </div>
      <label class="fld" data-show="token">令牌<input type="password" data-f="token" autocomplete="new-password" spellcheck="false" placeholder="${keep ? '留空就不改' : ''}"><span class="hint">${secretHint}</span></label>
    </div>
    <div data-kind="db">
      <div class="grid2">
        <label class="fld">主机<input data-f="host" value="${esc(f.host || '')}" placeholder="db.example.internal"></label>

        <label class="fld">库名<input data-f="database" value="${esc(f.database || '')}"></label>
        <label class="fld">账号（只读账号）<input data-f="user" value="${esc(f.user || '')}"></label>
        <label class="fld">TLS<select data-f="tls"></select></label>
        <label class="fld">语句超时（秒）<input data-f="timeout" value="${esc(f.timeout || '')}" inputmode="numeric" placeholder="5"></label>
      </div>
      <label class="fld">密码<input type="password" data-f="password" autocomplete="new-password" spellcheck="false" placeholder="${keep ? '留空就不改' : ''}"><span class="hint">${secretHint}</span></label>
    </div>
    <label class="chk"><input type="checkbox" data-f="external"${f.external ? ' checked' : ''}><span>标为外部：调用时实参要过出网规则，返回标成外部资料。按地址判断是外部的不能改成内部</span></label>
    ${keep ? '<label class="chk"><input type="checkbox" data-f="clear"><span>清除存着的凭据</span></label>' : ''}
    <div data-confirm>${edit ? icConfirmHtml(x.used_by, x.sops, IC_CONN_USERS) : ''}</div>
    <div data-result></div>${icPassHtml()}`;
  const wrap = icDialog(edit ? `修改连接 ${esc(name)}` : '添加连接', body,

  let users = edit ? (x.used_by || []) : [];
  const sync = () => {
    const type = icField(wrap, 'type').value, auth = icField(wrap, 'auth').value;
    wrap.querySelector('[data-kind="http"]').hidden = type !== 'http';
    wrap.querySelector('[data-kind="db"]').hidden = type === 'http';
    wrap.querySelector('[data-show="header"]').hidden = auth !== 'header';
    wrap.querySelector('[data-show="token"]').hidden = auth === 'none';
    const tls = icField(wrap, 'tls'), pick = tls.value || f.tls || (type === 'mysql' ? 'disable' : 'prefer');

    if (edit) body.original = name;

      icProbeBox('测试', r.test, '测试'));
  });
}

// 核对 host key 后登记；已经登记过的（目标主机重装了、换了 host key）要勾「替换」
async function icTrustDialog(name) {
  const h = (infra.c.hosts || []).find(i => i.name === name && i.origin === 'page') || {};
  const keys = icScanKeys(icScans[name]), replace = (h.trusted || []).length > 0;
  let impact;
  try { impact = (await postJson('/api/tools/config/host-trust', {name, dry_run: true})).impact || []; }
  catch (e) { return toast(e.message, 'err', 6000); }
  const title = '登记以后这台主机进主机清单，这些工具的 target 会变';
  const wrap = icDialog(`核对 ${esc(name)} 的 host key`, `<div class="sum">在目标主机的控制台上执行 <code>ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub</code>，
      选和它一致的那一个。工具服务会重新扫一次，只登记指纹和你选的一致的那一把；对不上就不登记。</div>
    ${replace ? `<div class="icbox warn"><h4>已经登记过</h4>${(h.trusted || []).map(k => `<div><code>${esc(k.type)} ${esc(k.fingerprint)}</code></div>`).join('')}
      <div>host key 变了先查清原因：目标主机重装了？还是有人冒充？</div></div>
      <label class="chk"><input type="checkbox" data-f="replace"><span>查清了，替换原来登记的 host key</span></label>` : ''}
    <div class="keys">${keys.map(k => `<label><input type="radio" name="icfp" value="${esc(k.fingerprint)}">${esc(k.type)} ${esc(k.fingerprint)}</label>`).join('')}</div>
    <div data-impact>${icImpactConfirm(impact, title)}</div>${icPassHtml()}`,
    '<button type="button" class="btn" data-dlgcancel>取消</button><button type="button" class="btn warn" data-act="trust">核对一致，登记</button>');
  wrap.icConflict = data => {
    if (!data.confirm_impact) return;
    impact = data.confirm_impact;
    wrap.querySelector('[data-impact]').innerHTML = icImpactConfirm(impact, title + '（变了，重新看一遍）');
  };
  wrap.querySelector('[data-act="trust"]').onclick = e => icRun(wrap, e.currentTarget, async () => {
    const picked = wrap.querySelector('input[name="icfp"]:checked');
    if (!picked) throw new Error('先选一个指纹：和目标主机控制台上显示的一致的那一个');
    if (replace && !icField(wrap, 'replace').checked) throw new Error('已经登记过 host key：查清原因后勾选「替换」');
    const body = {name, fingerprint: picked.value, confirm_impact: icConfirmed(wrap, impact).map(i => i.tool), passphrase: icPass(wrap)};
    if (replace) body.replace = true;
    await postJson('/api/tools/config/host-trust', body);
    delete icScans[name];
    toast(`已登记 ${name} 的 host key`, 'ok');
    await icReload();
    icHostDialog(name);
  });
}

  } else if (!ap.page_set) {
    body = `<div class="note">工具服务版本较旧，页面上不能设置审批口令：升级宿主机上的 <code>ops_readonly.py</code>（和 <code>ops_exec.py</code>

  } else {

      ? `<div class="pass-who">${passWho(ap)}</div><div class="note">不是你设的？马上在宿主机上用下面的命令重设，再看工具服务日志里的 <code>[approval]</code> 记录。</div>`

      + (ap.locked ? `<div class="pb-warn" style="padding:8px 0 0">🔒 审批口令连续输错 ${ap.max_failures || 5} 次，页面审批锁定中，${unlockIn(ap)}：这期间页面上不能批准，也不能改口令。</div>` : '')
      + passFormHtml(ap);

/* ---------- SOP 执行记录、自动执行（定时、告警）、知识库缺口（docs/自动执行.md） ----------
   执行记录：每次按 SOP 执行（对话里的「▶ 执行」、SOP 页的「立即执行一次」、定时、告警触发）都留一份：结论（正常 / 有异常 /
   没跑成 / 没法判断）、异常项、和上次比、每一步的调用和原始返回、人工反馈。结论从回答里按 SOP 输出格式的表格解析，
   解析不出来的记「没法判断」，不当成正常。
   自动执行：计划和告警规则只能从服务器上配好的收件组里选名字，收件地址、SMTP 账号和告警令牌页面上都看不到。
   知识库缺口：大家常问、文档里没写的问题，按次数排；「忽略」后相似的问题不再出现。 */
const LEVEL = {ok: ['ok', '✅', '正常'], anomaly: ['warn', '⚠️', '有异常'], failed: ['bad', '❌', '没跑成'], unknown: ['unk', '❓', '没法判断']};
const RUN_STATUS = {queued: '排队中', running: '执行中', missed: '错过', skipped: '跳过'};
const TRIGGER = {web: ['▶', '页面'], schedule: ['⏰', '定时'], alert: ['🚨', '告警']};
const MARK = {ok: '✅', warn: '⚠️', bad: '❌', unknown: '❓'};
const FEEDBACK = {correct: '判断正确', false_alarm: '误报', wrong_threshold: '阈值不对', missing_step: '漏了一步', unhelpful: '没答好'};
const WEEKDAY = ['一', '二', '三', '四', '五', '六', '日'];
const NOTIFY_WHEN = {problems: '有异常、没跑成、没法判断时', always: '每次都发'};
const NOTIFY_REPEAT = {daily: '同一个问题每天最多提醒一次', always: '每次都发（标「仍未恢复」）', never: '恢复之前不重复发'};

const shortTime = t => t ? new Date(t).toLocaleString('zh-CN', {month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false}) : '—';
const paramsText = p => Object.entries(p || {}).map(([k, v]) => `${k}=${v}`).join('，');
const isRunning = r => !!r && (r.status === 'queued' || r.status === 'running');
const triggerLabel = r => { const t = TRIGGER[r.trigger] || ['', r.trigger || '']; return `${t[0]} ${esc(t[1])}`; };
function levelPill(r, big) {

    const values = Object.fromEntries([...wrap.querySelectorAll('[data-param]')].map(x => [x.dataset.param, x.value.trim()]));

    try { await run(values); wrap.remove(); }

  });

async function runNowFlow(id) {
  const p = await pbGet(id);
  if (!p) return toast('这个 SOP 已经不在了', 'err');
  const start = async params => {
    const d = await postJson(`/api/playbooks/${encodeURIComponent(id)}/run`, {params});
    toast(`已开始在后台执行 SOP《${p.name}》，结果在「执行记录」里`, 'ok');
    runFilter = {sop: id, trigger: ''};
    go('sop', {tab: 'runs', item: d.run.id});
  };
  const blanks = blanksOf(p);
  if (!blanks.length) { try { await start({}); } catch (e) { toast('没开始执行：' + e.message, 'err', 6000); } return; }
  paramsDialog({title: `立即执行一次：SOP《${p.name}》`, confirm: '开始执行', fields: blanks, run: start,
    summary: '在后台按 SOP 跑一遍，不进对话，结果在「执行记录」里。这个 SOP 有留空的参数，自动执行时没人能回答，先填好：'});

function compareHtml(c) {
  if (!c) return '<div class="note" style="margin:0">同一个 SOP、同样的参数，这是第一次完成的执行：还没有可比的。</div>';
  const line = (cls, label, i, extra) => `<div class="c ${cls}"><b>${label}</b><span>${esc(i.step)}：${esc(i.value || '—')}${extra || ''}</span></div>`;
  const before = i => i.before && i.before !== i.value ? `（上次 ${esc(i.before)}）` : '';
  const parts = [...c.new.map(i => line('new', '新出现', i, before(i))), ...c.still.map(i => line('still', '仍未恢复', i, before(i))),
    ...c.recovered.map(i => line('rec', '已恢复', i, before(i))),
    ...c.changed.filter(i => i.deltas.length).map(i => `<div class="c chg"><b>数值变化</b><span>${esc(i.step)}：${esc(i.deltas.join('；'))}</span></div>`),
    ...(c.gone || []).map(i => line('gone', '没再出现', i))];
  return `<div class="cmp-hd">和 ${esc(shortTime(c.previous.started_at))} 那次比 ${levelPill(c.previous)}</div>`
    + (c.note ? `<div class="note" style="margin:0">${esc(c.note)}</div>` : '')
    + (parts.length ? `<div class="cmp">${parts.join('')}</div>`
       : c.note ? '' : '<div class="note" style="margin:0">和上一次一样：没有新出现、也没有恢复的异常，数值没变。</div>');
}

      · ${c.ok ? '成功' : '<span style="color:var(--danger)">失败</span>'} · ${c.duration_ms} ms · ${c.chars} 字</div>
    <details><summary>原始返回</summary><pre class="code">${esc(c.output || '')}</pre>${c.truncated ? `<div class="kv">只显示了前 20000 字，共 ${c.chars} 字</div>` : ''}</details></div>`;
}
function stepsHtml(r) {

    return `<details class="rs"><summary><span class="i">${s.n}</span><span class="tl">${esc(toolLabel(s.tool))}</span><span>${marks}</span>
        <span class="ck">${esc(s.checkpoint || '')}</span></summary><div class="body">
      ${s.checkpoint ? `<div class="kv">检查点：${esc(s.checkpoint)}</div>` : ''}${args ? `<div class="kv">参数：${esc(args)}</div>` : ''}
      ${(s.rows || []).map(x => `<div class="kv">${MARK[x.mark] || '❓'} <b>${esc(x.check || '')}</b>：${esc(x.value || '—')}${x.note ? '（' + esc(x.note) + '）' : ''}</div>`).join('')}
