<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人知识库</title>
<style>
:root {
  --bg: #f5f6fa; --panel: #ffffff; --panel-2: #f0f2f7; --border: #e3e6ee; --text: #1c2030;
  --muted: #7a8094; --accent: #4f6bff; --accent-2: #7c5cff; --accent-soft: #eef1ff;
  --danger: #e5484d; --ok: #1f9d6a; --shadow: 0 6px 24px rgba(30, 40, 90, .08);
  --user-bg: linear-gradient(135deg, #4f6bff, #7c5cff);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1117; --panel: #171a23; --panel-2: #1f2330; --border: #2a2f3d; --text: #e6e8ef;
    --muted: #8a90a3; --accent: #7b8cff; --accent-2: #a28bff; --accent-soft: #232a45;
    --shadow: 0 6px 24px rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 15px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
       color: var(--text); background: var(--bg); display: flex; overflow: hidden; }
button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
button:disabled { opacity: .5; cursor: default; }

/* Sidebar */
aside { width: 300px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
        display: flex; flex-direction: column; transition: transform .25s; z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 12px; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--user-bg); display: grid;
        place-items: center; color: #fff; font-size: 18px; box-shadow: var(--shadow); }
.brand h1 { font-size: 17px; margin: 0; }
.brand small { display: block; color: var(--muted); font-size: 12px; }
.drop { margin: 6px 14px 10px; border: 1.5px dashed var(--border); border-radius: 12px; padding: 16px 12px;
        text-align: center; color: var(--muted); font-size: 13px; cursor: pointer; transition: .2s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.drop b { display: block; color: var(--text); font-size: 14px; margin-bottom: 2px; }
.drop.over b { color: var(--accent); }
.queue { padding: 0 14px; }
.job { font-size: 12.5px; background: var(--panel-2); border-radius: 8px; padding: 7px 10px; margin-bottom: 6px;
       display: flex; gap: 8px; align-items: flex-start; }
.job .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job.err { color: var(--danger); } .job.done { color: var(--ok); }
.job.err .name { white-space: pre-wrap; overflow: visible; word-break: break-word; line-height: 1.5; }
.job .close { color: inherit; opacity: .7; padding: 0 2px; flex-shrink: 0; }
.job .close:hover { opacity: 1; }
.spin { width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent);
        border-radius: 50%; animation: spin .8s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.docs-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 18px 6px;
             font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.search { margin: 0 14px 8px; }
.search input { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
                background: var(--panel-2); color: var(--text); font: inherit; font-size: 13px; outline: none; }
.search input:focus { border-color: var(--accent); }
.docs { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
.cat { display: flex; align-items: center; gap: 6px; padding: 8px 10px 4px; font-size: 12px;
       color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.cat .line { flex: 1; height: 1px; background: var(--border); }
.doc { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; }
.doc:hover { background: var(--panel-2); }
.doc .ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 11px;
            font-weight: 700; color: #fff; flex-shrink: 0; }
.doc .meta { flex: 1; min-width: 0; }
.doc .title { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc .sub { font-size: 12px; color: var(--muted); }
.doc .del { opacity: 0; color: var(--muted); padding: 4px 6px; border-radius: 6px; }
.doc .tag { opacity: 0; color: var(--accent); font-size: 12px; padding: 4px 6px; border-radius: 6px; flex-shrink: 0; }
.doc:hover .tag, .doc:focus-within .tag { opacity: 1; }
.doc .tag:hover { background: var(--accent-soft); }
.doc:hover .del { opacity: 1; }
.doc .del:hover { color: var(--danger); background: var(--panel); }
.doc .download { color: var(--accent); font-size: 12px; padding: 4px 6px; border-radius: 6px; flex-shrink: 0; }
.doc .download:hover, .doc .download:focus-visible { background: var(--accent-soft); }
.doc:focus-within .del { opacity: 1; }
@media (hover: none) { .doc .del { opacity: 1; } }
.empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 10px; }
.foot { border-top: 1px solid var(--border); padding: 10px 18px; font-size: 12px; color: var(--muted); }

/* Main */
main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
header { display: flex; align-items: center; gap: 6px; padding: 10px 18px; border-bottom: 1px solid var(--border);
         background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(8px);
         position: relative; z-index: 30; }
.head-title { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
.head-title .t { font-weight: 650; font-size: 15px; letter-spacing: .2px; white-space: nowrap; }
.model-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
              background: var(--panel-2); border: 1px solid var(--border); padding: 3px 10px; border-radius: 999px;
              max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.model-chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex-shrink: 0;
                      box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
header svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.9;
             stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.nav-btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 11px; border-radius: 10px;
           color: var(--text); font-size: 13px; transition: background .15s, color .15s; }
.nav-btn:hover { background: var(--panel-2); }
.nav-btn.open { background: var(--accent-soft); color: var(--accent); }
.nav-btn.icon-only { padding: 0 9px; }
.new-btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 10px;
           background: var(--user-bg); color: #fff; font-size: 13px; font-weight: 500;
           box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 30%, transparent); transition: transform .15s; }
.new-btn:hover { transform: translateY(-1px); }
.nav-sep { width: 1px; height: 20px; background: var(--border); margin: 0 6px; }
.badge { min-width: 18px; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; line-height: 16px;
         text-align: center; background: var(--panel-2); color: var(--muted); font-variant-numeric: tabular-nums; }
.badge:empty { display: none; }
.badge.on { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.nav-btn.open .badge { background: var(--panel); }
.pb-head .t small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
@media (max-width: 1000px) { .model-chip { display: none; } }
@media (max-width: 700px) { .nav-btn .lbl, .new-btn .lbl, .nav-sep { display: none; } }
.icon-btn { padding: 6px 10px; border-radius: 8px; color: var(--muted); font-size: 13px; }
.icon-btn:hover { background: var(--panel-2); color: var(--text); }
.hist-wrap { position: static; }
.hist { position: absolute; top: calc(100% + 6px); right: 12px; width: 300px; max-width: calc(100vw - 24px);
        max-height: 60vh; overflow-y: auto;
        background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 6px;
        box-shadow: var(--shadow); z-index: 40; }
.conv { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; cursor: pointer; }
.conv:hover { background: var(--panel-2); }
.conv.on { background: var(--accent-soft); }
.conv .meta { flex: 1; min-width: 0; }
.conv .title { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv .sub { font-size: 12px; color: var(--muted); }
.conv .del { opacity: 0; color: var(--muted); padding: 4px 6px; border-radius: 6px; }
.conv:hover .del { opacity: 1; }
.conv .del:hover { color: var(--danger); background: var(--panel); }
#menuBtn { display: none; }
#chat { flex: 1; overflow-y: auto; padding: 24px 20px 12px; scroll-behavior: smooth; }
.wrap { max-width: 820px; margin: 0 auto; }

.welcome { text-align: center; padding: 8vh 10px 20px; }
.welcome .logo { width: 56px; height: 56px; font-size: 28px; border-radius: 16px; margin: 0 auto 14px; }
.welcome h2 { margin: 0 0 6px; font-size: 22px; }
.welcome p { color: var(--muted); margin: 0 0 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.chip { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px;
        font-size: 13.5px; text-align: left; max-width: 260px; box-shadow: var(--shadow); }
.chip:hover { border-color: var(--accent); color: var(--accent); }

.msg { display: flex; gap: 12px; margin-bottom: 22px; animation: in .25s ease; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }
.msg.user { justify-content: flex-end; }
.bubble-user { background: var(--user-bg); color: #fff; padding: 10px 14px; border-radius: 16px 16px 4px 16px;
               max-width: 80%; white-space: pre-wrap; word-break: break-word; box-shadow: var(--shadow); }
.avatar { width: 32px; height: 32px; border-radius: 10px; background: var(--user-bg); color: #fff; display: grid;
          place-items: center; flex-shrink: 0; font-size: 16px; }
.bot { flex: 1; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 4px 16px 16px 16px;
        padding: 14px 18px; box-shadow: var(--shadow); }
.status { color: var(--muted); font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
.answer { word-break: break-word; }
.answer > :first-child { margin-top: 0; } .answer > :last-child { margin-bottom: 0; }
.answer h1, .answer h2, .answer h3, .answer h4 { margin: 14px 0 6px; line-height: 1.35; }
.answer h1 { font-size: 19px; } .answer h2 { font-size: 17px; } .answer h3, .answer h4 { font-size: 15.5px; }
.answer p { margin: 6px 0; } .answer ul, .answer ol { margin: 6px 0; padding-left: 22px; }
.answer li { margin: 3px 0; }
.answer code { background: var(--panel-2); padding: 1px 5px; border-radius: 5px; font-size: 13px;
               font-family: ui-monospace, Consolas, monospace; }
.answer pre { background: var(--panel-2); padding: 12px 14px; border-radius: 10px; overflow-x: auto; }
.answer pre code { background: none; padding: 0; }
.answer blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--accent); color: var(--muted); }
.answer table { border-collapse: collapse; margin: 8px 0; font-size: 13.5px; display: block; overflow-x: auto; }
.answer th, .answer td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
.answer th { background: var(--panel-2); }
.answer hr { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
.cite { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; margin: 0 1px;
        border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 700;
        cursor: pointer; vertical-align: 2px; }
.cite:hover { background: var(--accent); color: #fff; }
.error { color: var(--danger); }
.cursor::after { content: "▍"; color: var(--accent); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.sources { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.src-unused { font-size: 12.5px; color: var(--muted); }
.src-unused > summary { cursor: pointer; padding: 4px 2px; list-style: none; }
.src-unused > summary::-webkit-details-marker { display: none; }
.src-unused > summary::before { content: '▸ '; }
.src-unused[open] > summary::before { content: '▾ '; }
.src-unused .src { margin-top: 6px; opacity: .7; }
.src { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; font-size: 13px;
       transition: border-color .2s; }
.src.flash { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.src summary { list-style: none; cursor: pointer; padding: 8px 12px; display: flex; gap: 8px; align-items: center; }
.src summary::-webkit-details-marker { display: none; }
.src summary .n { color: var(--accent); font-weight: 700; }
.src summary .loc { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { width: 48px; height: 5px; background: var(--panel-2); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.src .body { white-space: pre-wrap; padding: 0 12px 10px; color: var(--muted); max-height: 260px; overflow-y: auto; }
.tools { margin-top: 6px; display: flex; gap: 4px; }
.steps { margin: 8px 0 2px; display: flex; flex-direction: column; gap: 6px; }
.step { background: var(--panel-2); border: 1px solid var(--border); border-left: 3px solid var(--accent);
        border-radius: 8px; font-size: 13px; overflow: hidden; animation: in .2s ease; }
.step summary { list-style: none; cursor: pointer; padding: 7px 11px; display: flex; gap: 8px; align-items: center; }
.step summary::-webkit-details-marker { display: none; }
.step .ico { font-size: 13px; }
.step .cmd { font-family: ui-monospace, Consolas, monospace; color: var(--accent); flex-shrink: 0; }
.step .arg { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step .n { color: var(--muted); font-size: 12px; flex-shrink: 0; }
.step .out { white-space: pre-wrap; padding: 0 11px 9px; color: var(--muted); font-size: 12.5px;
             font-family: ui-monospace, Consolas, monospace; max-height: 240px; overflow-y: auto; }
.step.running { border-left-color: #f59e0b; }
.step.running .cmd { color: #f59e0b; }

/* Playbooks */
.pb-wrap { position: static; }
.pb-panel { position: absolute; top: calc(100% + 6px); right: 12px; width: 540px; max-width: calc(100vw - 24px);
            max-height: 72vh; overflow-y: auto;
            background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px;
            box-shadow: var(--shadow); z-index: 40; }
.pb-head { display: flex; align-items: center; gap: 8px; padding: 2px 4px 10px; }
.pb-head .t { flex: 1; font-weight: 600; font-size: 14px; }
.pb { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; }
.pb.off { opacity: .55; }
.pb.bad { border-color: var(--danger); }
.pb-top { display: flex; align-items: center; gap: 8px; padding: 9px 11px; }
.pb-top .nm { flex: 1; font-size: 13.5px; font-weight: 600; min-width: 0;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pb-top .src { font-size: 11.5px; color: var(--muted); flex-shrink: 0; }
.pb-top button { font-size: 12px; color: var(--muted); padding: 3px 7px; border-radius: 6px; flex-shrink: 0; }
.pb-top button:hover { background: var(--panel-2); color: var(--text); }
.pb-body { padding: 0 11px 10px; font-size: 12.5px; }
.pb-trig { color: var(--muted); margin-bottom: 6px; }
.pb-step { display: flex; gap: 7px; padding: 5px 0; border-top: 1px dashed var(--border); align-items: baseline; }
.pb-step .i { color: var(--accent); font-weight: 700; flex-shrink: 0; }
.pb-step .tl { font-family: ui-monospace, Consolas, monospace; color: var(--accent); flex-shrink: 0; }
.pb-step .ck { color: var(--muted); flex: 1; }
.pb-warn { color: var(--danger); font-size: 12px; padding: 4px 11px 8px; }
.pb-edit textarea { width: 100%; box-sizing: border-box; min-height: 190px; font-size: 12.5px;
                    font-family: ui-monospace, Consolas, monospace; padding: 9px; border-radius: 8px;
                    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
                    resize: vertical; }
.pb-edit .row { display: flex; gap: 6px; margin-top: 7px; }
.pb-edit .row button { padding: 6px 13px; border-radius: 7px; font-size: 13px; }
.pb-edit .ok { background: var(--user-bg); color: #fff; }
.pb-edit .cancel { background: var(--panel-2); color: var(--muted); }
.pb-err { color: var(--danger); font-size: 12.5px; margin-top: 6px; white-space: pre-wrap; }
.pb-tools { font-size: 11.5px; color: var(--muted); padding: 6px 4px 2px; border-top: 1px solid var(--border); }
.pb-pick { border: 1px solid var(--accent); border-radius: 10px; padding: 10px; margin-bottom: 8px;
           background: var(--accent-soft); }
.pb-pick .hd { font-size: 13px; font-weight: 600; margin-bottom: 7px; }
.pb-pick input, .pb-pick select { width: 100%; box-sizing: border-box; font: inherit; font-size: 13px;
                                  padding: 6px 9px; border-radius: 7px; border: 1px solid var(--border);
                                  background: var(--panel); color: var(--text); outline: none; }
.pb-pick select { margin-top: 6px; padding: 4px; }
.pb-pick select option { padding: 4px 6px; }
.tl-wrap { position: static; }
.tl-cmd { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--accent);
          background: var(--panel-2); border-radius: 6px; padding: 5px 8px; margin: 2px 0 5px;
          overflow-x: auto; white-space: nowrap; }
.tl-params { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--muted); }
.tl-params code { color: var(--text); }
.tl-note { font-size: 11.5px; color: var(--muted); padding: 2px 4px 8px; line-height: 1.6; }
.tl-wait { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px;
           padding: 9px 11px; margin-bottom: 8px; font-size: 12.5px; }
.tl-wait .cmd { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px;
                color: var(--muted); margin-top: 3px; }
.tl-pick input { margin-bottom: 6px; }
.tl-group { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600;
            color: var(--muted); padding: 8px 4px 5px; letter-spacing: .5px; }
.tl-group span { font-weight: 400; }
.tl-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
.tl-tab { font-size: 12.5px; padding: 4px 14px; border-radius: 7px; border: 1px solid var(--border);
          background: var(--panel); color: var(--muted); }
.tl-tab.on { background: var(--user-bg); color: #fff; border-color: var(--user-bg); }
.tl-script { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; white-space: pre;
             overflow: auto; max-height: 180px; background: var(--panel-2); color: var(--text);
             border: 1px solid var(--border); border-radius: 7px; padding: 8px; margin: 2px 0 6px; }
.pb-pick input:focus, .pb-pick select:focus { border-color: var(--accent); }
.pb-pick .row { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
.pb-pick .row button { padding: 6px 13px; border-radius: 7px; font-size: 13px; }
.pb-pick .go { background: var(--user-bg); color: #fff; }
.pb-pick .cancel { background: var(--panel); color: var(--muted); }
.pb-pick .cnt { flex: 1; font-size: 12px; color: var(--muted); }
.tools button { font-size: 12px; color: var(--muted); padding: 3px 8px; border-radius: 6px; }
.tools button:hover { background: var(--panel-2); color: var(--text); }
.tools button[data-savenote] { color: #0284c7; }
.note-edit { margin-top: 8px; border: 1px solid #0ea5e9; border-radius: 10px; padding: 10px;
             background: rgba(14,165,233,.06); font-size: 13px; }
.note-edit .hd { font-weight: 600; margin-bottom: 6px; }
.note-edit input, .note-edit textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 13px;
             padding: 7px 9px; border-radius: 7px; border: 1px solid var(--border);
             background: var(--panel); color: var(--text); margin-bottom: 6px; }
.note-edit textarea { min-height: 160px; resize: vertical; }
.note-edit .src-list, .note-edit .tip { font-size: 12px; color: var(--muted); }
.note-edit .row { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
.note-edit .row button { padding: 5px 13px; border-radius: 7px; font-size: 13px; }
.note-edit .ok { background: var(--user-bg); color: #fff; }
.note-edit .cancel { background: var(--panel-2); color: var(--muted); }
.note-edit .msg { font-size: 12px; color: var(--muted); }
.note-edit .done { color: #059669; }

/* Composer */
.composer { padding: 10px 20px 18px; }
.box { max-width: 820px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; background: var(--panel);
       border: 1px solid var(--border); border-radius: 16px; padding: 8px 8px 8px 16px; box-shadow: var(--shadow); }
.box:focus-within { border-color: var(--accent); }
#question { flex: 1; border: 0; outline: none; resize: none; background: transparent; color: var(--text);
            font: inherit; max-height: 180px; padding: 6px 0; }

</style>
</head>
<body>
<aside>
  <div class="brand"><div class="logo">📚</div><div><h1>个人知识库</h1><small id="summary">加载中…</small></div></div>
  <div class="drop" id="drop"><b>＋ 上传文档</b>点击或拖拽文件到这里<br>PDF · Word · PPT · TXT · MD · 图片</div>
  <input type="file" id="files" multiple hidden accept=".md,.markdown,.txt,.pdf,.docx,.pptx,.png,.jpg,.jpeg,.webp,.bmp,.gif">
  <div class="search"><input id="newCat" list="catList" placeholder="分类（留空则自动识别）" maxlength="12"></div>
  <datalist id="catList"></datalist>
  <div class="queue" id="queue"></div>
  <div class="docs-head"><span>文档</span><span id="docCount"></span></div>
  <div class="search"><input id="filter" placeholder="按文件名或分类筛选…"></div>
  <div class="docs" id="docs"></div>
  <div class="foot">单个 ≤ 50MB · 同名覆盖 · 图片自动识别<br>鼠标移到文档上可改分类、下载或删除</div>
</aside>
<div class="scrim" id="scrim"></div>

<main>
  <header>
    <button class="nav-btn icon-only" id="menuBtn" title="文档" aria-label="文档">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="head-title">
      <span class="t">知识库问答</span>
      <span class="model-chip" id="modelInfo" hidden></span>
    </div>
    <button class="new-btn" id="newBtn" title="开始新对话">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">新对话</span></button>
    <span class="nav-sep"></span>
    <div class="tl-wrap">
      <button class="nav-btn" id="tlBtn" title="工具：Agent 能查询的真实数据，全部只读">
        <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>
        <span class="lbl">工具</span><span class="badge" id="tlBadge"></span></button>
      <div class="pb-panel" id="tlPanel" hidden></div>
    </div>
    <div class="pb-wrap">
      <button class="nav-btn" id="pbBtn" title="技能：从文档里学会的做法，按步骤调用已有工具">
        <svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.3L20 9l-4.4 3.9L17 19l-5-3-5 3 1.4-6.1L4 9l5.8-.7z"/></svg>
        <span class="lbl">技能</span><span class="badge" id="pbBadge"></span></button>
      <div class="pb-panel" id="pbPanel" hidden></div>
    </div>
    <div class="hist-wrap">
      <button class="nav-btn" id="histBtn" title="历史对话">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span class="lbl">历史</span></button>
      <div class="hist" id="histPanel" hidden></div>
    </div>
  </header>
  <div id="chat"><div class="wrap" id="thread"></div></div>
  <div class="composer">
    <div class="box">
      <textarea id="question" rows="1" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="webBtn" class="web-toggle" title="知识库答不了时，自动上网搜索公开资料" hidden>🌐 联网</button>
      <button id="askBtn" title="发送">➤</button>
    </div>
    <div class="hint">支持多轮追问 · 点击 <span class="cite">1</span> 查看知识库出处，<span class="cite">W1</span> 为网络来源</div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPE = {pdf:['PDF','#e5484d'], docx:['DOC','#3b82f6'], pptx:['PPT','#f97316'], txt:['TXT','#64748b'],
  md:['MD','#0ea5e9'], markdown:['MD','#0ea5e9'], png:['IMG','#10b981'], jpg:['IMG','#10b981'], jpeg:['IMG','#10b981'],
  webp:['IMG','#10b981'], bmp:['IMG','#10b981'], gif:['IMG','#10b981']};
let allDocs = [], seq = 0;

/* ---------- Minimal, XSS-safe Markdown ---------- */
function inline(s) {
  s = esc(s);
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => (codes.push(c), `\u0000${codes.length - 1}\u0000`));
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
       .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
       .replace(/~~([^~]+)~~/g, '<del>$1</del>')
       .replace(/\[(W?\d{1,2})\]/g, '<span class="cite" data-n="$1">$1</span>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}
function md(src) {
  const lines = src.replace(/\r/g, '').split('\n'); const out = []; let i = 0;
  const isTableSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`); continue;
    }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (l.includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const head = cells(l); i += 2; const rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) rows.push(cells(lines[i++]));
      out.push(`<table><thead><tr>${head.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>` +
        rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('') + '</tbody></table>');
      continue;
    }
    if (/^>\s?/.test(l)) {
      const buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
      out.push(`<blockquote>${md(buf.join('\n'))}</blockquote>`); continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      const ordered = /^\s*\d/.test(l); const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
        let item = lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, '');
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]))
          item += '\n' + lines[i++].trim();
        const sub = [];
        while (i < lines.length && /^\s{2,}([-*+]|\d+[.)])\s+/.test(lines[i])) sub.push(lines[i++].trim());
        items.push(inline(item).replace(/\n/g, '<br>') + (sub.length ? md(sub.join('\n')) : ''));
      }
      const tag = ordered ? 'ol' : 'ul';
      out.push(`<${tag}>${items.map(x => `<li>${x}</li>`).join('')}</${tag}>`); continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|>|\s*([-*+]|\d+[.)])\s+)/.test(lines[i])
           && !(lines[i].includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1]))) buf.push(lines[i++]);
    out.push(`<p>${buf.map(inline).join('<br>')}</p>`);
  }
  return out.join('');
}

/* ---------- Documents ---------- */
function renderDocs() {
  const f = $('filter').value.trim().toLowerCase();
  const list = allDocs.filter(d => d.source.toLowerCase().includes(f)
                                || (d.category || '').toLowerCase().includes(f));
  if (!list.length) {
    $('docs').innerHTML = `<div class="empty">${allDocs.length ? '没有匹配的文档' : '还没有文档，先上传一些吧'}</div>`;
    return;
  }
  const groups = new Map();
  for (const d of list) {
    const key = d.category || '未分类';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(d);
  }
  $('docs').innerHTML = [...groups.entries()].map(([cat, docs]) =>
    `<div class="cat"><span>${esc(cat)}</span><span class="line"></span><span>${docs.length}</span></div>` +
    docs.map(d => {
      const ext = d.source.split('.').pop().toLowerCase(); const [label, color] = TYPE[ext] || ['FILE', '#64748b'];
      return `<div class="doc"><div class="ico" style="background:${color}">${label}</div>
        <div class="meta"><div class="title" title="${esc(d.source)}">${esc(d.source)}</div><div class="sub">${d.chunks} 个片段</div></div>
        <button class="tag" data-cat="${esc(d.source)}" data-now="${esc(d.category || '未分类')}" title="修改分类">分类</button>
        <button class="download" data-name="${esc(d.source)}" title="下载原文件" aria-label="下载 ${esc(d.source)}">下载</button>
        <button class="del" data-name="${esc(d.source)}" title="删除">✕</button></div>`;
    }).join('')).join('');
}
async function loadDocs() {
  const d = await (await fetch('/api/documents')).json();
  allDocs = d.documents;
  if (d.bot_name && d.bot_name !== botName) {
    botName = d.bot_name;
    if ($('thread').querySelector('.welcome')) welcome();
  }
  $('catList').innerHTML = (d.categories || []).map(c => `<option value="${esc(c)}">`).join('');
  const tools = d.tools || [];
  $('modelInfo').textContent = d.chat_model;
  $('modelInfo').title = '当前对话模型：' + d.chat_model;
  $('modelInfo').hidden = !d.chat_model;
  refreshBadges();
  $('webBtn').hidden = !d.web_search;
  paintWeb();
  const chunks = allDocs.reduce((a, x) => a + x.chunks, 0);
  $('summary').textContent = `${allDocs.length} 个文档 · ${chunks} 个片段`;
  $('docCount').textContent = allDocs.length;
  renderDocs();
}
$('filter').oninput = renderDocs;
$('docs').onclick = async e => {
  const tag = e.target.closest('.tag');
  if (tag) {
    const next = prompt(`「${tag.dataset.cat}」的分类：`, tag.dataset.now);
    if (next === null) return;
    const value = next.trim();
    if (!value || value === tag.dataset.now) return;
    const r = await fetch('/api/documents/' + encodeURIComponent(tag.dataset.cat) + '/category',
                          {method: 'PATCH', headers: {'Content-Type': 'application/json'},
                           body: JSON.stringify({category: value})});
    if (!r.ok) {
      const d = await r.json().catch(() => ({detail: '服务器错误 ' + r.status}));
      alert('修改分类失败：' + (d.detail?.[0]?.msg || d.detail));
    }
    loadDocs();
    return;
  }
  const download = e.target.closest('.download');
  if (download) {
    download.disabled = true;
    download.textContent = '下载中';
    try {
      const r = await fetch('/api/documents/' + encodeURIComponent(download.dataset.name) + '/download');
      if (!r.ok) {
        const d = await r.json().catch(() => ({detail: '服务器错误 ' + r.status}));
        throw new Error(d.detail);
      }
      const url = URL.createObjectURL(await r.blob());
      const link = document.createElement('a');
      link.href = url;
      link.download = download.dataset.name;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (error) {
      alert('下载失败：' + error.message);
    } finally {
      download.disabled = false;
      download.textContent = '下载';
    }
    return;
  }
  const name = e.target.closest('.del')?.dataset.name;
  if (!name || !confirm(`确定删除「${name}」？`)) return;
  await fetch('/api/documents/' + encodeURIComponent(name), {method: 'DELETE'});
  loadDocs();
};

/* ---------- Upload ---------- */
let uploading = Promise.resolve();
function enqueue(files) {
  const category = $('newCat').value.trim();
  for (const f of files) {
    const job = document.createElement('div'); job.className = 'job';
    if (category) job.dataset.category = category;
    job.innerHTML = `<span class="spin"></span><span class="name">${esc(f.name)}</span><span>等待</span>`;
    $('queue').appendChild(job);
    uploading = uploading.then(() => upload(f, job));
  }
}
async function upload(f, job) {
  const state = job.lastElementChild;
  state.textContent = '处理中';
  try {
    const fd = new FormData();
    fd.append('file', f);
    if (job.dataset.category) fd.append('category', job.dataset.category);
    const r = await fetch('/api/documents', {method: 'POST', body: fd});
    const d = await r.json().catch(() => ({detail: `服务器错误 ${r.status}（响应不是 JSON，可能是网关超时）`}));
    job.querySelector('.spin')?.remove();
    if (!r.ok) {
      const reason = Array.isArray(d.detail) ? d.detail.map(x => x.msg || JSON.stringify(x)).join('；')
                                             : (d.detail || `HTTP ${r.status}`);
      job.classList.add('err');
      job.querySelector('.name').textContent = `${f.name}\n✕ ${reason}`;
      state.remove();
      job.insertAdjacentHTML('beforeend', '<button class="close" title="关闭">✕</button>');
      return;
    }
    const im = d.images || {};
    job.classList.add('done');
    state.textContent = `✓ ${d.chunks} 片段` + (im.described ? ` · ${im.described} 图` : '')
                      + (im.failed ? ` · ${im.failed} 图失败` : '') + ` · ${d.category}`;
    setTimeout(() => job.remove(), im.failed ? 15000 : 6000);
  } catch (e) {
    job.querySelector('.spin')?.remove();
    job.classList.add('err');
    job.querySelector('.name').textContent = `${f.name}\n✕ 网络中断或请求超时：${e.message}`;
    state.remove();
    job.insertAdjacentHTML('beforeend', '<button class="close" title="关闭">✕</button>');
  } finally { loadDocs(); }
}
$('queue').addEventListener('click', e => {
  if (e.target.closest('.close')) e.target.closest('.job').remove();
});
const drop = $('drop');
drop.onclick = () => $('files').click();
$('files').onchange = () => { enqueue([...$('files').files]); $('files').value = ''; };
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => enqueue([...e.dataTransfer.files]));
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); if (e.target.closest('#drop')) return; enqueue([...e.dataTransfer.files]); });

/* ---------- Chat ---------- */
const EXAMPLES = ['总结一下知识库里有哪些主要内容', '帮我做一次日常巡检',
                  '我的模型 key 能用哪些模型，额度还剩多少？', '2026 年国庆想连休到 10 月 11 日，要请几天年假？'];
let convId = null, botName = '小知';
function welcome() {
  $('thread').innerHTML = `<div class="welcome"><div class="logo">📚</div><h2>您好，我是${esc(botName)}</h2>
    <p>📄 读您上传的文档 · 🧩 照文档里的做法 · 🔧 用批准过的工具查真实数据</p>
    <div class="chips">${EXAMPLES.map(q => `<button class="chip">${esc(q)}</button>`).join('')}</div></div>`;
}
function sourcesHtml(sources) {
  return (sources || []).map(s => {
    if (s.web) {
      let host = '';
      try { host = new URL(s.url).hostname; } catch (_) {}
      const safe = /^https?:\/\//.test(s.url || '') ? s.url : '#';
      return `<details class="src web" data-n="${esc(s.index)}"><summary><span class="n">🌐 ${esc(s.index)}</span>
        <span class="loc" title="${esc(s.location)}">${esc(s.location)}</span>
        <span class="host">${esc(host)}</span></summary>
        <div class="body">${esc(s.text)}<br><a href="${esc(safe)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a></div></details>`;
    }
    const pct = Math.max(0, Math.min(100, Math.round(s.score * 100)));
    return `<details class="src" data-n="${s.index}"><summary><span class="n">[${s.index}]</span>
      <span class="loc" title="${esc(s.location)}">${esc(s.location)}</span>
      <span class="bar" title="相似度 ${s.score}"><i style="width:${pct}%"></i></span></summary>
      <div class="body">${esc(s.text)}</div></details>`;
  }).join('');
}
function addUser(text) {
  $('thread').insertAdjacentHTML('beforeend', `<div class="msg user"><div class="bubble-user">${esc(text)}</div></div>`);
}
function addBot(inner) {
  const id = ++seq;
  $('thread').insertAdjacentHTML('beforeend',
    `<div class="msg"><div class="avatar">📚</div><div class="bot" id="bot${id}">
       <div class="steps"></div><div class="card">${inner}</div><div class="sources"></div></div></div>`);
  return $('bot' + id);
}
/* 检索在模型判断之前就完成了，候选片段不等于答案依据。
   回答结束后按正文里实际引用的编号整理：被引用的正常展示，其余收进一个折叠项。 */
function arrangeSources(bot, text, done) {
  const box = bot.querySelector('.sources');
  const all = [...box.querySelectorAll('.src')];
  if (!all.length) return;
  const cited = new Set([...(text || '').matchAll(/\[(W?\d{1,2})\]/g)].map(m => m[1]));
  const used = all.filter(s => cited.has(s.dataset.n));
  const unused = all.filter(s => !cited.has(s.dataset.n));
  box.innerHTML = '';
  used.forEach(s => box.appendChild(s));
  if (!unused.length) return;
  const kb = unused.filter(s => !s.classList.contains('web')).length;
  const web = unused.length - kb;
  const usedKb = used.some(s => !s.classList.contains('web'));
  let label;
  if (!done) label = `候选片段 ${unused.length} 个，正在判断是否相关…`;
  else if (kb && !usedKb) label = `知识库检索到 ${kb} 个片段，判断与问题无关，未采用`
                                  + (web ? `；另有 ${web} 条网络结果未引用` : '');
  else label = `另有 ${[kb && kb + ' 个知识库片段', web && web + ' 条网络结果'].filter(Boolean).join('、')} 未被引用`;
  const group = document.createElement('details');
  group.className = 'src-unused';
  group.innerHTML = `<summary>${esc(label)}（点击展开）</summary>`;
  unused.forEach(s => group.appendChild(s));
  box.appendChild(group);
}
function addTools(bot, text, question, sources) {
  bot.dataset.raw = text;
  bot.dataset.q = question;
  const web = (sources || []).filter(s => s.web);
  bot._web = web;
  bot.insertAdjacentHTML('beforeend',
    `<div class="tools"><button data-copy>⧉ 复制</button><button data-retry="${esc(question)}">↻ 重新回答</button>${
      web.length && text.trim() ? '<button data-savenote title="确认这段网络答案可信后，存为知识库文档，下次直接从知识库回答">📥 存入知识库</button>' : ''}</div>`);
}

/* 把联网得到的答案存进知识库：先给出可编辑的预览，人确认后才入库。 */
function noteEditor(bot) {
  const box = document.createElement('div');
  box.className = 'note-edit';
  const title = (bot.dataset.q || '').replace(/[？?。！!\s]+$/, '').slice(0, 40);
  box.innerHTML = `<div class="hd">存入知识库 · 请先确认内容无误</div>
    <input class="nt" maxlength="60" value="${esc(title)}" placeholder="文档标题">
    <textarea class="nb">${esc((bot.dataset.raw || '').replace(/^\s*(\*\*)?知识库(里|中)没有[^\n]*\n+/, ''))}</textarea>
    <div class="src-list">参考来源：${bot._web.map(s => esc(s.index) + ' ' + esc(s.location)).join('；')}</div>
    <div class="row"><button class="ok" data-notego>确认存入</button><button class="cancel" data-notecancel>取消</button>
      <span class="msg"></span></div>

}
async function saveNote(bot, box) {
  const msg = box.querySelector('.msg');
  const body = {title: box.querySelector('.nt').value.trim(), question: bot.dataset.q || '',
                answer: box.querySelector('.nb').value.trim(),
                sources: bot._web.map(s => ({index: s.index, location: s.location, url: s.url}))};
  if (!body.title || !body.answer) { msg.textContent = '标题和内容都不能为空'; return; }
  box.querySelector('[data-notego]').disabled = true;
  msg.textContent = '正在入库…';
  try {

                                             body: JSON.stringify(body)});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : '保存失败');
    box.innerHTML = `<div class="done">✓ 已存入知识库：${esc(d.source)}（${d.chunks} 个片段）。下次问到相同问题会直接从知识库回答。</div>`;
    const btn = bot.querySelector('[data-savenote]'); if (btn) { btn.textContent = '✓ 已存入'; btn.disabled = true; }

async function openConv(id) {
  const r = await fetch('/api/conversations/' + encodeURIComponent(id));
  if (!r.ok) { convId = null; welcome(); return; }
  const d = await r.json();
  convId = id;
  $('thread').innerHTML = '';

  for (const m of d.messages) {

    const bot = addBot(`<div class="answer">${md(m.content)}</div>`);
    bot.querySelector('.sources').innerHTML = sourcesHtml(m.sources);

let pbTools = {}, pbEditing = null, pbPicking = false, pbDocFilter = '';

function pbStepsText(steps) {
  // 一行一步：工具 | 参数JSON | 检查点
  return steps.map(s => [s.tool, JSON.stringify(s.args || {}), s.checkpoint || ''].join(' | ')).join('\n');
}
function pbParseSteps(text) {
  const steps = [];
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line) continue;
    const parts = line.split('|');
    const tool = (parts[0] || '').trim();
    if (!tool) continue;
    let args = {};
    const argText = (parts[1] || '').trim();
    if (argText) {
      try { args = JSON.parse(argText); }
      catch { throw new Error(`参数不是合法 JSON：${argText}`); }
      if (typeof args !== 'object' || Array.isArray(args)) throw new Error('参数必须是 JSON 对象');
    }
    steps.push({tool, args, checkpoint: parts.slice(2).join('|').trim()});
  }
  if (!steps.length) throw new Error('至少需要一个步骤');
  return steps;
}

function pbCard(p) {
  const bad = (p.missing_tools || []).length;
  const steps = p.steps.map((s, i) => {
    const args = Object.entries(s.args || {}).filter(([, v]) => v).map(([k, v]) => `${k}=${v}`).join(' ');
    return `<div class="pb-step"><span class="i">${i + 1}</span>
      <span class="tl">${esc(s.tool)}</span>
      <span class="ck">${esc(args ? args + ' · ' : '')}${esc(s.checkpoint)}</span></div>`;
  }).join('');
  return `<div class="pb${p.enabled ? '' : ' off'}${bad ? ' bad' : ''}" data-id="${p.id}">
    <div class="pb-top">
      <span class="nm" title="${esc(p.name)}">${esc(p.name)}</span>
      <span class="src">${esc(p.source)}</span>
      <button data-toggle="${p.id}">${p.enabled ? '已启用' : '已停用'}</button>
      <button data-edit="${p.id}">编辑</button>
      <button data-del="${p.id}">删除</button>
    </div>
    ${bad ? `<div class="pb-warn">⚠ 引用了当前不可用的工具：${esc(p.missing_tools.join('、'))}，该技能不会生效</div>` : ''}
    <div class="pb-body">
      ${p.trigger ? `<div class="pb-trig">适用：${esc(p.trigger)}</div>` : ''}
      ${steps}
    </div></div>`;
}

function pbEditor(p) {
  const tools = Object.entries(pbTools).map(([n, d]) => `${n}：${d}`).join('\n');
  return `<div class="pb pb-edit" data-id="${p.id || ''}">
    <div class="pb-top"><span class="nm">${p.id ? '编辑技能' : '新建技能'}</span></div>
    <div class="pb-body">
      <input id="pbName" placeholder="技能名称" maxlength="60" value="${esc(p.name || '')}"
             style="width:100%;box-sizing:border-box;padding:7px 9px;border-radius:7px;
                    border:1px solid var(--border);background:var(--panel-2);color:var(--text);font:inherit">
      <input id="pbTrigger" placeholder="什么情况下用它，例如：用户反馈服务反复重启" maxlength="200"
             value="${esc(p.trigger || '')}"
             style="width:100%;box-sizing:border-box;margin-top:6px;padding:7px 9px;border-radius:7px;
                    border:1px solid var(--border);background:var(--panel-2);color:var(--text);font:inherit">
      <div style="margin:8px 0 4px;color:var(--muted);font-size:12px">
        步骤，一行一步：<code>工具 | 参数JSON | 检查点</code></div>
      <textarea id="pbSteps" spellcheck="false">${esc(pbStepsText(p.steps || []))}</textarea>
      <div class="pb-err" id="pbErr" hidden></div>
      <div class="row"><button class="ok" id="pbSave">保存</button>
        <button class="cancel" id="pbCancel">取消</button></div>
      <div class="pb-tools">可用工具：\n${esc(tools || '（无）')}</div>
    </div></div>`;
}

function pbPicker() {
  const f = pbDocFilter.trim().toLowerCase();
  const matched = allDocs.filter(d => !f || d.source.toLowerCase().includes(f)
                                        || (d.category || '').toLowerCase().includes(f));
  const options = matched.map(d =>
    `<option value="${esc(d.source)}">${esc(d.source)}　[${esc(d.category || '未分类')}]</option>`).join('');
  return `<div class="pb-pick">
    <div class="hd">从哪个文档抽取技能？</div>
    <input id="pbDocFilter" placeholder="输入关键字筛选文档名或分类…" value="${esc(pbDocFilter)}">

    <div class="row">
      <span class="cnt">共 ${allDocs.length} 个文档${f ? `，匹配 ${matched.length} 个` : ''}</span>
      <button class="go" id="pbDoExtract"${matched.length ? '' : ' disabled'}>开始抽取</button>
      <button class="cancel" id="pbPickCancel">取消</button>

async function loadPlaybooks() {
  const d = await (await fetch('/api/playbooks')).json();
  pbTools = d.tools || {};
  const list = d.playbooks || [];
  const sc = countSkills(list);
  setBadge('pbBadge', sc, '生效');
  $('pbPanel').innerHTML =
    `<div class="pb-head"><span class="t">技能<small>${sc.live} 个生效 · 共 ${sc.total} 个</small></span>
       <button class="icon-btn" id="pbNew">＋ 新建</button>
       <button class="icon-btn" id="pbFromDoc">从文档抽取</button></div>
     <div class="tl-note">📄 文档写了怎么做 → 🧩 技能定好按什么顺序做 → 🔧 工具去执行。<br>
       适用于故障排查、日常巡检、上线前检查、上线后验收。技能只能调用已有工具，不能新增执行能力。</div>` +
    (pbPicking ? pbPicker() : '') +
    (pbEditing !== null ? pbEditor(pbEditing) : '') +
    (list.length ? list.map(pbCard).join('')

$('pbPanel').addEventListener('click', async e => {
  const id = t => e.target.closest(`[data-${t}]`)?.dataset[t];

  if (e.target.id === 'pbNew') { pbPicking = false; pbEditing = {steps: []}; return loadPlaybooks(); }

  if (e.target.id === 'pbFromDoc') {
    if (!allDocs.length) return alert('还没有文档，请先上传');
    pbEditing = null; pbDocFilter = ''; pbPicking = true;
    return loadPlaybooks();
  }

  if (e.target.id === 'pbPickCancel') { pbPicking = false; return loadPlaybooks(); }

  if (e.target.id === 'pbDoExtract') {
    const doc = $('pbDocSelect').value;
    const err = $('pbPickErr');
    err.hidden = true;
    if (!doc) { err.textContent = '请先选择一个文档'; err.hidden = false; return; }
    const btn = e.target;
    btn.disabled = true;
    btn.textContent = '抽取中…';
    try {
      const r = await fetch('/api/playbooks/extract', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({source: doc})});
      const d = await r.json();
      if (!r.ok) throw new Error(Array.isArray(d.detail)
        ? d.detail.map(x => x.msg).join('；') : d.detail);
      pbPicking = false;
      await loadPlaybooks();
      loadDocs();
      alert(d.extracted.length
        ? `从《${doc}》抽取出 ${d.extracted.length} 个技能，已默认停用。\n请核对步骤无误后再启用。`
          + (d.note ? `\n\n${d.note}` : '')
        : `《${doc}》没有抽出技能。\n\n原因：${d.note || '未知'}`);
    } catch (ex) {
      btn.disabled = false;
      btn.textContent = '开始抽取';
      err.textContent = '抽取失败：' + ex.message;
      err.hidden = false;
    }
    return;
  }

  if (e.target.id === 'pbCancel') { pbEditing = null; return loadPlaybooks(); }

  if (e.target.id === 'pbSave') {
    const err = $('pbErr');
    err.hidden = true;
    let steps;
    try { steps = pbParseSteps($('pbSteps').value); }
    catch (ex) { err.textContent = ex.message; err.hidden = false; return; }
    const body = {name: $('pbName').value.trim(), trigger: $('pbTrigger').value.trim(),
                  steps, enabled: true};
    const editId = e.target.closest('.pb-edit').dataset.id;
    const r = await fetch('/api/playbooks' + (editId ? '/' + editId : ''),
      {method: editId ? 'PUT' : 'POST', headers: {'Content-Type': 'application/json'},
       body: JSON.stringify(body)});
    if (!r.ok) {
      const d = await r.json().catch(() => ({detail: '服务器错误 ' + r.status}));
      err.textContent = Array.isArray(d.detail)
        ? d.detail.map(x => x.msg).join('；') : d.detail;
      err.hidden = false;
      return;
    }
    pbEditing = null;
    loadPlaybooks(); loadDocs();
    return;
  }

  const editId = id('edit');
  if (editId) {
    const d = await (await fetch('/api/playbooks')).json();
    pbPicking = false;
    pbEditing = d.playbooks.find(p => p.id === editId) || {steps: []};
    return loadPlaybooks();
  }

  const delId = id('del');
  if (delId) {
    if (!confirm('确定删除这个技能？')) return;
    await fetch('/api/playbooks/' + delId, {method: 'DELETE'});
    return loadPlaybooks().then(loadDocs);
  }

  const toggleId = id('toggle');
  if (toggleId) {
    const d = await (await fetch('/api/playbooks')).json();
    const p = d.playbooks.find(x => x.id === toggleId);
    if (!p) return;
    await fetch('/api/playbooks/' + toggleId, {
      method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: p.name, trigger: p.trigger, steps: p.steps,
                            enabled: !p.enabled})});
    return loadPlaybooks().then(loadDocs);
  }
});

/* ---- 工具面板 -------------------------------------------------------
   页面能做的事是有意划清的：
     启停、改描述 -> 直接生效，因为它们都不改变实际执行的命令；
     新增工具     -> 只能提交申请，必须有人在宿主机上批准。
   命令模板只在宿主机那份手写配置里定义，这个界面碰不到。            */
let tlEditing = null, tlProposing = false, tlProposeKind = 'command';
let tlScripts = [], tlScriptSel = '', tlScriptDir = '';

function tlCard(name, t) {
  const params = Object.entries(t.params || {});
  const editing = tlEditing === name;
  const field = 'width:100%;box-sizing:border-box;font:inherit;font-size:12.5px;padding:7px;'
              + 'border-radius:7px;border:1px solid var(--border);background:var(--panel-2);color:var(--text)';
  return `<div class="pb ${t.enabled ? '' : 'off'} ${t.runnable ? '' : 'bad'}">
    <div class="pb-top">
      <span class="nm">${esc(t.label || name)}</span>
      ${t.label ? `<span class="src">${esc(name)}</span>` : ''}
      ${(t.overridden || []).length ? '<span class="src">已在页面改过</span>' : ''}
      <button data-tledit="${esc(name)}">${editing ? '收起' : '改名/说明'}</button>
      <button data-tltoggle="${esc(name)}">${t.enabled ? '停用' : '启用'}</button>
    </div>
    <div class="pb-body">
      ${editing ? `<input id="tlLabel" maxlength="40" style="${field};margin-bottom:5px"
                     placeholder="中文显示名，可留空（工具名 ${esc(name)} 是发给模型的，不能改）"
                     value="${esc(t.label || '')}">
          <textarea id="tlDesc" maxlength="300" style="${field};min-height:62px;resize:vertical"
                     placeholder="这个工具能回答什么问题？写清楚，模型靠它判断要不要调用">${esc(t.desc)}</textarea>
          <div class="pb-edit"><div class="row">
            <button class="ok" data-tlsave="${esc(name)}">保存</button>
            ${(t.overridden || []).length
              ? `<button class="cancel" data-tlreset="${esc(name)}">恢复配置文件原值</button>` : ''}
          </div></div>`
        : `<div class="pb-trig">${esc(t.desc)}</div>`}
      <div class="tl-cmd">${esc(t.command)}</div>
      ${params.length ? `<div class="tl-params">${params.map(([key, p]) =>
          `<span><code>${esc(key)}</code> ${p.required ? '必填' : '可选'}${
            p.desc ? '：' + esc(p.desc) : ''}</span>`).join('')}</div>` : ''}
      ${t.runnable ? '' : `<div class="pb-warn">⚠ 本机没有 ${esc(t.binary)}，该工具不可用</div>`}
    </div>
  </div>`;
}

function tlGrouped(names, tools) {
  const groups = {};
  for (const n of names) (groups[tools[n].group || '其他'] ||= []).push(n);
  const order = Object.keys(groups).sort((a, b) => (a === '其他') - (b === '其他') || a.localeCompare(b, 'zh'));
  return order.map(g => {
    const live = groups[g].filter(n => tools[n].enabled && tools[n].runnable).length;
    return `<div class="tl-group">${esc(g)}<span>${live}/${groups[g].length}</span></div>`
         + groups[g].map(n => tlCard(n, tools[n])).join('');
  }).join('');
}

    note = `脚本的<b>内容只能由宿主机管理员放入</b>，页面只能从已有脚本里选一个来引用——

  } else if (tlProposeKind === 'http') {
    body = `<input id="tlNewUrl" placeholder="接口地址，如 https://api.example.com/v1/status（只允许 GET）" maxlength="300">`;
    note = `适合查询公开或内网的<b>只读接口</b>，例如天气、汇率、状态页、工单查询。<br>
            页面申请的接口<b>不能带请求头和凭据</b>；需要登录鉴权的接口，请管理员在宿主机配置文件里添加，
            密钥只放在宿主机环境变量中，模型和页面都看不到。`;
  } else {
    body = `<input id="tlNewCmd" placeholder="完整命令，如 date +%H:%M" maxlength="200">`;
    note = `工具名会作为函数名发给模型，按 function calling 规范<b>只能用英文</b>；中文写在「显示名」里。<br>
            只能申请<b>固定命令</b>（不带参数、不含管道和重定向）。要跑一段逻辑，请改用「脚本」。`;
  }

  return `<div class="pb-pick tl-pick">
    <div class="hd">申请新工具</div>
    <div class="tl-tabs">${tab('command', '命令')}${tab('http', '接口')}${tab('script', '脚本')}</div>
    ${common}
    ${body}
    <div class="tl-note">${note}<br>提交后<b>不会生效</b>，要在宿主机上批准——页面定义不了宿主机执行什么。</div>
    <div class="pb-edit"><div class="row">
      <button class="ok" id="tlDoPropose">提交申请</button>
      <button class="cancel" id="tlCancelPropose">取消</button>
    </div></div>
    <div class="pb-err" id="tlProposeErr" hidden></div>
  </div>`;
}

function tlWaiting(items) {
  if (!items.length) return '';
  return `<div class="tl-wait">⏳ ${items.length} 条申请待批准，在宿主机上执行：
    <div class="cmd">python3 /opt/ops/ops_readonly.py pending</div>
    ${items.map(i => {
      const t = i.tool || {};
      const what = t.script ? '脚本 ' + t.script
                 : t.http ? 'GET ' + (t.http.url || '') : (t.argv || []).join(' ');
      return `<div class="cmd">[${esc(i.id)}] ${esc(t.name || '')}　${esc(what)}</div>`;
    }).join('')}
  </div>`;
}

async function loadTools() {
  const d = await (await fetch('/api/tools')).json();
  const tools = d.tools || {};
  const names = Object.keys(tools).sort();
  const tc = countTools(tools);
  setBadge('tlBadge', tc, '可用');
  // 工具停用/启用会改变技能是否生效，顺带刷新技能徽标。
  fetch('/api/playbooks').then(r => r.json()).then(p => setBadge('pbBadge', countSkills(p.playbooks), '生效')).catch(() => {});
  const waiting = tlProposing ? [] : await (await fetch('/api/tools/pending')).json()
    .then(r => r.pending || []).catch(() => []);
  if (tlProposing && tlProposeKind === 'script') {
    const s = await (await fetch('/api/tools/scripts')).json().catch(() => ({}));
    tlScripts = s.scripts || [];
    tlScriptDir = s.directory || '';
  }
  $('tlPanel').innerHTML =
    `<div class="pb-head"><span class="t">工具<small>${tc.live} 个可用 · 共 ${tc.total} 个</small></span>
       <button class="icon-btn" id="tlNew">＋ 申请新工具</button></div>` +
    (d.error ? `<div class="pb-warn">工具接口不可用：${esc(d.error)}</div>` : '') +
    (tlProposing ? tlProposeForm() : tlWaiting(waiting)) +
    (names.length ? tlGrouped(names, tools)
                  : '<div class="empty">还没有可用工具。配置 OPS_URL 后，Agent 就能查询真实数据。</div>') +
    `    <div class="tl-note">停用、改名和改说明立刻生效，不重启服务；新增工具需要宿主机批准。</div>`;
  if (tlProposing) $('tlNewName').focus();
  if (tlEditing) {
    const box = $('tlLabel') || $('tlDesc');
    if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
  }
}

$('tlBtn').onclick = () => {
  $('tlPanel').hidden = !$('tlPanel').hidden;
  if (!$('tlPanel').hidden) { tlEditing = null; tlProposing = false; loadTools(); }
};
document.addEventListener('click', e => {
  if (!e.target.closest('.tl-wrap')) $('tlPanel').hidden = true;
});

async function tlSend(path, body) {
  const r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'},
                              body: JSON.stringify(body)});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || r.status);
  return d;
}

$('tlPanel').addEventListener('click', async e => {
  const pick = key => e.target.closest(`[data-${key}]`)?.dataset[key];

  if (e.target.id === 'tlNew') {
    tlEditing = null; tlProposing = true; tlProposeKind = 'command'; return loadTools();
  }
  if (e.target.id === 'tlCancelPropose') { tlProposing = false; return loadTools(); }

  const kind = pick('tlkind');
  if (kind && kind !== tlProposeKind) { tlProposeKind = kind; return loadTools(); }

  const edit = pick('tledit');
  if (edit) { tlEditing = tlEditing === edit ? null : edit; return loadTools(); }

  const toggle = pick('tltoggle');
  if (toggle) {
    const was = e.target.textContent.trim() === '停用';
    try { await tlSend('/api/tools/override', {name: toggle, enabled: !was}); }
    catch (err) { alert('操作失败：' + err.message); }
    return loadTools();
  }

  const save = pick('tlsave');
  if (save) {
    const desc = $('tlDesc').value.trim();
    if (!desc) return alert('说明不能为空');
    try {
      await tlSend('/api/tools/override',
                   {name: save, desc, label: $('tlLabel').value.trim()});
      tlEditing = null;
    } catch (err) { alert('保存失败：' + err.message); }
    return loadTools();
  }

  const reset = pick('tlreset');
  if (reset) {
    try { await tlSend('/api/tools/override', {name: reset, reset: true}); tlEditing = null; }
    catch (err) { alert('恢复失败：' + err.message); }
    return loadTools();
  }

  if (e.target.id === 'tlDoPropose') {
    const err = $('tlProposeErr');
    const fail = msg => { err.hidden = false; err.textContent = msg; };
    const base = {name: $('tlNewName').value.trim(), label: $('tlNewLabel').value.trim(),
                  desc: $('tlNewDesc').value.trim(), params: {}};
    let payload;
    if (tlProposeKind === 'script') {
      const script = $('tlNewScript') ? $('tlNewScript').value : '';
      if (!script) return fail('请先选择一个脚本');
      payload = {...base, script};
    } else if (tlProposeKind === 'http') {
      const url = $('tlNewUrl').value.trim();
      if (!/^https?:\/\//.test(url)) return fail('接口地址要以 http:// 或 https:// 开头');
      payload = {...base, http: {url}};
    } else {
      const parts = $('tlNewCmd').value.trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return fail('请填写完整命令');
      payload = {...base, binary: parts[0], argv: parts};
    }
    try {
      const d = await tlSend('/api/tools/propose', payload);
      tlProposing = false;
      await loadTools();
      const extra = tlProposeKind === 'script'
        ? `  python3 /opt/ops/ops_readonly.py pending\n`
          + `  （逐行读一遍脚本，确认无误）\n`
          + `  python3 /opt/ops/ops_readonly.py approve ${d.pending.id}\n`
        : `  python3 /opt/ops/ops_readonly.py pending\n`
          + `  python3 /opt/ops/ops_readonly.py approve ${d.pending.id}\n`;
      alert(`申请已提交（编号 ${d.pending.id}）。\n\n`
            + `它现在还不能用。请在宿主机上执行：\n` + extra
            + `\n批准后下一次提问即可使用，无需重启。`);
    } catch (e2) { fail('提交失败：' + e2.message); }
  }
});

$('tlPanel').addEventListener('change', e => {
  if (e.target.id === 'tlNewScript') { tlScriptSel = e.target.value; loadTools(); }
});

async function ask() {
  const q = $('question').value.trim();
  if (!q || $('askBtn').disabled) return;
  $('question').value = ''; autosize();
  if ($('thread').querySelector('.welcome')) $('thread').innerHTML = '';
  addUser(q);
  const bot = addBot('<div class="status"><span class="spin"></span>正在检索知识库…</div><div class="answer"></div>');
  const card = bot.querySelector('.card'), ans = bot.querySelector('.answer');
  toBottom();
  $('askBtn').disabled = true;
  let text = '', pending = false, finished = false;
  const webSrc = [];
  // 渲染推迟到下一帧；流结束后才执行的那一帧不能再把光标加回去。
  const paint = () => { pending = false; if (finished) return; const stick = nearBottom(); ans.innerHTML = md(text); ans.classList.add('cursor'); if (stick) toBottom(); };
  try {
    const r = await fetch('/api/ask', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                       body: JSON.stringify({question: q, conversation_id: convId, web: webOn})});
    if (!r.ok) { const d = await r.json().catch(() => ({detail: r.status})); throw new Error(d.detail); }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream: true}); let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const msg = JSON.parse(buf.slice(0, nl)); buf = buf.slice(nl + 1);
        if (msg.conversation) {
          convId = msg.conversation.id;
        } else if (msg.sources) {
          card.querySelector('.status').innerHTML = msg.sources.length ? `<span class="spin"></span>检索到 ${msg.sources.length} 个候选片段，正在判断是否相关…` : '';
          bot.querySelector('.sources').innerHTML = sourcesHtml(msg.sources);
          arrangeSources(bot, '', false);
        } else if (msg.tool_call) {
          const isWeb = msg.tool_call.tool === 'web_search';
          const args = isWeb ? (msg.tool_call.args || {}).query || ''
            : Object.entries(msg.tool_call.args || {}).map(([k, v]) => `${k}=${v}`).join(' ');
          card.querySelector('.status').innerHTML = isWeb
            ? `<span class="spin"></span>知识库里没有足够信息，正在上网搜索…`
            : `<span class="spin"></span>正在查询：${esc(msg.tool_call.tool)}…`;
          bot.querySelector('.steps').insertAdjacentHTML('beforeend',
            `<details class="step running ${isWeb ? 'web' : ''}"><summary><span class="ico">${isWeb ? '🌐' : '🔧'}</span>
               <span class="cmd">${isWeb ? '上网搜索' : esc(msg.tool_call.tool)}</span>
               <span class="arg">${esc(args)}</span>
               <span class="n">执行中…</span></summary>
             <div class="out"></div></details>`);
          if (nearBottom()) toBottom();
        } else if (msg.web_sources) {
          webSrc.push(...msg.web_sources);
          bot.querySelector('.sources').insertAdjacentHTML('beforeend', sourcesHtml(msg.web_sources));
          arrangeSources(bot, '', false);
        } else if (msg.tool_result) {
          const steps = bot.querySelectorAll('.step.running');
          const step = steps[steps.length - 1];
          if (step) {
            step.classList.remove('running');
            step.querySelector('.n').textContent = `${msg.tool_result.lines} 行`;
            step.querySelector('.out').textContent = msg.tool_result.preview;
          }
          if (nearBottom()) toBottom();
        } else if (msg.delta) {
          card.querySelector('.status')?.remove();
          text += msg.delta;
          if (!pending) { pending = true; requestAnimationFrame(paint); }
        } else if (msg.error) {
          text += `\n\n⚠️ ${msg.error}`;
        }
      }
    }
    finished = true;
    card.querySelector('.status')?.remove();
    ans.innerHTML = md(text || '（没有返回内容）');
  } catch (e) {
    finished = true;
    card.querySelector('.status')?.remove();
    ans.innerHTML = md(text) + `<p class="error">请求失败：${esc(e.message)}</p>`;
  } finally {
    finished = true;
    ans.classList.remove('cursor');
    arrangeSources(bot, text, true);
    addTools(bot, text, q, webSrc);
    $('askBtn').disabled = false; $('question').focus();
    loadConvs();
  }
}

function autosize() { const t = $('question'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 180) + 'px'; }

/* 顶栏徽标与面板标题共用同一套口径，避免两处数字对不上：
   工具「可用」= 已启用且本机能运行；技能「生效」= 已启用且引用的工具都可用。 */
const countTools = tools => {
  const all = Object.values(tools || {});
  return {live: all.filter(t => t.enabled && t.runnable).length, total: all.length};
};
const countSkills = list => ({
  live: (list || []).filter(p => p.enabled && !(p.missing_tools || []).length).length,
  total: (list || []).length,
});
function setBadge(id, c, what) {
  const b = $(id);
  b.textContent = c.total ? `${c.live}/${c.total}` : '';
  b.classList.toggle('on', c.live > 0);
  b.title = `${c.live} 个${what}，共 ${c.total} 个`;
}
async function refreshBadges() {
  try {
    const [t, p] = await Promise.all([fetch('/api/tools').then(r => r.json()),
                                      fetch('/api/playbooks').then(r => r.json())]);
    setBadge('tlBadge', countTools(t.tools), '可用');
    setBadge('pbBadge', countSkills(p.playbooks), '生效');
  } catch (_) { /* 徽标只是提示，失败不影响使用 */ }
}
/* 面板开着时，对应按钮高亮。 */
document.addEventListener('click', () => setTimeout(() => {
  $('tlBtn').classList.toggle('open', !$('tlPanel').hidden);
  $('pbBtn').classList.toggle('open', !$('pbPanel').hidden);
  $('histBtn').classList.toggle('open', !$('histPanel').hidden);
}, 0));

/* 联网开关：默认开启，记在浏览器里。服务端没配置搜索时按钮不显示。 */
let webOn = localStorage.getItem('kb-web') !== 'off';
function paintWeb() {
  $('webBtn').classList.toggle('on', webOn);
  $('webBtn').title = webOn ? '联网已开启：知识库答不了时会上网搜索公开资料（内部问题不会外发）。点击关闭'
                            : '联网已关闭：只用知识库和工具回答。点击开启';
}
$('webBtn').onclick = () => { webOn = !webOn; localStorage.setItem('kb-web', webOn ? 'on' : 'off'); paintWeb(); };
$('question').addEventListener('input', autosize);
$('question').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); }
});
$('askBtn').onclick = ask;
$('newBtn').onclick = newConv;
$('menuBtn').onclick = () => document.body.classList.toggle('menu');
$('scrim').onclick = () => document.body.classList.remove('menu');
welcome(); loadDocs(); loadConvs(); $('question').focus();
</script>
