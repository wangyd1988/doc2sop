# 对应《Kube-OVN + ingress-nginx 访问超时排查》的演示环境
apiVersion: v1
kind: Namespace
metadata: {name: ingress-nginx}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ingress-nginx-controller, namespace: ingress-nginx}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: ingress-nginx}}
  template:
    metadata: {labels: {app.kubernetes.io/name: ingress-nginx}}
    spec:
      containers:
      - name: controller
        image: busybox:1.36
        command: ["sh","-c"]
        args:
        - |
          echo 'I1018 12:00:01 nginx-ingress-controller started, class=nginx'
          while true; do
            echo "W$(date -u +%m%d\ %T) controller.go:1210] Service \"biz/order-web\" does not have any active Endpoint."
            echo "$(date -u +%FT%TZ) 10.2.0.9 - - \"GET / HTTP/1.1\" 503 190 \"-\" \"curl/8.5\" host=order.biz.example.com upstream=-"
            sleep 30
          done
        resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {memory: 32Mi}}
---
apiVersion: v1
kind: Namespace
metadata: {name: biz}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: order-web, namespace: biz}
spec:
  replicas: 2
  selector: {matchLabels: {app: order-web}}
  template:
    metadata: {labels: {app: order-web}}        # Pod 标签是 app=order-web
    spec:
      containers:
      - name: web
        image: busybox:1.36
        command: ["sh","-c","while true; do echo 'order-web listening on :8080'; sleep 300; done"]
        ports: [{containerPort: 8080}]
        resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {memory: 32Mi}}
---
# 故障：Service 选择器写成 app=order-web-v2，所以 Endpoints 为空
apiVersion: v1
kind: Service
metadata: {name: order-web, namespace: biz}
spec:
  selector: {app: order-web-v2}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: order-web, namespace: biz}
spec:
  ingressClassName: nginx
  rules: [{host: order.biz.example.com, http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: order-web, port: {number: 80}}}}]}}]
---
# 对照组：正常服务
apiVersion: apps/v1
kind: Deployment
metadata: {name: user-api, namespace: biz}
spec:
  replicas: 1
  selector: {matchLabels: {app: user-api}}
  template:
    metadata: {labels: {app: user-api}}
    spec:
      containers:
      - name: api
        image: busybox:1.36
        command: ["sh","-c","while true; do echo 'user-api ok'; sleep 300; done"]
        ports: [{containerPort: 8080}]
        resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {memory: 32Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: user-api, namespace: biz}
spec:
  selector: {app: user-api}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: user-api, namespace: biz}
spec:
  ingressClassName: nginx
  rules: [{host: user.biz.example.com, http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: user-api, port: {number: 80}}}}]}}]
