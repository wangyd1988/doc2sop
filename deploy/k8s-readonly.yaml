# 工具服务查 K8s 用的只读 ServiceAccount：kubectl 版的 kube_* 和 deploy/templates/k8s-api.yaml 都用它。
# 用法、令牌怎么签和续、怎么撤销：docs/正式部署.md「K8s 只读账号」。
#
#   kubectl apply -f deploy/k8s-readonly.yaml
#   kubectl -n doc2sop create token ops-readonly --duration=2160h
#
# 权限 = 内置的 view（各命名空间常见资源只读，读不了 Secret，看不到 Role / RoleBinding）
#      + 下面的 extra（view 不含的集群级只读资源）。集群里有别的 CRD 要查就照样加 get/list/watch；
# 里面有凭据的资源只给 list 或不给（见 wasmplugins）。撤销：kubectl delete -f deploy/k8s-readonly.yaml，签出的令牌随之失效。
apiVersion: v1
kind: Namespace
metadata:
  name: doc2sop
  labels: {doc2sop/role: ops-readonly}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-readonly
  namespace: doc2sop
  labels: {doc2sop/role: ops-readonly}
automountServiceAccountToken: false     # 只给工具服务签令牌用，不挂进任何 Pod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: doc2sop-ops-readonly-view
  labels: {doc2sop/role: ops-readonly}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects:
  - {kind: ServiceAccount, name: ops-readonly, namespace: doc2sop}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: doc2sop-ops-readonly-extra
  labels: {doc2sop/role: ops-readonly}
rules:
  - apiGroups: [""]
    resources: [nodes, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]     # kubectl describe node 要读节点的心跳 Lease
    resources: [leases]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses, gateways, httproutes, grpcroutes, tcproutes, tlsroutes, udproutes, referencegrants,
                backendtlspolicies, listenersets]
    verbs: [get, list, watch]
  # Higress 插件：只给 list。巡检用 kube_list（-o wide 只出几列）看插件在不在就够了；不给 get，
  # kube_yaml、kube_describe 读不到插件配置（里面常有第三方服务的 key）
  - apiGroups: [extensions.higress.io]
    resources: [wasmplugins]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: doc2sop-ops-readonly-extra
  labels: {doc2sop/role: ops-readonly}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: doc2sop-ops-readonly-extra}
subjects:
  - {kind: ServiceAccount, name: ops-readonly, namespace: doc2sop}
